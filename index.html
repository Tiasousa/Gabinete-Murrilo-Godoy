<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gabinete Digital — Vereador Murillo Godoy</title>
<link rel="apple-touch-icon" sizes="180x180" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gabinete Digital">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Gabinete Digital">
<meta name="theme-color" content="#0A1728">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo:#070E19; --superficie:#0A1728; --superficie-sutil:#0D1D33;
    --borda:#1C2C41; --texto:#F5F8FC; --texto-suave:#B8C4D4; --texto-fraco:#7C8BA0;
    --acento:#E5272D; --verde:#22C55E; --azul:#2563EB; --amarelo:#F2B23A; --roxo:#A855F7;
    --raio-s:8px; --raio-m:12px; --raio-l:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',Arial,sans-serif;background:var(--fundo);color:var(--texto);-webkit-font-smoothing:antialiased;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ===== SPLASH (abertura) ===== */
  #telaSplash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#101F35,#070E19 60%);gap:18px;text-align:center;padding:20px;}
  .splash-caixa{width:170px;height:170px;border-radius:var(--raio-l);background:var(--superficie);border:1px solid var(--borda);display:flex;align-items:center;justify-content:center;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .splash-caixa img{width:100%;object-fit:contain;border-radius:8px;}
  .splash-titulo{font-size:22px;font-weight:900;letter-spacing:.3px;}
  .splash-titulo span{color:var(--acento);}
  .splash-sub{font-size:11.5px;color:var(--texto-fraco);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-top:-8px;}
  .splash-spin{width:30px;height:30px;border-radius:50%;border:3px solid #1C2C41;border-top-color:var(--acento);animation:girar 0.8s linear infinite;margin-top:6px;}
  @keyframes girar{to{transform:rotate(360deg);}}
  #pularSplash{color:#5C86D8;font-size:12.5px;text-decoration:underline;background:none;border:none;margin-top:4px;}

  /* ===== LOGIN ===== */
  #telaLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:24px;background:radial-gradient(circle at 50% 38%,rgba(25,61,103,.34) 0,rgba(10,23,40,.16) 28%,transparent 54%),linear-gradient(145deg,#050B14 0%,#081321 48%,#050B14 100%);}
  #telaLogin::before,#telaLogin::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none;}
  #telaLogin::before{width:520px;height:520px;left:-260px;top:-260px;background:radial-gradient(circle,rgba(229,39,45,.10),transparent 68%);}
  #telaLogin::after{width:600px;height:600px;right:-330px;bottom:-330px;background:radial-gradient(circle,rgba(37,99,235,.11),transparent 68%);}
  .card-login{position:relative;z-index:1;background:linear-gradient(145deg,rgba(13,29,51,.97),rgba(7,20,37,.98));border:1px solid rgba(93,125,164,.28);border-radius:24px;padding:34px 34px 30px;width:100%;max-width:430px;box-shadow:0 35px 90px rgba(0,0,0,.58),0 12px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05);animation:loginEntrada .55s cubic-bezier(.2,.8,.2,1) both;}
  .card-login::before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 38%,rgba(229,39,45,.18));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
  .login-logo-wrap{width:100%;max-width:270px;height:172px;margin:0 auto 20px;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 50% 48%,rgba(37,99,235,.13),rgba(7,20,37,.28) 62%,transparent 74%);perspective:800px;}
  .login-logo-wrap::after{content:"";position:absolute;width:68%;height:18px;left:16%;bottom:13px;border-radius:50%;background:rgba(0,0,0,.40);filter:blur(12px);}
  .card-login img{position:relative;z-index:1;width:88%;max-width:245px;display:block;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.48));transform:translateY(-2px) rotateX(1deg);animation:logoFlutua 4s ease-in-out infinite;}
  .login-eyebrow{text-align:center;color:#7590B5;font-size:10px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;margin-bottom:7px;}
  .card-login h1{text-align:center;font-size:19px;letter-spacing:1.2px;color:#F5F8FC;margin:0 0 5px;text-transform:uppercase;font-weight:900;}
  .card-login h1 span{color:var(--acento);text-shadow:0 0 22px rgba(229,39,45,.22);}
  .login-subtitulo{text-align:center;color:#70849F;font-size:11px;font-weight:600;letter-spacing:.5px;margin:0 0 25px;}
  .campo-login{margin-bottom:13px;position:relative;}
  .campo-login::before{position:absolute;left:15px;top:50%;transform:translateY(-50%);z-index:2;color:#7186A3;font-size:15px;pointer-events:none;}
  .campo-login.email::before{content:"✉";}
  .campo-login.senha::before{content:"●";font-size:10px;}
  .campo-login input{width:100%;padding:14px 15px 14px 42px;border-radius:11px;border:1px solid rgba(77,105,140,.38);background:linear-gradient(180deg,rgba(13,29,51,.94),rgba(10,25,44,.94));color:var(--texto);font-size:14px;outline:none;box-shadow:inset 0 1px 4px rgba(0,0,0,.22);transition:border-color .2s,box-shadow .2s,transform .2s;}
  .campo-login input::placeholder{color:#6F8096;}
  .campo-login input:focus{border-color:#456FAD;box-shadow:0 0 0 3px rgba(37,99,235,.10),inset 0 1px 4px rgba(0,0,0,.18);transform:translateY(-1px);}
  #btnEntrar{width:100%;padding:15px;border:1px solid rgba(255,104,108,.18);border-radius:11px;background:linear-gradient(180deg,#F03238 0%,#D91F26 100%);color:#fff;font-weight:900;font-size:14.5px;margin-top:7px;box-shadow:0 12px 24px rgba(229,39,45,.22),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s,filter .15s,box-shadow .15s;}
  #btnEntrar:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 15px 30px rgba(229,39,45,.28),inset 0 1px 0 rgba(255,255,255,.18);}
  #btnEntrar:active{transform:translateY(1px);box-shadow:0 6px 14px rgba(229,39,45,.20);}
  #btnEntrar:disabled{opacity:.6;cursor:default;transform:none;}
  #erroLogin{color:#FF7479;font-size:12.5px;margin-top:12px;text-align:center;min-height:16px;}
  .login-rodape{text-align:center;margin-top:13px;color:#536A87;font-size:9.5px;letter-spacing:.45px;text-transform:uppercase;font-weight:700;}
  @keyframes loginEntrada{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes logoFlutua{0%,100%{transform:translateY(-2px)}50%{transform:translateY(-7px)}}
  @media(max-width:520px){#telaLogin{padding:16px}.card-login{max-width:390px;padding:28px 22px 24px;border-radius:21px}.login-logo-wrap{height:150px;max-width:245px;margin-bottom:17px}.card-login h1{font-size:17px}.login-subtitulo{margin-bottom:21px}}
  @media(prefers-reduced-motion:reduce){.card-login,.card-login img{animation:none}}

  /* ===== APP ===== */
  #app{height:100dvh;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .cabecalho-fixo{position:sticky;top:0;z-index:1000;background:#071425;box-shadow:0 8px 24px rgba(0,0,0,.18);}
  header.topo-app{background:#071425;border-bottom:1px solid var(--borda);padding:10px 30px;display:flex;align-items:center;gap:16px;min-height:68px;}
  .logo-topo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .logo-topo img{height:46px;width:auto;max-width:92px;object-fit:contain;border-radius:6px;}
  .marca-topo{font-size:13px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--texto-suave);white-space:nowrap;}
  .marca-topo span{color:var(--acento);}
  .saudacao-bloco{padding-left:4px;}
  .saudacao-bloco h2{margin:0;font-size:22px;font-weight:900;line-height:1.05;}
  .saudacao-bloco .sub{font-size:10.5px;color:#7590B5;text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-top:5px;}
  .topo-direita{display:flex;align-items:center;gap:14px;margin-left:auto;}
  .data-topo{min-width:142px;padding:8px 12px;border:1px solid var(--borda);border-radius:12px;text-align:right;background:#09182A;}
  .data-topo b{display:block;font-size:11px;color:#fff;}
  .data-topo span{font-size:9.5px;color:#7892B6;}
  .assinatura-topo-badge{min-width:138px;height:46px;padding:6px 12px;border:1px solid rgba(34,197,94,.42);border-radius:12px;background:linear-gradient(180deg,rgba(34,197,94,.18),rgba(10,33,31,.88));color:#D8FFE6;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 0 0 1px rgba(34,197,94,.04),0 8px 22px rgba(0,0,0,.18);transition:transform .15s,filter .15s,border-color .15s;}
  .assinatura-topo-badge:hover{transform:translateY(-1px);filter:brightness(1.08);}
  .assinatura-topo-badge .status{font-size:9px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;white-space:nowrap;}
  .assinatura-topo-badge .uso{font-size:11px;font-weight:900;color:#fff;white-space:nowrap;}
  .assinatura-topo-badge.alerta{border-color:rgba(242,178,58,.55);background:linear-gradient(180deg,rgba(242,178,58,.20),rgba(45,33,10,.88));color:#FFE6A8;}
  .assinatura-topo-badge.critico{border-color:rgba(229,39,45,.64);background:linear-gradient(180deg,rgba(229,39,45,.22),rgba(50,12,18,.92));color:#FFD0D2;animation:pulsarAssinatura 1.8s ease-in-out infinite;}
  @keyframes pulsarAssinatura{0%,100%{box-shadow:0 0 0 1px rgba(229,39,45,.08),0 8px 22px rgba(0,0,0,.18)}50%{box-shadow:0 0 0 4px rgba(229,39,45,.08),0 8px 22px rgba(0,0,0,.18)}}
  @media(max-width:900px){.assinatura-topo-badge{min-width:108px;padding:6px 9px}.assinatura-topo-badge .status{font-size:8px}.assinatura-topo-badge .uso{font-size:9.5px}}
  .notificacao-topo{position:relative;width:38px;height:38px;border:none;background:transparent;color:#FFD166;font-size:18px;display:flex;align-items:center;justify-content:center;}
  .notificacao-badge{position:absolute;top:0;right:1px;min-width:16px;height:16px;border-radius:10px;background:var(--acento);color:#fff;font-size:9px;font-weight:900;display:none;align-items:center;justify-content:center;padding:0 4px;}
  .perfil-topo{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--borda);}
  .avatar-topo{width:38px;height:38px;border-radius:50%;background:var(--superficie-sutil);border:1px solid var(--borda);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;overflow:hidden;}
  .avatar-topo img{width:100%;height:100%;object-fit:cover;}
  .perfil-texto b{display:block;font-size:12.5px;}
  .perfil-texto span{font-size:10px;color:#7892B6;text-transform:uppercase;}
  #btnSair{background:none;border:1px solid #5A2832;color:#FF6B70;border-radius:var(--raio-s);padding:8px 14px;font-weight:800;font-size:12.5px;}
  #btnSair:hover{background:#2A1218;}

  nav.menu-nav-topo{display:flex;gap:2px;padding:0 28px;background:#071425;border-bottom:1px solid var(--borda);overflow-x:auto;scrollbar-width:thin;}
  nav.menu-nav-topo button{background:none;border:none;color:#BFCBDD;padding:13px 14px;font-size:12.5px;font-weight:800;white-space:nowrap;border-bottom:3px solid transparent;}
  nav.menu-nav-topo button.ativo{color:#fff;border-bottom-color:var(--acento);background:rgba(229,39,45,.06);}
  nav.menu-nav-topo button:hover{color:#fff;}

  main{flex:1;min-height:0;padding:26px 28px 60px;width:100%;max-width:none;margin:0;overflow-y:auto;overflow-x:hidden;}

  .topo-pagina{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:14px;}
  .topo-pagina h2{margin:0;font-size:21px;font-weight:900;white-space:nowrap;}
  .topo-pagina h2 .destaque{color:var(--acento);}
  .topo-pagina-atend{display:grid;grid-template-columns:auto minmax(520px,1fr) minmax(230px,305px);align-items:center;gap:12px;margin-bottom:12px;}
  .kpis-faixa{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--borda);border-radius:14px;overflow:hidden;background:var(--superficie);}
  .kpi-faixa-item{padding:8px 14px;min-width:0;border-right:1px solid var(--borda);}
  .kpi-faixa-item:last-child{border-right:none;}
  .kpi-faixa-item .num{font-size:25px;font-weight:900;line-height:1;color:#fff;}
  .kpi-faixa-item .rot{font-size:8.5px;color:#7F91AA;text-transform:uppercase;font-weight:900;letter-spacing:.5px;margin-top:4px;}
  .btn-primario{background:var(--acento);color:#fff;border:none;border-radius:var(--raio-s);padding:11px 18px;font-weight:800;font-size:13px;}
  .btn-primario:hover{filter:brightness(1.1);}
  .btn-secundario{background:var(--superficie-sutil);color:var(--texto);border:1px solid var(--borda);border-radius:var(--raio-s);padding:9px 14px;font-weight:700;font-size:12.5px;}
  .btn-secundario:hover{background:#132238;}

  .kpis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px;}
  .kpi-card{background:var(--superficie);border:1px solid var(--borda);border-left:4px solid var(--acento);border-radius:var(--raio-s);padding:18px 20px;}
  .kpi-card .num{font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1;color:#fff;}
  .kpi-card .rot{font-size:10.5px;color:var(--acento);text-transform:uppercase;letter-spacing:.4px;font-weight:800;margin-top:6px;}

  .grafico-box,.painel-box{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-m);padding:20px;}
  .grafico-box h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--texto-suave);}

  .carregando-tela{text-align:center;padding:60px 20px;color:var(--texto-fraco);}

  /* ===== Tabela ===== */
  .tabela-box{background:var(--superficie);border:none;overflow:auto;max-height:calc(100vh - 315px);scrollbar-width:none;-ms-overflow-style:none;}
  .tabela-box::-webkit-scrollbar{display:none;width:0;height:0;}
  table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:1650px;}
  thead th{position:sticky;top:0;z-index:3;text-align:center;padding:12px 8px;color:#F4F7FC;text-transform:uppercase;font-size:8.5px;letter-spacing:.15px;font-weight:900;border-bottom:1px solid #315171;background:#09192B;white-space:nowrap;}
  tbody td{padding:9px 8px;border-bottom:1px solid #1A3048;vertical-align:middle;line-height:1.25;}
  tbody tr:hover{background:#0D2239;}

  /* ===== ATENDIMENTOS — aproveitamento total da tela ===== */
  main.modo-atendimentos{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:18px 28px 12px;}
  main.modo-atendimentos .topo-pagina-atend{flex:0 0 auto;margin-bottom:10px;}
  main.modo-atendimentos .barra-acoes{flex:0 0 auto;margin-bottom:10px;}
  main.modo-atendimentos .tabela-box{flex:1 1 0;min-height:0;max-height:none;width:100%;overflow-y:auto;overflow-x:hidden;background:transparent;border:0;border-radius:0;box-shadow:none;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none;-ms-overflow-style:none;}
  main.modo-atendimentos .tabela-box::-webkit-scrollbar{display:none;width:0;height:0;}
  main.modo-atendimentos table{width:100%;min-width:0;table-layout:fixed;font-size:10.5px;background:var(--superficie);}
  main.modo-atendimentos thead th{position:sticky;top:0;z-index:8;padding:10px 5px;font-size:7.8px;line-height:1.1;background:#09192B;border-bottom:1px solid #24435F;white-space:normal;}
  main.modo-atendimentos tbody td{padding:8px 6px;line-height:1.22;border-bottom:1px solid rgba(49,81,113,.42);white-space:normal;overflow-wrap:anywhere;word-break:normal;}
  main.modo-atendimentos tbody tr:last-child td{border-bottom:none;}
  main.modo-atendimentos .td-wrap{min-width:0;white-space:normal;}
  main.modo-atendimentos .td-obs{min-width:0;max-width:none;white-space:normal;overflow:hidden;text-overflow:ellipsis;display:table-cell;}
  main.modo-atendimentos .acoes-linha{gap:4px;justify-content:center;flex-wrap:wrap;white-space:normal;}
  main.modo-atendimentos .btn-tabela{padding:5px 7px;font-size:9px;}
  main.modo-atendimentos .badge{padding:3px 6px;font-size:9px;gap:4px;white-space:nowrap;}
  main.modo-atendimentos .link-wa{white-space:normal;}

  main.modo-atendimentos th:nth-child(1),main.modo-atendimentos td:nth-child(1){width:5.5%;}
  main.modo-atendimentos th:nth-child(2),main.modo-atendimentos td:nth-child(2){width:10.5%;}
  main.modo-atendimentos th:nth-child(3),main.modo-atendimentos td:nth-child(3){width:8%;}
  main.modo-atendimentos th:nth-child(4),main.modo-atendimentos td:nth-child(4){width:10%;}
  main.modo-atendimentos th:nth-child(5),main.modo-atendimentos td:nth-child(5){width:7%;}
  main.modo-atendimentos th:nth-child(6),main.modo-atendimentos td:nth-child(6){width:8%;}
  main.modo-atendimentos th:nth-child(7),main.modo-atendimentos td:nth-child(7){width:7.5%;}
  main.modo-atendimentos th:nth-child(8),main.modo-atendimentos td:nth-child(8){width:6%;}
  main.modo-atendimentos th:nth-child(9),main.modo-atendimentos td:nth-child(9){width:7.5%;}
  main.modo-atendimentos th:nth-child(10),main.modo-atendimentos td:nth-child(10){width:7%;}
  main.modo-atendimentos th:nth-child(11),main.modo-atendimentos td:nth-child(11){width:5%;}
  main.modo-atendimentos th:nth-child(12),main.modo-atendimentos td:nth-child(12){width:4.5%;}
  main.modo-atendimentos th:nth-child(13),main.modo-atendimentos td:nth-child(13){width:8%;}
  main.modo-atendimentos th:nth-child(14),main.modo-atendimentos td:nth-child(14){width:5%;}

  main.modo-transportes,main.modo-equipamentos{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:18px 28px 12px;}
  main.modo-transportes .topo-pagina-atend,main.modo-equipamentos .topo-pagina-atend{flex:0 0 auto;margin-bottom:10px;}
  main.modo-transportes .barra-acoes,main.modo-equipamentos .barra-acoes{flex:0 0 auto;margin-bottom:10px;}
  main.modo-transportes .tabela-box,main.modo-equipamentos .tabela-box{flex:1 1 0;min-height:0;max-height:none;width:100%;overflow-y:auto;overflow-x:hidden;background:transparent;border:0;border-radius:0;box-shadow:none;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none;-ms-overflow-style:none;}
  main.modo-transportes .tabela-box::-webkit-scrollbar,main.modo-equipamentos .tabela-box::-webkit-scrollbar{display:none;width:0;height:0;}
  main.modo-transportes table,main.modo-equipamentos table{width:100%;min-width:0;table-layout:fixed;font-size:10.5px;background:var(--superficie);}
  main.modo-transportes thead th,main.modo-equipamentos thead th{position:sticky;top:0;z-index:8;padding:10px 5px;font-size:7.8px;line-height:1.1;background:#09192B;border-bottom:1px solid #24435F;white-space:normal;}
  main.modo-transportes tbody td,main.modo-equipamentos tbody td{padding:8px 6px;line-height:1.22;border-bottom:1px solid rgba(49,81,113,.42);white-space:normal;overflow-wrap:anywhere;word-break:normal;}
  main.modo-atendimentos tbody td,main.modo-transportes tbody td,main.modo-equipamentos tbody td{text-align:center;}
  main.modo-atendimentos td.td-esquerda,main.modo-transportes td.td-esquerda,main.modo-equipamentos td.td-esquerda{text-align:left;}

  .gcal-modal{
    width:min(720px,calc(100vw - 32px));
    max-height:calc(100vh - 32px);
    overflow-y:auto;
    border-radius:24px;
    background:#f8fafd;
    color:#202124;
    box-shadow:0 18px 48px rgba(60,64,67,.30);
    padding:18px 22px 20px;
  }
  .gcal-modal-top{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .gcal-modal-top .drag{font-size:22px;color:#5f6368;}
  .gcal-close{
    width:36px;height:36px;border:0;border-radius:50%;
    background:transparent;color:#5f6368;font-size:24px;
  }
  .gcal-close:hover{background:#e8eaed;}
  .gcal-title-input{
    width:100%;border:0;border-bottom:2px solid #1a73e8;
    outline:0;background:transparent;color:#202124;
    font-size:28px;font-weight:400;padding:8px 2px 9px;
    margin-bottom:16px;
  }
  .gcal-title-input::placeholder{color:#5f6368;}
  .gcal-tabs{display:flex;gap:8px;margin-bottom:12px;}
  .gcal-tab{
    border:0;border-radius:10px;padding:9px 13px;
    background:transparent;color:#3c4043;font-weight:700;
  }
  .gcal-tab.active{background:#c2e7ff;color:#001d35;}
  .gcal-row{
    display:grid;
    grid-template-columns:34px minmax(0,1fr);
    gap:12px;
    align-items:start;
    padding:8px 0;
  }
  .gcal-icon{
    width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    color:#5f6368;font-size:18px;
  }
  .gcal-inline{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .gcal-field{
    min-height:42px;border:0;border-radius:8px;
    background:transparent;color:#202124;
    padding:8px 10px;font-size:14px;outline:none;
  }
  .gcal-field:hover,.gcal-field:focus{background:#e8eaed;}
  .gcal-field.date{min-width:145px;}
  .gcal-field.time{min-width:110px;}
  .gcal-field.full{width:100%;}
  textarea.gcal-field{min-height:72px;resize:vertical;}
  .gcal-select{
    min-height:42px;border:0;border-radius:8px;
    background:transparent;color:#202124;
    padding:8px 10px;font-size:14px;outline:none;
  }
  .gcal-select:hover,.gcal-select:focus{background:#e8eaed;}
  .gcal-reminder{
    display:inline-flex;align-items:center;
    min-height:40px;border-radius:8px;padding:8px 10px;
    color:#3c4043;background:#e8f0fe;font-size:13px;font-weight:700;
  }
  .gcal-actions{
    display:flex;align-items:center;justify-content:flex-end;
    gap:10px;margin-top:14px;
  }
  .gcal-delete{
    margin-right:auto;border:0;background:transparent;
    color:#d93025;font-weight:700;padding:10px 12px;border-radius:8px;
  }
  .gcal-delete:hover{background:#fce8e6;}
  .gcal-cancel{
    border:0;background:transparent;color:#1a73e8;
    font-weight:700;padding:10px 16px;border-radius:8px;
  }
  .gcal-save{
    border:0;background:#0b57d0;color:#fff;
    font-weight:700;padding:11px 22px;border-radius:22px;
  }
  .gcal-save:hover{background:#0842a0;}


  .gcal-google-btn{
    height:40px;border:1px solid #dadce0;border-radius:20px;
    background:#fff;color:#3c4043;padding:0 15px;font-weight:700;
    display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .gcal-google-btn:hover{background:#f1f3f4;}
  .gcal-google-btn.conectado{color:#137333;background:#e6f4ea;border-color:#ceead6;}
  .gcal-google-dot{width:8px;height:8px;border-radius:50%;background:#9aa0a6;display:inline-block;}
  .gcal-google-btn.conectado .gcal-google-dot{background:#34a853;}
  .gcal-sync-btn{
    width:40px;height:40px;border:1px solid #dadce0;border-radius:50%;
    background:#fff;color:#5f6368;font-size:18px;
  }
  .gcal-sync-btn:hover{background:#f1f3f4;}
  .gcal-sync-btn:disabled{opacity:.45;cursor:default;}
  .gcal-google-event{box-shadow:inset 3px 0 0 rgba(255,255,255,.65);}


  .gcal-more{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    align-items:center;
    min-height:18px;
    height:18px;
    padding:1px 6px;
    border-radius:4px;
    font-size:10.5px;
    color:#3c4043;
    font-weight:700;
    cursor:pointer;
    background:#fff;
    z-index:3;
  }
  .gcal-more:hover{background:#e8eaed;}
  .gcal-day.outside .gcal-more{background:#fafafa;}

  .gcal-day-popup{
    position:fixed;
    z-index:4200;
    width:min(330px,calc(100vw - 24px));
    max-height:min(430px,calc(100vh - 24px));
    overflow:hidden;
    background:#f8fafd;
    color:#202124;
    border-radius:26px;
    box-shadow:0 10px 30px rgba(60,64,67,.32);
    padding:14px 12px 16px;
    border:1px solid rgba(60,64,67,.10);
  }
  .gcal-day-popup-head{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:start;
    gap:8px;
    padding:0 4px 10px;
  }
  .gcal-day-popup-weekday{
    text-align:center;
    font-size:11px;
    color:#5f6368;
    text-transform:uppercase;
    font-weight:500;
    letter-spacing:.3px;
  }
  .gcal-day-popup-num{
    text-align:center;
    font-size:34px;
    line-height:1.05;
    font-weight:400;
    color:#202124;
    margin-top:2px;
  }
  .gcal-day-popup-close{
    width:38px;height:38px;
    border:0;border-radius:50%;
    background:transparent;
    color:#5f6368;
    font-size:28px;
    line-height:1;
  }
  .gcal-day-popup-close:hover{background:#e8eaed;}
  .gcal-day-popup-list{
    display:flex;
    flex-direction:column;
    gap:4px;
    overflow-y:auto;
    max-height:320px;
    padding:2px 0 0;
  }
  .gcal-day-popup .gcal-event{
    min-height:24px;
    font-size:11px;
    padding:4px 8px;
    border-radius:5px;
  }

  @media(max-width:900px){
    main.modo-agenda{height:auto;min-height:calc(100vh - 120px);overflow:auto;}
    .gcal-shell{min-height:760px;}
    .gcal-toolbar{padding:7px 10px;gap:6px;overflow-x:auto;}
    .gcal-mes{font-size:18px;min-width:165px;}
    .gcal-view{display:none;}
    .gcal-grid{min-width:760px;}
    .gcal-weekdays{min-width:760px;}
    .gcal-shell{overflow-x:auto;}
  }
  @media(max-width:600px){
    .gcal-hoje{padding:0 12px;}
    .gcal-novo{padding:0 12px;}
    .gcal-modal{width:100%;border-radius:18px;padding:14px 16px;}
    .gcal-title-input{font-size:22px;}
    .gcal-row{grid-template-columns:28px minmax(0,1fr);gap:8px;}
  }

  @media(max-width:1180px){
    .topo-pagina-atend{grid-template-columns:1fr;}
    .topo-pagina-atend .btn-primario{justify-self:start;}
    .kpis-faixa{width:100%;}
    .data-topo{display:none;}
  }
  @media(max-width:820px){
    main.modo-atendimentos{flex:1;min-height:0;overflow:hidden;padding:14px 12px 16px;}
    main.modo-transportes,main.modo-equipamentos{flex:1;min-height:0;overflow:hidden;padding:14px 12px 16px;}
    /* Em telas estreitas, as tabelas de Atendimentos/Transportes/Equipamentos viravam ilegíveis
       (colunas espremidas quebrando texto letra por letra) porque a rolagem lateral estava
       desligada. Agora elas rolam de lado com largura mínima legível, como qualquer tabela
       grande em app de celular. */
    main.modo-atendimentos .tabela-box,main.modo-transportes .tabela-box,main.modo-equipamentos .tabela-box{
      flex:1 1 0;min-height:0;max-height:none;overflow-y:auto;overflow-x:auto;-webkit-overflow-scrolling:touch;
    }
    main.modo-atendimentos table{min-width:1120px;table-layout:auto;}
    main.modo-transportes table{min-width:980px;table-layout:auto;}
    main.modo-equipamentos table{min-width:760px;table-layout:auto;}
    main.modo-atendimentos thead th,main.modo-transportes thead th,main.modo-equipamentos thead th{white-space:nowrap;}
    main.modo-atendimentos tbody td,main.modo-transportes tbody td,main.modo-equipamentos tbody td{white-space:nowrap;}
    header.topo-app{padding:10px 14px;gap:10px;flex-wrap:wrap;}
    .marca-topo{display:none;}
    .logo-topo img{height:40px;}
    .saudacao-bloco h2{font-size:17px;}
    .saudacao-bloco .sub{display:none;}
    .topo-direita{gap:8px;}
    .perfil-texto{display:none;}
    main{padding:16px 12px 40px;}
    nav.menu-nav-topo{padding:0 8px;}
    .barra-acoes{grid-template-columns:1fr 1fr;}
    .kpis-faixa{grid-template-columns:1fr 1fr;}
    .kpi-faixa-item:nth-child(2){border-right:none;}
    .kpi-faixa-item:nth-child(-n+2){border-bottom:1px solid var(--borda);}
  }
  @media(max-width:520px){
    .saudacao-bloco{flex:1;}
    .notificacao-topo{display:none;}
    .barra-acoes{grid-template-columns:1fr;}
    .topo-pagina-atend{gap:10px;}
    .topo-pagina h2,.topo-pagina-atend h2{font-size:18px;}
    .kpi-faixa-item .num{font-size:20px;}
    table{font-size:11px;}
  }

  /* ===== ADMIN — USUÁRIOS E CONFIGURAÇÕES ===== */
  .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .admin-card{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-m);padding:18px;min-width:0;}
  .admin-card h3{margin:0 0 4px;font-size:15px;color:#fff;}
  .admin-card p{font-size:11.5px;color:var(--texto-suave);margin:0 0 14px;}
  .admin-add{display:flex;gap:8px;margin-bottom:14px;}
  .admin-add input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--borda);border-radius:var(--raio-s);background:var(--superficie-sutil);color:var(--texto);font-family:inherit;}
  .admin-lista{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;}
  .admin-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;background:#09182A;border:1px solid #17304C;border-radius:8px;}
  .admin-item span{font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .admin-table-box{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-m);overflow:auto;}
  .admin-table{width:100%;min-width:760px;table-layout:auto;}
  .admin-table th{position:sticky;top:0;background:#09192B;color:#F4F7FC;text-align:left;padding:11px 12px;font-size:9px;}
  .admin-table td{padding:11px 12px;text-align:left;white-space:nowrap;max-width:none;}
  .admin-table td:last-child,.admin-table th:last-child{text-align:center;width:95px;}
  .admin-restrito{padding:18px;background:rgba(229,39,45,.08);border:1px solid rgba(229,39,45,.25);border-radius:12px;color:#F5B5B7;}
  @media(max-width:820px){.admin-grid{grid-template-columns:1fr;}.admin-add{flex-direction:column;}.admin-table{min-width:650px;}}

  /* ===== ADMIN — RECURSO PAGO (ANEXOS) ===== */
  .admin-card.admin-card-pago{grid-column:1/-1;border-color:rgba(168,85,247,.35);background:linear-gradient(180deg,rgba(168,85,247,.06),var(--superficie) 60%);}
  .selo-pago{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;background:rgba(168,85,247,.16);color:var(--roxo);font-size:9.5px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;margin-left:8px;vertical-align:middle;}
  .admin-toggle-linha{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;background:#09182A;border:1px solid #17304C;border-radius:10px;}
  .admin-toggle-linha b{font-size:13px;color:#fff;}
  .admin-toggle-linha .admin-toggle-desc{display:block;font-size:11px;color:var(--texto-fraco);margin-top:3px;font-weight:400;}
  .chave-toggle{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0;}
  .chave-toggle input{opacity:0;width:0;height:0;}
  .chave-toggle .trilho{position:absolute;cursor:pointer;inset:0;background:#28415D;border-radius:26px;transition:.18s;}
  .chave-toggle .trilho::before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s;}
  .chave-toggle input:checked + .trilho{background:var(--verde);}
  .chave-toggle input:checked + .trilho::before{transform:translateX(20px);}
  .chave-toggle input:disabled + .trilho{opacity:.5;cursor:default;}

  /* ===== ANEXOS (recurso pago, liberado em Configurações) ===== */
  .campo-anexos{background:#09182A;border:1px solid #17304C;border-radius:10px;padding:12px 14px;}
  .anexos-lista{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
  .anexo-item{display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 8px;background:var(--superficie);border:1px solid var(--borda);border-radius:8px;}
  .anexo-item a{color:#8FB4E8;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
  .anexo-item a:hover{text-decoration:underline;}
  .anexo-tam{color:var(--texto-fraco);font-size:10px;flex-shrink:0;}
  .anexo-remover{background:none;border:1px solid #4A2430;color:#F26D6D;border-radius:6px;width:22px;height:22px;flex-shrink:0;font-size:11px;line-height:1;}
  .anexo-remover:hover{background:#2A1218;}
  .anexos-vazio{font-size:11.5px;color:var(--texto-fraco);}
  .anexos-obs{font-size:11px;color:var(--texto-suave);margin:-2px 0 10px;}
  .anexos-ajuda{font-size:10px;color:var(--texto-fraco);margin-top:6px;}
  .campo-anexos input[type=file]{width:100%;font-size:11.5px;color:var(--texto-suave);}
  .aviso-anexos-bloqueado{font-size:11px;color:var(--texto-fraco);background:#09182A;border:1px dashed #28415D;border-radius:8px;padding:8px 10px;grid-column:1/-1;}

  /* ===== EVENTOS / PESSOAS / RELATÓRIOS ===== */
  .modulo-table-box{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-m);overflow:auto;}
  .modulo-table{width:100%;min-width:760px;table-layout:auto;font-size:11.5px;}
  .modulo-table th{position:sticky;top:0;z-index:3;text-align:left;padding:11px 12px;color:#F4F7FC;text-transform:uppercase;font-size:8.5px;font-weight:900;border-bottom:1px solid #315171;background:#09192B;white-space:nowrap;}
  .modulo-table td{padding:10px 12px;border-bottom:1px solid #1A3048;text-align:left;white-space:nowrap;max-width:none;}
  .modulo-table tbody tr:hover{background:#0D2239;}
  .relatorio-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px;}
  .relatorio-card{background:linear-gradient(180deg,#0B1B2F,#091626);border:1px solid var(--borda);border-radius:14px;padding:16px;min-height:92px;}
  .relatorio-card b{display:block;font-size:27px;color:#fff;line-height:1;}
  .relatorio-card span{display:block;margin-top:8px;font-size:9px;color:#8EA3BF;text-transform:uppercase;font-weight:900;letter-spacing:.5px;}
  .relatorio-secao{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:900px){.relatorio-grid{grid-template-columns:1fr 1fr}.relatorio-secao{grid-template-columns:1fr}.modulo-table{min-width:680px}}
  @media(max-width:520px){.relatorio-grid{grid-template-columns:1fr}}


  /* ===== ASSINATURA E ARMAZENAMENTO ===== */
  .perfil-menu-wrap{position:relative;}
  .perfil-topo{cursor:pointer;border-radius:12px;padding:6px 10px 6px 14px;transition:background .18s,border-color .18s;}
  .perfil-topo:hover{background:#0B1B2F;}
  .perfil-topo::after{content:"▾";font-size:10px;color:#7892B6;margin-left:3px;}
  .perfil-dropdown{position:absolute;right:0;top:calc(100% + 10px);width:260px;background:#0A1728;border:1px solid #1C2C41;border-radius:14px;box-shadow:0 18px 48px rgba(0,0,0,.45);padding:8px;z-index:1800;}
  .perfil-dropdown button{width:100%;border:0;background:transparent;color:#DDE6F2;text-align:left;padding:11px 12px;border-radius:9px;font-size:12px;font-weight:800;}
  .perfil-dropdown button:hover{background:#10243C;}
  .perfil-dropdown .perfil-dd-destaque{color:#8CC5FF;border:1px solid rgba(37,99,235,.25);background:rgba(37,99,235,.07);}
  .perfil-dropdown .perfil-dd-sair{color:#FF7479;}
  .assinatura-wrap{width:100%;max-width:none;margin:0;}
  .assinatura-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .assinatura-topo h2{margin:0;font-size:23px;font-weight:900;}
  .assinatura-topo p{margin:5px 0 0;color:var(--texto-fraco);font-size:11.5px;}
  .assinatura-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px;width:100%;}
  .assinatura-card{background:linear-gradient(180deg,#0B1B2F,#091626);border:1px solid var(--borda);border-radius:14px;padding:18px;min-width:0;}
  .assinatura-card h3{margin:0 0 14px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#8EA3BF;}
  .assinatura-plano{font-size:20px;font-weight:900;color:#fff;margin-bottom:12px;}
  .assinatura-linha{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid rgba(49,81,113,.25);font-size:12px;}
  .assinatura-linha:last-child{border-bottom:0;}
  .assinatura-linha span{color:#8EA3BF;}
  .assinatura-linha b{color:#fff;text-align:right;}
  .assinatura-status{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:900;text-transform:uppercase;}
  .assinatura-status.ativo{background:rgba(34,197,94,.14);color:#4ADE80;}
  .assinatura-storage-card{grid-column:1/-1;}
  .assinatura-storage-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px;}
  .assinatura-storage-valor{font-size:23px;font-weight:900;color:#fff;}
  .assinatura-storage-pct{font-size:18px;font-weight:900;color:#fff;}
  .assinatura-barra{height:12px;border-radius:30px;background:#13253B;overflow:hidden;margin:10px 0 9px;}
  .assinatura-barra>div{height:100%;border-radius:30px;background:linear-gradient(90deg,#22C55E,#34D399);min-width:0;transition:width .3s;}
  .assinatura-barra.alerta>div{background:linear-gradient(90deg,#F2B23A,#F59E0B);}
  .assinatura-barra.critico>div{background:linear-gradient(90deg,#E5272D,#FF5A5F);}
  .assinatura-storage-rodape{display:flex;justify-content:space-between;gap:12px;color:#7F91AA;font-size:10.5px;}
  .assinatura-aviso{margin-top:14px;padding:11px 13px;border:1px solid #1D3E60;border-radius:10px;background:#0A2037;color:#A9C4E4;font-size:11.5px;}
  .assinatura-upgrades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;}
  .assinatura-upgrade{border:1px solid #28415D;border-radius:12px;background:#0A1728;padding:15px;}
  .assinatura-upgrade b{display:block;font-size:17px;color:#fff;margin-bottom:4px;}
  .assinatura-upgrade span{font-size:12px;color:#8EA3BF;}
  .assinatura-upgrade strong{display:block;margin-top:10px;font-size:15px;color:#fff;}
  .assinatura-acao{margin-top:14px;display:flex;justify-content:flex-end;}
  .assinatura-acao button{background:#22A95A;color:white;border:0;border-radius:9px;padding:11px 17px;font-weight:900;}
  @media(max-width:760px){.assinatura-grid{grid-template-columns:1fr}.assinatura-storage-card{grid-column:auto}.assinatura-upgrades{grid-template-columns:1fr}.perfil-dropdown{right:-50px;width:240px}}
  /* ===== PAGAMENTO PIX ===== */
  .pix-modal-bg{position:fixed;inset:0;z-index:5000;background:rgba(3,7,14,.76);display:flex;align-items:center;justify-content:center;padding:18px;}
  .pix-modal{width:min(560px,calc(100vw - 36px));background:#0A1728;border:1px solid #28415D;border-radius:20px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.52);}
  .pix-modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;}
  .pix-modal-head h3{margin:0;font-size:20px;color:#fff;}
  .pix-modal-head p{margin:5px 0 0;color:#7F91AA;font-size:12px;}

function formatarUsoTopo(bytesUsados) {
  const mb = bytesUsados / 1024 / 1024;
  if (mb < 100) return `${mb.toFixed(1).replace('.',',')} MB / ${CONFIG_ASSINATURA.limiteGB} GB`;
  const gb = mb / 1024;
  return `${gb.toFixed(2).replace('.',',')} GB / ${CONFIG_ASSINATURA.limiteGB} GB`;
}

async function atualizarResumoAssinaturaTopo() {
  const badge = document.getElementById('assinaturaTopoBadge');
  const statusEl = document.getElementById('assinaturaTopoStatus');
  const usoEl = document.getElementById('assinaturaTopoUso');
  if (!badge || !statusEl || !usoEl || !USUARIO) return;
  statusEl.textContent = '● PLANO ATIVO';
  usoEl.textContent = 'Calculando espaço...';
  badge.classList.remove('alerta','critico');
  try {
    const uso = await calcularUsoAnexos();
    const bytesUsados = uso.bytesUsados;
    const pct = uso.pct;
    usoEl.textContent = formatarUsoTopo(bytesUsados);
    if (pct >= 100) { badge.classList.add('critico'); statusEl.textContent = '● LIMITE ATINGIDO'; }
    else if (pct >= 90) { badge.classList.add('critico'); statusEl.textContent = '● ESPAÇO CRÍTICO'; }
    else if (pct >= 70) { badge.classList.add('alerta'); statusEl.textContent = '● ESPAÇO EM ALERTA'; }
  } catch (e) {
    console.error('Não foi possível atualizar o resumo de assinatura no topo:', e);
    usoEl.textContent = `${CONFIG_ASSINATURA.limiteGB} GB contratados`;
  }
}
window.atualizarResumoAssinaturaTopo = atualizarResumoAssinaturaTopo;

const telaSplash = document.getElementById('telaSplash');
const telaLogin = document.getElementById('telaLogin');
const appEl = document.getElementById('app');

function esconderSplash() {
  if (telaSplash.classList.contains('hidden')) return;
  telaSplash.classList.add('hidden');
  telaLogin.classList.remove('hidden');
}
document.getElementById('pularSplash').onclick = esconderSplash;
setTimeout(esconderSplash, 1200);
const inputEmail = document.getElementById('inputEmail');
const inputSenha = document.getElementById('inputSenha');
const btnEntrar = document.getElementById('btnEntrar');
const erroLogin = document.getElementById('erroLogin');
const btnSair = document.getElementById('btnSair');

function mapaErroFirebase(codigo) {
  const mapa = {
    'auth/invalid-email': 'E-mail inválido.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/wrong-password': 'E-mail ou senha incorretos.',
    'auth/user-not-found': 'E-mail ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas. Espera um pouco e tenta de novo.',
    'auth/network-request-failed': 'Falha de conexão. Verifica sua internet.'
  };
  return mapa[codigo] || 'Não foi possível entrar. Tente novamente.';
}

async function fazerLogin() {
  const email = inputEmail.value.trim();
  const senha = inputSenha.value;
  if (!email || !senha) { erroLogin.innerText = 'Preenche e-mail e senha.'; return; }
  btnEntrar.disabled = true; btnEntrar.innerText = 'Entrando...'; erroLogin.innerText = '';
  try {
    await signInWithEmailAndPassword(auth, email, senha);
  } catch (e) {
    erroLogin.innerText = mapaErroFirebase(e.code);
    btnEntrar.disabled = false; btnEntrar.innerText = 'Entrar';
  }
}

btnEntrar.onclick = fazerLogin;
inputSenha.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
inputEmail.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });

btnSair.onclick = async () => {
  if (pararDeOuvirPerfil) pararDeOuvirPerfil();
  await signOut(auth);
};

function iniciaisNome(nome) {
  if (!nome) return '?';
  const p = nome.trim().split(' ');
  return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
}

function rotuloCargo(cargo) {
  const mapa = { ADMIN: 'Administrador', ASSESSOR: 'Assessor', ASSESSORA: 'Assessora', VEREADOR: 'Vereador' };
  return mapa[cargo] || cargo || '-';
}

function somenteLeitura() {
  return USUARIO && USUARIO.cargo === 'VEREADOR';
}
window.somenteLeitura = somenteLeitura;
window.getUsuario = () => USUARIO;
window.getUid = () => UID;

const MODULOS = [
  { id: 'dashboard', label: '🏠 Dashboard', admin: false },
  { id: 'eventos', label: '🎉 Eventos', admin: false },
  { id: 'pessoas', label: '📇 Pessoas', admin: false },
  { id: 'atendimentos', label: '👥 Atendimentos', admin: false },
  { id: 'transportes', label: '🚐 Transportes', admin: false },
  { id: 'equipamentos', label: '🏆 Equipamentos', admin: false },
  { id: 'agenda', label: '📅 Agenda', admin: false },
  { id: 'relatorios', label: '📊 Relatórios', admin: false },
  { id: 'usuarios', label: '🔑 Usuários', admin: true },
  { id: 'configuracoes', label: '⚙️ Configurações', admin: true }
];

function montarMenu() {
  const nav = document.getElementById('menuNav');
  const ehAdmin = USUARIO && USUARIO.cargo === 'ADMIN';
  nav.innerHTML = MODULOS
    .filter(m => !m.admin || ehAdmin)
    .map(m => `<button data-mod="${m.id}" class="${paginaAtual === m.id ? 'ativo' : ''}">${m.label}</button>`)
    .join('');
  nav.querySelectorAll('button').forEach(b => {
    b.onclick = () => irPara(b.dataset.mod);
  });
}

function irPara(pagina) {
  paginaAtual = pagina;
  montarMenu();
  const conteudo = document.getElementById('conteudo');
  conteudo.classList.toggle('modo-agenda', pagina === 'agenda');
  conteudo.classList.toggle('modo-atendimentos', pagina === 'atendimentos');
  conteudo.classList.toggle('modo-transportes', pagina === 'transportes');
  conteudo.classList.toggle('modo-equipamentos', pagina === 'equipamentos');
  conteudo.innerHTML = '<div class="carregando-tela">Carregando...</div>';
  const renderFn = window.RENDERIZADORES && window.RENDERIZADORES[pagina];
  if (renderFn) {
    renderFn();
  } else {
    conteudo.innerHTML = `<div class="topo-pagina"><h2>${pagina}</h2></div><div class="painel-box">Módulo em construção.</div>`;
  }
}
window.irPara = irPara;


function fecharMenuPerfil(){
  const dd = document.getElementById('perfilDropdown');
  const btn = document.getElementById('perfilTopoBtn');
  if(dd) dd.classList.add('hidden');
  if(btn) btn.setAttribute('aria-expanded','false');
}
window.fecharMenuPerfil = fecharMenuPerfil;

function alternarMenuPerfil(){
  const dd = document.getElementById('perfilDropdown');
  const btn = document.getElementById('perfilTopoBtn');
  if(!dd || !btn) return;
  const vaiAbrir = dd.classList.contains('hidden');
  dd.classList.toggle('hidden', !vaiAbrir);

}

if(perfilTopoBtn){

}

});

function saudacaoHora() {
  const h = new Date().getHours();
  if (h < 12) return 'Bom dia';
  if (h < 18) return 'Boa tarde';
  return 'Boa noite';
}

function atualizarDataTopo() {
  const agora = new Date();
  const dataEl = document.getElementById('dataTopo');
  const semanaEl = document.getElementById('diaSemanaTopo');
  if (dataEl) dataEl.innerText = agora.toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
  if (semanaEl) {
    const dia = agora.toLocaleDateString('pt-BR', { weekday:'long' });
    semanaEl.innerText = dia.charAt(0).toUpperCase() + dia.slice(1);
  }
}

function abrirApp() {
  telaSplash.classList.add('hidden');
  telaLogin.classList.add('hidden');
  appEl.classList.remove('hidden');
  document.getElementById('saudacaoTopo').innerText = `${saudacaoHora()}, ${USUARIO.nome.split(' ')[0]}! 👋`;
  document.getElementById('nomeTopo').innerText = USUARIO.nome;
  document.getElementById('cargoTopo').innerText = rotuloCargo(USUARIO.cargo);

  avatarTopo.innerHTML = USUARIO.foto
    ? `<img src="${USUARIO.foto}" alt="${USUARIO.nome}">`
    : iniciaisNome(USUARIO.nome);
  atualizarDataTopo();
  montarMenu();
  carregarConfiguraveis().then(() => {
    irPara('dashboard');
    atualizarBadgeNotificacoes();
    atualizarResumoAssinaturaTopo();
  });
}


function fecharApp() {
  esconderSplash();
  appEl.classList.add('hidden');
  telaLogin.classList.remove('hidden');
  inputEmail.value = ''; inputSenha.value = ''; erroLogin.innerText = '';
  btnEntrar.disabled = false; btnEntrar.innerText = 'Entrar';
  USUARIO = null; UID = null;
}

onAuthStateChanged(auth, async (user) => {
  if (pararDeOuvirPerfil) { pararDeOuvirPerfil(); pararDeOuvirPerfil = null; }

  if (!user) {
    fecharApp();
    return;
  }

  UID = user.uid;
  const refPerfil = doc(db, 'usuarios', user.uid);

  pararDeOuvirPerfil = onSnapshot(refPerfil, (snap) => {
    if (!snap.exists()) {
      erroLogin.innerText = 'Seu usuário não tem perfil cadastrado no sistema. Fala com o administrador.';
      signOut(auth);
      return;
    }
    const dados = snap.data();
    if (dados.ativo !== true) {
      if (!appEl.classList.contains('hidden')) {
        alert('Seu acesso foi desativado. Fala com o administrador.');
      }
      signOut(auth);
      return;
    }
    USUARIO = { ...dados, uid: user.uid };
    if (appEl.classList.contains('hidden')) {
      abrirApp();
    } else {
      document.getElementById('nomeTopo').innerText = USUARIO.nome;
      document.getElementById('cargoTopo').innerText = rotuloCargo(USUARIO.cargo);
      montarMenu();
      atualizarResumoAssinaturaTopo();
    }
  }, (erro) => {
    console.error('Erro ao ouvir perfil:', erro);
    erroLogin.innerText = 'Erro ao carregar seu perfil. Tente novamente.';
  });
});

window.RENDERIZADORES = window.RENDERIZADORES || {};
window.RENDERIZADORES.assinatura = async function () {
  const c = document.getElementById('conteudo');
  c.classList.remove('modo-agenda','modo-atendimentos','modo-transportes','modo-equipamentos');
  c.innerHTML = '<div class="carregando-tela">Calculando armazenamento...</div>';

  try {
    const colecoes = ['atendimentos','transportes','equipamentos'];
    const snaps = await Promise.all(colecoes.map(nome => getDocs(collection(db,nome))));
    let bytesUsados = 0;
    let totalArquivos = 0;
    snaps.forEach(snap => snap.docs.forEach(d => {
      const anexos = Array.isArray(d.data().anexos) ? d.data().anexos : [];
      anexos.forEach(a => {
        bytesUsados += Number(a.tamanho || 0);
        totalArquivos++;
      });
    }));

    const limiteBytes = CONFIG_ASSINATURA.limiteGB * 1024 * 1024 * 1024;
    const pctReal = limiteBytes ? (bytesUsados / limiteBytes) * 100 : 0;

            <div class="assinatura-linha"><span>Manutenção mensal</span><b>${fmtBRL(CONFIG_ASSINATURA.mensalidade)}</b></div>
            <div class="assinatura-linha"><span>Próximo vencimento</span><b>${vencimento}</b></div>
            <button type="button" class="assinatura-pagar" onclick="abrirPagamentoPix(249.00,'Manutenção mensal do Gabinete Digital')">Pagar mensalidade via PIX</button>
          </div>

          <div class="assinatura-card">

      getDocs(collection(db, 'equipamentos')),
      getDocs(collection(db, 'pessoas')),
      getDocs(collection(db, 'agendaEventos'))
    ]);

    const atend = atendSnap.docs.map(d => ({_docId:d.id,...d.data()}));
    const transp = transpSnap.docs.map(d => ({_docId:d.id,...d.data()}));
    const equip = equipSnap.docs.map(d => ({_docId:d.id,...d.data()}));
    const agenda = agendaSnap.docs.map(d => ({_docId:d.id,...d.data()}));
    const totalPessoas = pessoasSnap.size;

    const normaliza = s => (s || '').toString().trim().toUpperCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    const parseBR = txt => {
      const m=String(txt||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if(!m) return null;
      const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
      d.setHours(0,0,0,0);
      return isNaN(d.getTime())?null:d;
    };

    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const inicioMes = new Date(hoje.getFullYear(), hoje.getMonth(), 1);

    const concluidos = atend.filter(a => normaliza(a.status) === 'CONCLUIDO').length;
    const emAnalise = atend.filter(a => normaliza(a.status) === 'EM ANALISE').length;
    const cancelados = atend.filter(a => normaliza(a.status) === 'CANCELADO').length;
    const transpConfirmados = transp.filter(t => normaliza(t.confirmado) === 'SIM').length;
    const equipEmUso = equip.filter(e => normaliza(e.devolucao) === 'USANDO').length;

    const ciclos = atend.map(a => {
      if(a.cicloDias!==undefined && a.cicloDias!==null && !isNaN(Number(a.cicloDias))) return Number(a.cicloDias);
      if(a.ciclo!==undefined && a.ciclo!==null && !isNaN(Number(a.ciclo))) return Number(a.ciclo);
      const ini=parseBR(a.data);
      const fim=parseBR(a.finalizado||a.dataFinalizacao||a.finalizadoEm);
      if(!ini||!fim) return null;
      return Math.max(0,Math.round((fim-ini)/86400000));
    }).filter(v=>v!==null && Number.isFinite(v));

    const mediaDias = ciclos.length ? (ciclos.reduce((s,v)=>s+v,0)/ciclos.length) : 0;

    const atendMes = atend.filter(a => {
      const d=parseBR(a.data);
      return d && d>=inicioMes && d<=hoje;
    }).length;

    const resolutividade = atend.length ? Math.round((concluidos/atend.length)*100) : 0;

    const statusTotal = Math.max(atend.length,1);

    const pctCan = (cancelados/statusTotal)*100;
    const donut = `conic-gradient(#22C55E 0 ${pctCon}%, #F2B23A ${pctCon}% ${pctCon+pctAna}%, #E5272D ${pctCon+pctAna}% ${pctCon+pctAna+pctCan}%, #324A66 ${pctCon+pctAna+pctCan}% 100%)`;

          <p>Resumo operacional do Gabinete Digital em tempo real.</p>

      </div>

        <div class="dash-kpi"><div class="icone">🚐</div><div class="valor">${transp.length}</div><div class="label">Transportes Solicitados</div></div>

        <div class="dash-kpi"><div class="icone">🏆</div><div class="valor">${equipEmUso}</div><div class="label">Equipamentos em Uso</div></div>
        <div class="dash-kpi"><div class="icone">⏱️</div><div class="valor">${mediaDias.toFixed(1)}</div><div class="label">Dias Médios por Atendimento</div></div>
      </div>

      <div class="dash-grid-2">
        <div class="dash-card">
          <h3>Atendimentos por Status</h3>
          <div class="dash-sub">Distribuição atual dos registros.</div>
          <div class="dash-status-wrap">
            <div style="position:relative">
              <div class="dash-donut" style="background:${donut}"></div>
              <div class="dash-donut-centro"><b>${atend.length}</b><span>Total</span></div>
            </div>
            <div class="dash-legenda">
              <div class="dash-legenda-item"><span class="dash-legenda-cor" style="background:#22C55E"></span><span>Concluídos</span><b>${concluidos}</b></div>
              <div class="dash-legenda-item"><span class="dash-legenda-cor" style="background:#F2B23A"></span><span>Em análise</span><b>${emAnalise}</b></div>
              <div class="dash-legenda-item"><span class="dash-legenda-cor" style="background:#E5272D"></span><span>Cancelados</span><b>${cancelados}</b></div>
            </div>
          </div>

        <div class="dash-card">
          <h3>Atendimentos por Tipo</h3>
          <div class="dash-sub">Tipos mais registrados no sistema.</div>
          ${tipos.length ? `<div class="dash-barras">${tipos.map(([nome,qtd])=>`
            <div class="dash-barra-linha">
              <div class="dash-barra-rot" title="${escapar(nome)}">${escapar(nome)}</div>
              <div class="dash-barra-trilho"><div class="dash-barra-preench" style="width:${Math.max(4,(qtd/maxTipo)*100)}%"></div></div>
              <div class="dash-barra-num">${qtd}</div>

        </div>

        <div class="dash-card">
          <h3>Atendimentos por Bairro</h3>
          <div class="dash-sub">Bairros com maior volume de atendimentos.</div>
          ${bairros.length ? `<div class="dash-bairros">${bairros.map(([nome,qtd])=>`
            <div class="dash-bairro-linha">
              <div class="nome" title="${escapar(nome)}">${escapar(nome)}</div>
              <div class="trilho"><div class="fill" style="width:${Math.max(5,(qtd/maxBairro)*100)}%"></div></div>

      <div class="dash-card" style="margin-bottom:14px">

        <div class="dash-sub">Compromissos futuros cadastrados na Agenda.</div>

          const [y,m,d]=e.data.split('-');
          return `<div class="dash-agenda-item">
            <div class="dash-agenda-data">${d}/${m}<br>${escapar(e.hora||'--:--')}</div>
            <div class="dash-agenda-texto"><b>${escapar(e.titulo||'Compromisso')}</b><span>${escapar(e.tipo||'')}${e.local?' · '+escapar(e.local):''}</span></div>
          </div>`;

      </div>

const norm = s => (s || '').toString().trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function kpiMiniMurillo(corFundo, corTexto, icone, numero, rotulo){
  return `<div class="kpi-mini">
    <div class="icone-kpi-mini" style="background:${corFundo};color:${corTexto};">${icone}</div>
    <div>
      <div class="num-kpi-mini">${numero}</div>
      <div class="rot-kpi-mini">${rotulo}</div>
    </div>
  </div>`;
}

function badgeStatus(status) {
  const s = norm(status);
  let classe = 'badge-cinza';
  if (s === 'CONCLUIDO' || s === 'SIM' || s === 'ENTREGUE' || s === 'CONFIRMADO' || s === 'REALIZADO') classe = 'badge-verde';
  else if (s === 'EM ANALISE' || s === 'PLANEJAMENTO') classe = 'badge-amarelo';
  else if (s === 'CANCELADO' || s === 'NAO') classe = 'badge-vermelho';
  return `<span class="badge ${classe}">${status || '-'}</span>`;
}
window.badgeStatus = badgeStatus;

function linkWhatsapp(telefone) {
  if (!telefone) return '-';
  const numeros = String(telefone).replace(/\D/g, '');
  if (!numeros) return telefone;
  const comDDI = numeros.length <= 11 ? '55' + numeros : numeros;
  return '<a href="https://wa.me/' + comDDI + '" target="_blank" style="color:#4ADE80;text-decoration:none;font-weight:700;">💬 ' + telefone + '</a>';
}
function linkWhatsappComMensagem(telefone, mensagem) {
  const numeros = String(telefone || '').replace(/\D/g, '');
  if (!numeros) return null;
  const comDDI = numeros.length <= 11 ? '55' + numeros : numeros;
  return 'https://wa.me/' + comDDI + '?text=' + encodeURIComponent(mensagem);
}
function diaEMesNascimento(dataNascimento) {
  const partes = String(dataNascimento || '').split('/');
  if (partes.length < 2) return null;
  const dia = Number(partes[0]), mes = Number(partes[1]);
  if (!dia || !mes) return null;
  return { dia, mes };
}
function diasAteProximoAniversario(dataNascimento) {
  const dm = diaEMesNascimento(dataNascimento);
  if (!dm) return null;
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  let proximo = new Date(hoje.getFullYear(), dm.mes - 1, dm.dia);
  if (proximo < hoje) proximo = new Date(hoje.getFullYear() + 1, dm.mes - 1, dm.dia);
  return Math.round((proximo - hoje) / (1000 * 60 * 60 * 24));
}

let tiposAtendimentoCache = [];
let tiposEquipamentoCache = [];
let pessoasCache = [];
async function carregarConfiguraveis() {
  try {
    const [ta, te, pe] = await Promise.all([
      getDocs(collection(db, 'tiposAtendimento')),
      getDocs(collection(db, 'tiposEquipamento')),
      getDocs(collection(db, 'pessoas'))
    ]);
    tiposAtendimentoCache = ta.docs.map(d => ({ _docId: d.id, ...d.data() })).sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || '')));
    tiposEquipamentoCache = te.docs.map(d => ({ _docId: d.id, ...d.data() })).sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || '')));
    pessoasCache = pe.docs.map(d => ({ _docId: d.id, ...d.data() })).sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || '')));
  } catch (e) {
    tiposAtendimentoCache = []; tiposEquipamentoCache = []; pessoasCache = [];
  }
}

function campoBuscaPessoa(prefixo) {
  return `
    <div class="campo-modal busca-pessoa-wrap" style="position:relative;grid-column:1/-1;">
      <label>Buscar pessoa já cadastrada (nome, CPF, RG, título ou telefone)</label>
      <input id="${prefixo}_buscaPessoa" placeholder="Comece a digitar..." autocomplete="off">
      <div id="${prefixo}_resultadosPessoa" class="resultados-busca-pessoa hidden"></div>
    </div>`;
}
function ligarBuscaPessoa(prefixo, mapaCampos) {
  const input = document.getElementById(prefixo + '_buscaPessoa');
  const resultados = document.getElementById(prefixo + '_resultadosPessoa');
  if (!input || !resultados) return;
  input.addEventListener('input', () => {
    const termo = norm(input.value);
    const termoNumeros = input.value.replace(/\D/g, '');
    if (termo.length < 2) { resultados.classList.add('hidden'); resultados.innerHTML = ''; return; }
    const encontrados = pessoasCache.filter(p =>
      norm(p.nome).includes(termo) ||
      (p.cpf && norm(p.cpf).includes(termo)) ||
      (p.rg && norm(p.rg).includes(termo)) ||
      (p.tituloEleitor && norm(p.tituloEleitor).includes(termo)) ||
      (termoNumeros.length >= 3 && String(p.telefone || '').replace(/\D/g, '').includes(termoNumeros))
    ).slice(0, 6);
    if (!encontrados.length) {
      resultados.innerHTML = '<div class="item-resultado-pessoa">Nenhuma pessoa encontrada. Preencha manualmente abaixo.</div>';
      resultados.classList.remove('hidden');
      return;
    }
    resultados.innerHTML = encontrados.map(p => `
      <div class="item-resultado-pessoa" data-id="${p._docId}">
        <b>${p.nome}</b>
        <span>${p.cpf ? 'CPF ' + p.cpf + ' · ' : ''}${p.telefone || 'sem telefone'}</span>
      </div>`).join('');
    resultados.classList.remove('hidden');
    resultados.querySelectorAll('.item-resultado-pessoa[data-id]').forEach(el => {
      el.onclick = () => {
        const pessoa = pessoasCache.find(p => p._docId === el.dataset.id);
        if (!pessoa) return;
        Object.keys(mapaCampos).forEach(campoPessoa => {
          const alvo = document.getElementById(mapaCampos[campoPessoa]);
          if (alvo && pessoa[campoPessoa]) alvo.value = pessoa[campoPessoa];
        });
        input.value = pessoa.nome;
        resultados.classList.add('hidden');
      };
    });
  });
  document.addEventListener('click', (ev) => {

/* ===== ANEXOS — 2 GB incluídos no plano; espaço adicional é contratado à parte ===== */
const LIMITE_ANEXO_MB = 5;
const LIMITE_ANEXOS_POR_ENVIO = 5;
const ARMAZENAMENTO_STATUS = { bytesUsados: 0, limiteBytes: CONFIG_ASSINATURA.limiteGB * 1024 * 1024 * 1024, pct: 0 };

async function calcularUsoAnexos() {
  const colecoes = ['atendimentos','transportes','equipamentos'];
  const snaps = await Promise.all(colecoes.map(nome => getDocs(collection(db,nome))));
  let bytesUsados = 0;
  snaps.forEach(snap => snap.docs.forEach(d => {
    const anexos = Array.isArray(d.data().anexos) ? d.data().anexos : [];
    anexos.forEach(a => { bytesUsados += Number(a.tamanho || 0); });
  }));
  const limiteBytes = CONFIG_ASSINATURA.limiteGB * 1024 * 1024 * 1024;
  const pct = limiteBytes ? (bytesUsados / limiteBytes) * 100 : 0;
  Object.assign(ARMAZENAMENTO_STATUS, { bytesUsados, limiteBytes, pct });
  return ARMAZENAMENTO_STATUS;
}

function abrirAssinaturaPorLimite() {
  fecharModaisAbertos();
  irPara('assinatura');
}
window.abrirAssinaturaPorLimite = abrirAssinaturaPorLimite;

function formatarTamanhoArquivo(bytes) {
  if (!bytes) return '';
  const kb = bytes / 1024;
  if (kb < 1024) return kb.toFixed(0) + ' KB';
  return (kb / 1024).toFixed(1) + ' MB';
}

function sanitizarNomeArquivo(nome) {
  return String(nome || 'arquivo').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9.\-_]/g, '_');
}

function itemAnexoHtml(anexo, indice, colecao, docId, podeExcluir, prefixo) {

      ${podeExcluir ? `<button type="button" class="anexo-remover" title="Remover anexo" onclick="event.stopPropagation();excluirAnexoRegistro('${colecao}','${docId}',${indice},'${prefixo}')">✕</button>` : ''}

  const limiteAtingido = ARMAZENAMENTO_STATUS.pct >= 100;

  const avisoUso = emAlerta && !limiteAtingido
    ? `<div class="anexos-ajuda" style="color:#F2B23A;margin-top:6px;">⚠ Armazenamento em ${Math.min(99.9,ARMAZENAMENTO_STATUS.pct).toFixed(1).replace('.',',')}%. Considere aumentar o espaço.</div>`

        ${avisoUso}

// Sobe os arquivos selecionados no input de anexos para o Firebase Storage
// e devolve os metadados prontos para gravar no array "anexos" do documento.
async function enviarAnexosSelecionados(prefixo, colecao, docId) {
  const input = document.getElementById(prefixo + '_arquivosAnexo');
  const arquivos = input && input.files ? Array.from(input.files) : [];
  if (!arquivos.length) return [];

  if (arquivos.length > LIMITE_ANEXOS_POR_ENVIO) {
    throw new Error(`Selecione no máximo ${LIMITE_ANEXOS_POR_ENVIO} arquivos por vez.`);
  }
  const grandeDemais = arquivos.find(f => f.size > LIMITE_ANEXO_MB * 1024 * 1024);
  if (grandeDemais) {
    throw new Error(`O arquivo "${grandeDemais.name}" passa de ${LIMITE_ANEXO_MB}MB.`);
  }

  const uso = await calcularUsoAnexos();
  const bytesNovos = arquivos.reduce((total, f) => total + Number(f.size || 0), 0);
  if (uso.bytesUsados + bytesNovos > uso.limiteBytes) {
    throw new Error(`Limite de ${CONFIG_ASSINATURA.limiteGB} GB atingido. Aumente o armazenamento para enviar novos documentos.`);
  }

  const { getStorage, ref, uploadBytes, getDownloadURL } = await obterStorageMod();
  const storage = getStorage(app);

  const enviados = [];
  for (const arquivo of arquivos) {
    const caminho = `anexos/${colecao}/${docId}/${Date.now()}_${sanitizarNomeArquivo(arquivo.name)}`;
    const refArquivo = ref(storage, caminho);
    await uploadBytes(refArquivo, arquivo);
    const url = await getDownloadURL(refArquivo);
    enviados.push({
      nome: arquivo.name,
      url,
      caminho,
      tamanho: arquivo.size,
      tipo: arquivo.type || '',
      enviadoPor: USUARIO.nome,
      enviadoEm: new Date().toLocaleString('pt-BR')
    });
  }
  return enviados;
}

async function excluirAnexoRegistro(colecao, docId, indice, prefixo) {
  if (somenteLeitura()) return;
  if (!confirm('Remover este anexo?')) return;
  try {
    const refDoc = doc(db, colecao, docId);
    const snap = await getDoc(refDoc);
    if (!snap.exists()) return;
    const anexos = Array.isArray(snap.data().anexos) ? [...snap.data().anexos] : [];
    const [removido] = anexos.splice(indice, 1);
    await updateDoc(refDoc, { anexos });
    if (removido && removido.caminho) {
      obterStorageMod().then(({ getStorage, ref, deleteObject }) => {
        deleteObject(ref(getStorage(app), removido.caminho)).catch(() => {});
      });
    }

    // Atualiza só a lista de anexos dentro do modal aberto, sem fechar o formulário.
    await atualizarResumoAssinaturaTopo();
    const lista = document.getElementById(prefixo + '_listaAnexos');
    if (lista) {
      lista.innerHTML = anexos.map((a, i) => itemAnexoHtml(a, i, colecao, docId, true, prefixo)).join('')
        || '<div class="anexos-vazio">Nenhum anexo enviado ainda.</div>';
    }

    const cacheDoColecao = { atendimentos: atendimentosCache, transportes: transportesCache, equipamentos: equipCacheLista }[colecao];
    const registro = cacheDoColecao && cacheDoColecao.find(r => r._docId === docId);
    if (registro) registro.anexos = anexos;
  } catch (e) {
    alert('Não foi possível remover o anexo: ' + e.message);
  }
}

function valorSeguro(v) {

function parseDataBR(txt) {
  const m = String(txt || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  d.setHours(0,0,0,0);
  return isNaN(d.getTime()) ? null : d;
}

function cicloDiasAtendimento(a) {
  if (a.cicloDias !== undefined && a.cicloDias !== null && String(a.cicloDias) !== '') return a.cicloDias;
  if (a.ciclo !== undefined && a.ciclo !== null && String(a.ciclo) !== '') return a.ciclo;
  const inicio = parseDataBR(a.data);
  if (!inicio) return '-';
  const fim = parseDataBR(a.finalizado || a.dataFinalizacao || a.finalizadoEm) || new Date();
  fim.setHours(0,0,0,0);
  return Math.max(0, Math.floor((fim - inicio) / 86400000));
}

async function salvarAtendimento(docId) {
  const botao = document.getElementById('btnSalvarAtend');
  if (botao.disabled) return;
  botao.disabled = true; botao.innerText = 'Salvando...';

  const dados = {
    nome: document.getElementById('m_nome').value.trim(),
    telefone: document.getElementById('m_telefone').value.trim(),
    endereco: document.getElementById('m_endereco').value.trim(),
    bairro: document.getElementById('m_bairro').value.trim(),
    data: document.getElementById('m_data').value.trim(),
    tipoAtendimento: document.getElementById('m_tipo').value,
    status: document.getElementById('m_status').value,
    responsavel: document.getElementById('m_responsavel').value.trim(),
    indicador: document.getElementById('m_indicador').value.trim(),
    observacoes: document.getElementById('m_obs').value.trim(),
    ultimaEdicaoPor: USUARIO.nome,
    ultimaEdicaoData: new Date().toLocaleString('pt-BR')
  };

  try {
    let idDoc = docId;
    if (docId) {
      await updateDoc(doc(db, 'atendimentos', docId), dados);
    } else {
      dados.criadoPor = USUARIO.nome;
      const novo = await addDoc(collection(db, 'atendimentos'), dados);
      idDoc = novo.id;
    }

    const novosAnexos = await enviarAnexosSelecionados('m', 'atendimentos', idDoc);
    if (novosAnexos.length) {
      const existentes = docId ? (atendimentosCache.find(a => a._docId === docId)?.anexos || []) : [];
      await updateDoc(doc(db, 'atendimentos', idDoc), { anexos: [...existentes, ...novosAnexos] });
      await atualizarResumoAssinaturaTopo();
    }

    document.querySelector('.gcal-modal-bg, .modal-fundo')?.remove();
    window.RENDERIZADORES.atendimentos();
  } catch (e) {
    alert('Não foi possível salvar: ' + e.message);
    botao.disabled = false; botao.innerText = 'Salvar';
  }
}

const GOOGLE_CALENDAR_CLIENT_ID = '1039162247732-09p5akmko66785vljicdmna9shgpo2eo.apps.googleusercontent.com';
const GOOGLE_CALENDAR_SCOPE = 'https://www.googleapis.com/auth/calendar.events';

function escapar(v){ return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function eventosDoDiaISO(iso){
  const locais=agendaEventosCache.filter(e=>e.data===iso);
  const idsGoogleLocais=new Set(locais.map(e=>e.googleEventId).filter(Boolean));
  const google=agendaGoogleCache.filter(e=>e.data===iso && !idsGoogleLocais.has(e.googleEventId));
  return [...locais,...google].sort((a,b)=>String(a.hora||'').localeCompare(String(b.hora||'')));
}


function googleTokenValido(){
  return !!googleAccessToken && Date.now() < (googleTokenExpiraEm - 30000);
}

function atualizarEstadoGoogleAgenda(){
  const btn=document.getElementById('btnGoogleAgenda');
  const sync=document.getElementById('btnSyncGoogleAgenda');
  if(btn){
    const conectado=googleTokenValido();
    btn.classList.toggle('conectado',conectado);
    btn.innerHTML=`<span class="gcal-google-dot"></span>${conectado?'Google conectado':'Conectar Google'}`;
  }
  if(sync) sync.disabled=!googleTokenValido() || googleCarregando;
}

function esperarGIS(timeout=10000){
  if(window.google?.accounts?.oauth2) return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const inicio=Date.now();
    const t=setInterval(()=>{
      if(window.google?.accounts?.oauth2){
        clearInterval(t); resolve();
      }else if(Date.now()-inicio>timeout){
        clearInterval(t); reject(new Error('Google Identity Services não carregou.'));
      }
    },100);
  });
}

async function conectarGoogleAgenda(){
  try{
    await esperarGIS();

    if(!googleTokenClient){
      googleTokenClient=google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CALENDAR_CLIENT_ID,
        scope: GOOGLE_CALENDAR_SCOPE,
        callback: async (resp)=>{
          if(resp.error){
            alert('Não foi possível conectar ao Google Agenda: '+resp.error);
            return;
          }
          googleAccessToken=resp.access_token||'';
          googleTokenExpiraEm=Date.now()+((Number(resp.expires_in)||3600)*1000);
          atualizarEstadoGoogleAgenda();
          try{
            await carregarEventosGoogleMes(true);
          }catch(e){
            console.error(e);
            alert('Conectou ao Google, mas não foi possível carregar a agenda: '+e.message);
          }
        }
      });
    }

    if(googleTokenValido()){
      await carregarEventosGoogleMes(true);
      return;
    }

    googleTokenClient.requestAccessToken({prompt:'select_account'});
  }catch(e){
    console.error(e);
    alert('Não foi possível iniciar a conexão com o Google Agenda: '+e.message);
  }
}

function intervaloVisivelGoogle(){
  const primeiro=new Date(agendaAno,agendaMes,1,0,0,0,0);
  const inicio=new Date(primeiro);
  inicio.setDate(1-primeiro.getDay());

  const fim=new Date(inicio);
  fim.setDate(inicio.getDate()+42);
  return {inicio,fim};
}

function dataHoraGoogleParaCampos(ev){
  const start=ev.start||{};
  const end=ev.end||{};
  const data=start.date || (start.dateTime ? start.dateTime.slice(0,10) : '');
  let hora='', horaFim='';

  if(start.dateTime){
    const ds=new Date(start.dateTime);
    hora=String(ds.getHours()).padStart(2,'0')+':'+String(ds.getMinutes()).padStart(2,'0');
  }
  if(end.dateTime){
    const de=new Date(end.dateTime);
    horaFim=String(de.getHours()).padStart(2,'0')+':'+String(de.getMinutes()).padStart(2,'0');
  }

  const privado=ev.extendedProperties?.private||{};
  return {
    _docId:'',
    _origemGoogle:true,
    googleEventId:ev.id,
    googleHtmlLink:ev.htmlLink||'',
    titulo:ev.summary||'(Sem título)',
    data,
    hora,
    horaFim,
    tipo:privado.gabineteTipo||'COMPROMISSO',
    local:ev.location||'',
    status:privado.gabineteStatus||'CONFIRMADO',
    lembrete:true,
    observacoes:ev.description||''
  };
}

async function googleApi(path, options={}){
  if(!googleTokenValido()) throw new Error('Google Agenda desconectado. Clique em “Conectar Google”.');

  const resp=await fetch('https://www.googleapis.com/calendar/v3'+path,{
    ...options,
    headers:{
      'Authorization':'Bearer '+googleAccessToken,
      'Content-Type':'application/json',
      ...(options.headers||{})
    }
  });

  if(resp.status===401){
    googleAccessToken='';
    googleTokenExpiraEm=0;
    atualizarEstadoGoogleAgenda();
    throw new Error('A autorização do Google expirou. Conecte novamente.');
  }

  if(resp.status===204) return null;
  const body=await resp.json().catch(()=>({}));
  if(!resp.ok){
    const msg=body?.error?.message||('Erro Google Calendar '+resp.status);
    throw new Error(msg);
  }
  return body;
}

async function carregarEventosGoogleMes(forcar=false){
  if(!googleTokenValido()) return;
  if(googleCarregando && !forcar) return;

  googleCarregando=true;
  atualizarEstadoGoogleAgenda();

  try{
    const {inicio,fim}=intervaloVisivelGoogle();
    const params=new URLSearchParams({
      timeMin:inicio.toISOString(),
      timeMax:fim.toISOString(),
      singleEvents:'true',
      orderBy:'startTime',
      maxResults:'2500',
      timeZone:'America/Sao_Paulo'
    });

    const dados=await googleApi(`/calendars/${encodeURIComponent(GOOGLE_CALENDAR_ID)}/events?${params.toString()}`);
    agendaGoogleCache=(dados.items||[])
      .filter(ev=>ev.status!=='cancelled')
      .map(dataHoraGoogleParaCampos)
      .filter(ev=>ev.data);

    desenharAgenda();
  }finally{
    googleCarregando=false;
    atualizarEstadoGoogleAgenda();
  }
}
window.carregarEventosGoogleMes=carregarEventosGoogleMes;

function proximoDiaISO(iso){
  const [y,m,d]=iso.split('-').map(Number);
  const dt=new Date(y,m-1,d,12,0,0,0);
  dt.setDate(dt.getDate()+1);
  return dataISOlocal(dt);
}

function corpoEventoGoogle(dados){
  const base={
    summary:dados.titulo||'Compromisso',
    location:dados.local||'',
    description:dados.observacoes||'',
    extendedProperties:{
      private:{
        gabineteTipo:dados.tipo||'COMPROMISSO',
        gabineteStatus:dados.status||'PLANEJADO',
        origem:'gabinete-digital'
      }
    },
    reminders:dados.lembrete!==false
      ? {useDefault:false,overrides:[{method:'popup',minutes:45}]}
      : {useDefault:false,overrides:[]}
  };

  if(dados.hora){
    const fim=dados.horaFim || (() => {
      const [hh,mm]=dados.hora.split(':').map(Number);
      const dt=new Date(2000,0,1,hh,mm||0);
      dt.setHours(dt.getHours()+1);
      return String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
    })();

    base.start={dateTime:`${dados.data}T${dados.hora}:00`,timeZone:'America/Sao_Paulo'};
    base.end={dateTime:`${dados.data}T${fim}:00`,timeZone:'America/Sao_Paulo'};
  }else{
    base.start={date:dados.data};
    base.end={date:proximoDiaISO(dados.data)};
  }

  return base;
}

async function criarEventoGoogle(dados){
  return await googleApi(`/calendars/${encodeURIComponent(GOOGLE_CALENDAR_ID)}/events`,{
    method:'POST',

  });
}

async function atualizarEventoGoogle(eventId,dados){
  return await googleApi(`/calendars/${encodeURIComponent(GOOGLE_CALENDAR_ID)}/events/${encodeURIComponent(eventId)}`,{
    method:'PATCH',
    body:JSON.stringify(corpoEventoGoogle(dados))
  });
}

async function excluirEventoGoogle(eventId){
  return await googleApi(`/calendars/${encodeURIComponent(GOOGLE_CALENDAR_ID)}/events/${encodeURIComponent(eventId)}`,{
    method:'DELETE'

}

function classeStatusAgenda(status){
  const s=norm(status||'PLANEJADO');
  if(s==='CONFIRMADO') return 'confirmado';
  if(s==='REALIZADO') return 'realizado';
  if(s==='CANCELADO') return 'cancelado';
  return 'planejado';
}

function escapeAttrJson(obj){
  return JSON.stringify(obj).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}


function limiteEventosPorDia(){
  // Sempre mostra 2 compromissos no quadrinho.
  // O 3º espaço vira "Mais X".
  return 2;
}

function fecharPopupDiaAgenda(){
  document.querySelector('.gcal-day-popup')?.remove();

function fecharPopupDiaAgendaFora(e){
