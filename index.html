<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gabinete Digital — Vereador Murillo Godoy</title>
<link rel="apple-touch-icon" sizes="180x180" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gabinete Digital">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Gabinete Digital">
<meta name="theme-color" content="#0A1728">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo:#070E19; --superficie:#0A1728; --superficie-sutil:#0D1D33;
    --borda:#1C2C41; --texto:#F5F8FC; --texto-suave:#B8C4D4; --texto-fraco:#7C8BA0;
    --acento:#E5272D; --verde:#22C55E; --azul:#2563EB; --amarelo:#F2B23A; --roxo:#A855F7;
    --raio-s:8px; --raio-m:12px; --raio-l:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',Arial,sans-serif;background:var(--fundo);color:var(--texto);-webkit-font-smoothing:antialiased;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ===== SPLASH (abertura) ===== */
  #telaSplash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#101F35,#070E19 60%);gap:18px;text-align:center;padding:20px;}
  .splash-caixa{width:170px;height:170px;border-radius:var(--raio-l);background:var(--superficie);border:1px solid var(--borda);display:flex;align-items:center;justify-content:center;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .splash-caixa img{width:100%;object-fit:contain;border-radius:8px;}
  .splash-titulo{font-size:22px;font-weight:900;letter-spacing:.3px;}
  .splash-titulo span{color:var(--acento);}
  .splash-sub{font-size:11.5px;color:var(--texto-fraco);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-top:-8px;}
  .splash-spin{width:30px;height:30px;border-radius:50%;border:3px solid #1C2C41;border-top-color:var(--acento);animation:girar 0.8s linear infinite;margin-top:6px;}
  @keyframes girar{to{transform:rotate(360deg);}}
  #pularSplash{color:#5C86D8;font-size:12.5px;text-decoration:underline;background:none;border:none;margin-top:4px;}

  /* ===== LOGIN ===== */
  #telaLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#101F35,#070E19 60%);padding:20px;}
  .card-login{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-l);padding:40px 32px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,.5);}
  .card-login img{width:100%;max-width:220px;display:block;margin:0 auto 16px;border-radius:8px;}
  .card-login h1{text-align:center;font-size:15px;letter-spacing:.5px;color:var(--texto-suave);margin:0 0 28px;text-transform:uppercase;font-weight:700;}
  .card-login h1 span{color:var(--acento);}
  .campo-login{margin-bottom:14px;}
  .campo-login input{width:100%;padding:13px 14px;border-radius:var(--raio-s);border:1px solid var(--borda);background:var(--superficie-sutil);color:var(--texto);font-size:14px;outline:none;}
  .campo-login input:focus{border-color:var(--acento);}
  #btnEntrar{width:100%;padding:14px;border:none;border-radius:var(--raio-s);background:var(--acento);color:#fff;font-weight:800;font-size:14.5px;margin-top:6px;transition:filter .15s;}
  #btnEntrar:hover{filter:brightness(1.1);}
  #btnEntrar:disabled{opacity:.6;cursor:default;}
  #erroLogin{color:#FF7479;font-size:12.5px;margin-top:12px;text-align:center;min-height:16px;}

  /* ===== APP ===== */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  header.topo-app{background:#071425;border-bottom:1px solid var(--borda);padding:10px 30px;display:flex;align-items:center;gap:16px;min-height:68px;}
  .logo-topo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .logo-topo img{height:46px;width:auto;max-width:92px;object-fit:contain;border-radius:6px;}
  .marca-topo{font-size:13px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--texto-suave);white-space:nowrap;}
  .marca-topo span{color:var(--acento);}
  .saudacao-bloco{padding-left:4px;}
  .saudacao-bloco h2{margin:0;font-size:22px;font-weight:900;line-height:1.05;}
  .saudacao-bloco .sub{font-size:10.5px;color:#7590B5;text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-top:5px;}
  .topo-direita{display:flex;align-items:center;gap:14px;margin-left:auto;}
  .data-topo{min-width:142px;padding:8px 12px;border:1px solid var(--borda);border-radius:12px;text-align:right;background:#09182A;}
  .data-topo b{display:block;font-size:11px;color:#fff;}
  .data-topo span{font-size:9.5px;color:#7892B6;}
  .notificacao-topo{position:relative;width:38px;height:38px;border:none;background:transparent;color:#FFD166;font-size:18px;display:flex;align-items:center;justify-content:center;}
  .notificacao-badge{position:absolute;top:0;right:1px;min-width:16px;height:16px;border-radius:10px;background:var(--acento);color:#fff;font-size:9px;font-weight:900;display:none;align-items:center;justify-content:center;padding:0 4px;}
  .perfil-topo{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--borda);}
  .avatar-topo{width:38px;height:38px;border-radius:50%;background:var(--superficie-sutil);border:1px solid var(--borda);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;overflow:hidden;}
  .avatar-topo img{width:100%;height:100%;object-fit:cover;}
  .perfil-texto b{display:block;font-size:12.5px;}
  .perfil-texto span{font-size:10px;color:#7892B6;text-transform:uppercase;}
  #btnSair{background:none;border:1px solid #5A2832;color:#FF6B70;border-radius:var(--raio-s);padding:8px 14px;font-weight:800;font-size:12.5px;}
  #btnSair:hover{background:#2A1218;}

  nav.menu-nav-topo{display:flex;gap:2px;padding:0 28px;background:#071425;border-bottom:1px solid var(--borda);overflow-x:auto;scrollbar-width:thin;}
  nav.menu-nav-topo button{background:none;border:none;color:#BFCBDD;padding:13px 14px;font-size:12.5px;font-weight:800;white-space:nowrap;border-bottom:3px solid transparent;}
  nav.menu-nav-topo button.ativo{color:#fff;border-bottom-color:var(--acento);background:rgba(229,39,45,.06);}
  nav.menu-nav-topo button:hover{color:#fff;}

  main{flex:1;padding:26px 28px 60px;width:100%;max-width:none;margin:0;}

  .topo-pagina{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:14px;}
  .topo-pagina h2{margin:0;font-size:21px;font-weight:900;white-space:nowrap;}
  .topo-pagina h2 .destaque{color:var(--acento);}
  .topo-pagina-atend{display:grid;grid-template-columns:auto minmax(520px,1fr) minmax(230px,305px);align-items:center;gap:12px;margin-bottom:12px;}
  .kpis-faixa{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--borda);border-radius:14px;overflow:hidden;background:var(--superficie);}
  .kpi-faixa-item{padding:8px 14px;min-width:0;border-right:1px solid var(--borda);}
  .kpi-faixa-item:last-child{border-right:none;}
  .kpi-faixa-item .num{font-size:25px;font-weight:900;line-height:1;color:#fff;}
  .kpi-faixa-item .rot{font-size:8.5px;color:#7F91AA;text-transform:uppercase;font-weight:900;letter-spacing:.5px;margin-top:4px;}
  .btn-primario{background:var(--acento);color:#fff;border:none;border-radius:var(--raio-s);padding:11px 18px;font-weight:800;font-size:13px;}
  .btn-primario:hover{filter:brightness(1.1);}
  .btn-secundario{background:var(--superficie-sutil);color:var(--texto);border:1px solid var(--borda);border-radius:var(--raio-s);padding:9px 14px;font-weight:700;font-size:12.5px;}
  .btn-secundario:hover{background:#132238;}

  .kpis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px;}
  .kpi-card{background:var(--superficie);border:1px solid var(--borda);border-left:4px solid var(--acento);border-radius:var(--raio-s);padding:18px 20px;}
  .kpi-card .num{font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1;color:#fff;}
  .kpi-card .rot{font-size:10.5px;color:var(--acento);text-transform:uppercase;letter-spacing:.4px;font-weight:800;margin-top:6px;}

  .grafico-box,.painel-box{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-m);padding:20px;}
  .grafico-box h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--texto-suave);}

  .carregando-tela{text-align:center;padding:60px 20px;color:var(--texto-fraco);}

  /* ===== Tabela ===== */
  .tabela-box{background:var(--superficie);border-top:2px solid #17304C;border-bottom:1px solid var(--borda);overflow:auto;max-height:calc(100vh - 315px);}
  table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:1650px;}
  thead th{position:sticky;top:0;z-index:3;text-align:center;padding:12px 8px;color:#F4F7FC;text-transform:uppercase;font-size:8.5px;letter-spacing:.15px;font-weight:900;border-bottom:1px solid #315171;background:#09192B;white-space:nowrap;}
  tbody td{padding:9px 8px;border-bottom:1px solid #1A3048;vertical-align:middle;line-height:1.25;}
  tbody tr:hover{background:#0D2239;}
  .barra-acoes{display:grid;grid-template-columns:minmax(185px,1fr) 178px 138px 100px;gap:10px;margin-bottom:12px;}
  .barra-acoes input,.barra-acoes select{width:100%;padding:10px 12px;border-radius:var(--raio-s);border:1px solid #28415D;background:#0B1B2F;color:var(--texto);font-size:12px;outline:none;}
  .barra-acoes input:focus,.barra-acoes select:focus{border-color:#496785;}
  .barra-acoes .btn-secundario{height:100%;}
  .td-wrap{white-space:normal;min-width:120px;}
  .td-obs{white-space:normal;min-width:170px;max-width:230px;overflow:hidden;text-overflow:ellipsis;}
  .acoes-linha{display:flex;gap:5px;white-space:nowrap;}
  .btn-tabela{padding:6px 10px;font-size:10px;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge-verde{background:rgba(34,197,94,.15);color:#4ADE80;}
  .badge-amarelo{background:rgba(242,178,58,.15);color:#F2B23A;}
  .badge-vermelho{background:rgba(229,39,45,.15);color:#F26D6D;}
  .badge-cinza{background:rgba(124,139,160,.15);color:#9CAAC0;}

  /* ===== Modal ===== */
  .modal-fundo{position:fixed;inset:0;background:rgba(3,7,14,.72);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;}
  .modal{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-l);padding:26px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}
  .modal h2{margin:0 0 18px;font-size:18px;}
  .campo-modal{margin-bottom:14px;}
  .campo-modal label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--texto-fraco);font-weight:700;margin-bottom:6px;}
  .campo-modal input,.campo-modal select,.campo-modal textarea{width:100%;padding:10px 12px;border-radius:var(--raio-s);border:1px solid var(--borda);background:var(--superficie-sutil);color:var(--texto);font-size:13.5px;box-sizing:border-box;}
  .campo-modal textarea{resize:vertical;min-height:70px;font-family:inherit;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-acoes{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;}
  .resultados-busca-pessoa{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--fundo);border:1px solid var(--acento);border-radius:var(--raio-s);max-height:220px;overflow-y:auto;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.5);}
  .item-resultado-pessoa{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--borda);display:flex;flex-direction:column;gap:2px;}
  .item-resultado-pessoa:last-child{border-bottom:none;}
  .item-resultado-pessoa:hover{background:var(--superficie-sutil);}
  .item-resultado-pessoa b{font-size:12.5px;color:#fff;}
  .item-resultado-pessoa span{font-size:11px;color:var(--texto-fraco);}
  .aviso-perfil{background:rgba(242,178,58,.12);border:1px solid rgba(242,178,58,.35);color:#F2B23A;padding:11px 15px;border-radius:var(--raio-s);font-size:12px;margin-bottom:16px;}
  .kpis-mini-row{display:flex;gap:10px;flex-wrap:wrap;}
  .kpi-mini{display:flex;align-items:center;gap:10px;background:var(--superficie);border:1px solid var(--borda);border-radius:12px;padding:9px 14px;min-width:130px;}
  .icone-kpi-mini{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .num-kpi-mini{font-size:16px;font-weight:800;color:#fff;line-height:1;}
  .rot-kpi-mini{font-size:9px;color:var(--texto-fraco);margin-top:2px;text-transform:uppercase;letter-spacing:.3px;}

  @media(max-width:1180px){
    .topo-pagina-atend{grid-template-columns:1fr;}
    .topo-pagina-atend .btn-primario{justify-self:start;}
    .kpis-faixa{width:100%;}
    .data-topo{display:none;}
  }
  @media(max-width:820px){
    header.topo-app{padding:10px 14px;gap:10px;flex-wrap:wrap;}
    .marca-topo{display:none;}
    .logo-topo img{height:40px;}
    .saudacao-bloco h2{font-size:17px;}
    .saudacao-bloco .sub{display:none;}
    .topo-direita{gap:8px;}
    .perfil-texto{display:none;}
    main{padding:16px 12px 40px;}
    nav.menu-nav-topo{padding:0 8px;}
    .barra-acoes{grid-template-columns:1fr 1fr;}
    .kpis-faixa{grid-template-columns:1fr 1fr;}
    .kpi-faixa-item:nth-child(2){border-right:none;}
    .kpi-faixa-item:nth-child(-n+2){border-bottom:1px solid var(--borda);}
  }
  @media(max-width:520px){
    .saudacao-bloco{flex:1;}
    .notificacao-topo{display:none;}
    .barra-acoes{grid-template-columns:1fr;}
    .topo-pagina-atend{gap:10px;}
    .topo-pagina h2,.topo-pagina-atend h2{font-size:18px;}
    .kpi-faixa-item .num{font-size:20px;}
    table{font-size:11px;}
  }
</style>
</head>
<body>

<div id="telaSplash">
  <div class="splash-caixa"><img src="./icon-512.png" alt="Gabinete Digital" onerror="this.style.display='none'"></div>
  <div class="splash-titulo">GABINETE <span>DIGITAL</span></div>
  <div class="splash-sub">Vereador Murillo Godoy</div>
  <div class="splash-spin"></div>
  <button id="pularSplash">Não abriu? Toque aqui</button>
</div>

<div id="telaLogin" class="hidden">
  <div class="card-login">
    <img src="./icon-512.png" alt="Gabinete Digital" onerror="this.style.display='none'">
    <h1>GABINETE <span>DIGITAL</span></h1>
    <div class="campo-login"><input id="inputEmail" type="email" placeholder="E-mail" autocomplete="username"></div>
    <div class="campo-login"><input id="inputSenha" type="password" placeholder="Senha" autocomplete="current-password"></div>
    <button id="btnEntrar">Entrar</button>
    <div id="erroLogin"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topo-app">
    <div class="logo-topo">
      <img src="./icon-512.png" alt="Logo" onerror="this.style.display='none'">
      <div class="marca-topo">GABINETE <span>DIGITAL</span></div>
    </div>
    <div class="saudacao-bloco">
      <h2 id="saudacaoTopo">Olá!</h2>
      <div class="sub">Painel Geral de Gestão • Gabinete Digital</div>
    </div>
    <div class="topo-direita">
      <div class="data-topo"><b id="dataTopo">-</b><span id="diaSemanaTopo">-</span></div>
      <button class="notificacao-topo" type="button" title="Notificações">🔔<span class="notificacao-badge" id="notificacaoBadge">0</span></button>
      <div class="perfil-topo">
        <div class="avatar-topo" id="avatarTopo">-</div>
        <div class="perfil-texto"><b id="nomeTopo">-</b><span id="cargoTopo">-</span></div>
      </div>
      <button id="btnSair">↩ Sair</button>
    </div>
  </header>
  <nav class="menu-nav-topo" id="menuNav"></nav>
  <main id="conteudo"><div class="carregando-tela">Carregando...</div></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc,
  onSnapshot, collection, query, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ---- Config real do projeto Gabinete-Murillo Godoy ----
const firebaseConfig = {
  apiKey: "AIzaSyD23LG4NhHDRfiHeXCSumKyTiXRV_yk5bc",
  authDomain: "gabinete-murillo-godoy.firebaseapp.com",
  projectId: "gabinete-murillo-godoy",
  storageBucket: "gabinete-murillo-godoy.firebasestorage.app",
  messagingSenderId: "1039162247732",
  appId: "1:1039162247732:web:900c8f90cd7b210930d861"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Expõe pro resto do código (módulos futuros usam window.db, window.auth)
window.__db = db;
window.__auth = auth;

let USUARIO = null;
let UID = null;
let paginaAtual = 'dashboard';
let pararDeOuvirPerfil = null;

const telaSplash = document.getElementById('telaSplash');
const telaLogin = document.getElementById('telaLogin');
const appEl = document.getElementById('app');

function esconderSplash() {
  if (telaSplash.classList.contains('hidden')) return;
  telaSplash.classList.add('hidden');
  telaLogin.classList.remove('hidden');
}
document.getElementById('pularSplash').onclick = esconderSplash;
setTimeout(esconderSplash, 1200);
const inputEmail = document.getElementById('inputEmail');
const inputSenha = document.getElementById('inputSenha');
const btnEntrar = document.getElementById('btnEntrar');
const erroLogin = document.getElementById('erroLogin');
const btnSair = document.getElementById('btnSair');

function mapaErroFirebase(codigo) {
  const mapa = {
    'auth/invalid-email': 'E-mail inválido.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/wrong-password': 'E-mail ou senha incorretos.',
    'auth/user-not-found': 'E-mail ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas. Espera um pouco e tenta de novo.',
    'auth/network-request-failed': 'Falha de conexão. Verifica sua internet.'
  };
  return mapa[codigo] || 'Não foi possível entrar. Tente novamente.';
}

async function fazerLogin() {
  const email = inputEmail.value.trim();
  const senha = inputSenha.value;
  if (!email || !senha) { erroLogin.innerText = 'Preenche e-mail e senha.'; return; }
  btnEntrar.disabled = true; btnEntrar.innerText = 'Entrando...'; erroLogin.innerText = '';
  try {
    await signInWithEmailAndPassword(auth, email, senha);
    // onAuthStateChanged cuida do resto (carregar perfil e abrir o app)
  } catch (e) {
    erroLogin.innerText = mapaErroFirebase(e.code);
    btnEntrar.disabled = false; btnEntrar.innerText = 'Entrar';
  }
}

btnEntrar.onclick = fazerLogin;
inputSenha.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
inputEmail.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });

btnSair.onclick = async () => {
  if (pararDeOuvirPerfil) pararDeOuvirPerfil();
  await signOut(auth);
};

function iniciaisNome(nome) {
  if (!nome) return '?';
  const p = nome.trim().split(' ');
  return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
}

function rotuloCargo(cargo) {

// Observa login/logout
onAuthStateChanged(auth, async (user) => {
  if (pararDeOuvirPerfil) { pararDeOuvirPerfil(); pararDeOuvirPerfil = null; }

  if (!user) {
    fecharApp();
    return;
  }

  UID = user.uid;
  const refPerfil = doc(db, 'usuarios', user.uid);

  // Ouve o perfil em tempo real: se alguém desativar esse usuário
  // (ativo:false), ele é deslogado na hora, sem precisar recarregar.
  pararDeOuvirPerfil = onSnapshot(refPerfil, (snap) => {
    if (!snap.exists()) {
      erroLogin.innerText = 'Seu usuário não tem perfil cadastrado no sistema. Fala com o administrador.';
      signOut(auth);
      return;
    }
    const dados = snap.data();
    if (dados.ativo !== true) {
      if (!appEl.classList.contains('hidden')) {
        alert('Seu acesso foi desativado. Fala com o administrador.');
      }
      signOut(auth);
      return;
    }
    USUARIO = { ...dados, uid: user.uid };
    if (appEl.classList.contains('hidden')) {
      abrirApp();
    } else {
      // perfil mudou (ex: cargo) enquanto já estava logado — atualiza topo e menu
      document.getElementById('nomeTopo').innerText = USUARIO.nome;
      document.getElementById('cargoTopo').innerText = rotuloCargo(USUARIO.cargo);
      montarMenu();
    }
  }, (erro) => {
    console.error('Erro ao ouvir perfil:', erro);
    erroLogin.innerText = 'Erro ao carregar seu perfil. Tente novamente.';
  });
});

// ---------------- ATENDIMENTOS ----------------
const norm = s => (s || '').toString().trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function badgeStatus(status) {
  const s = norm(status);
  let classe = 'badge-cinza';
  if (s === 'CONCLUIDO' || s === 'SIM' || s === 'ENTREGUE') classe = 'badge-verde';
  else if (s === 'EM ANALISE') classe = 'badge-amarelo';
  else if (s === 'CANCELADO' || s === 'NAO') classe = 'badge-vermelho';
  return `<span class="badge ${classe}">${status || '-'}</span>`;
}
window.badgeStatus = badgeStatus;

function linkWhatsapp(telefone) {
  if (!telefone) return '-';
  const numeros = String(telefone).replace(/\D/g, '');
  if (!numeros) return telefone;
  const comDDI = numeros.length <= 11 ? '55' + numeros : numeros;
  return '<a href="https://wa.me/' + comDDI + '" target="_blank" style="color:#4ADE80;text-decoration:none;font-weight:700;">💬 ' + telefone + '</a>';
}
function linkWhatsappComMensagem(telefone, mensagem) {
  const numeros = String(telefone || '').replace(/\D/g, '');
  if (!numeros) return null;
  const comDDI = numeros.length <= 11 ? '55' + numeros : numeros;
  return 'https://wa.me/' + comDDI + '?text=' + encodeURIComponent(mensagem);
}
function diaEMesNascimento(dataNascimento) {
  const partes = String(dataNascimento || '').split('/');
  if (partes.length < 2) return null;
  const dia = Number(partes[0]), mes = Number(partes[1]);
  if (!dia || !mes) return null;
  return { dia, mes };
}
function diasAteProximoAniversario(dataNascimento) {
  const dm = diaEMesNascimento(dataNascimento);
  if (!dm) return null;
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  let proximo = new Date(hoje.getFullYear(), dm.mes - 1, dm.dia);
  if (proximo < hoje) proximo = new Date(hoje.getFullYear() + 1, dm.mes - 1, dm.dia);
  return Math.round((proximo - hoje) / (1000 * 60 * 60 * 24));
}

let tiposAtendimentoCache = [];
let tiposEquipamentoCache = [];
let pessoasCache = [];
async function carregarConfiguraveis() {
  try {
    const [ta, te, pe] = await Promise.all([
      getDocs(collection(db, 'tiposAtendimento')),
      getDocs(collection(db, 'tiposEquipamento')),
      getDocs(collection(db, 'pessoas'))
    ]);
    tiposAtendimentoCache = ta.docs.map(d => ({ _docId: d.id, ...d.data() })).sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || '')));
    tiposEquipamentoCache = te.docs.map(d => ({ _docId: d.id, ...d.data() })).sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || '')));
    pessoasCache = pe.docs.map(d => ({ _docId: d.id, ...d.data() })).sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || '')));
  } catch (e) {
    tiposAtendimentoCache = []; tiposEquipamentoCache = []; pessoasCache = [];
  }
}

function campoBuscaPessoa(prefixo) {
  return `
    <div class="campo-modal busca-pessoa-wrap" style="position:relative;grid-column:1/-1;">
      <label>Buscar pessoa já cadastrada (nome, CPF, RG, título ou telefone)</label>
      <input id="${prefixo}_buscaPessoa" placeholder="Comece a digitar..." autocomplete="off">
      <div id="${prefixo}_resultadosPessoa" class="resultados-busca-pessoa hidden"></div>
    </div>`;
}
function ligarBuscaPessoa(prefixo, mapaCampos) {
  const input = document.getElementById(prefixo + '_buscaPessoa');
  const resultados = document.getElementById(prefixo + '_resultadosPessoa');
  if (!input || !resultados) return;
  input.addEventListener('input', () => {
    const termo = norm(input.value);
    const termoNumeros = input.value.replace(/\D/g, '');
    if (termo.length < 2) { resultados.classList.add('hidden'); resultados.innerHTML = ''; return; }
    const encontrados = pessoasCache.filter(p =>
      norm(p.nome).includes(termo) ||
      (p.cpf && norm(p.cpf).includes(termo)) ||
      (p.rg && norm(p.rg).includes(termo)) ||
      (p.tituloEleitor && norm(p.tituloEleitor).includes(termo)) ||
      (termoNumeros.length >= 3 && String(p.telefone || '').replace(/\D/g, '').includes(termoNumeros))
    ).slice(0, 6);
    if (!encontrados.length) {
      resultados.innerHTML = '<div class="item-resultado-pessoa">Nenhuma pessoa encontrada. Preencha manualmente abaixo.</div>';
      resultados.classList.remove('hidden');
      return;
    }
    resultados.innerHTML = encontrados.map(p => `
      <div class="item-resultado-pessoa" data-id="${p._docId}">
        <b>${p.nome}</b>
        <span>${p.cpf ? 'CPF ' + p.cpf + ' · ' : ''}${p.telefone || 'sem telefone'}</span>
      </div>`).join('');
    resultados.classList.remove('hidden');
    resultados.querySelectorAll('.item-resultado-pessoa[data-id]').forEach(el => {
      el.onclick = () => {
        const pessoa = pessoasCache.find(p => p._docId === el.dataset.id);
        if (!pessoa) return;
        Object.keys(mapaCampos).forEach(campoPessoa => {
          const alvo = document.getElementById(mapaCampos[campoPessoa]);
          if (alvo && pessoa[campoPessoa]) alvo.value = pessoa[campoPessoa];
        });
        input.value = pessoa.nome;
        resultados.classList.add('hidden');
      };
    });
  });
  document.addEventListener('click', (ev) => {
    if (!ev.target.closest('.busca-pessoa-wrap')) resultados.classList.add('hidden');
  });
}

let filtroAtendTexto = '';
let filtroAtendTextoOriginal = '';
let filtroAtendTipo = '';
let filtroAtendStatus = '';

function valorSeguro(v) {
  return (v === undefined || v === null || String(v).trim() === '') ? '-' : v;
}

function parseDataBR(txt) {
  const m = String(txt || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  d.setHours(0,0,0,0);
  return isNaN(d.getTime()) ? null : d;
}

function cicloDiasAtendimento(a) {
  if (a.cicloDias !== undefined && a.cicloDias !== null && String(a.cicloDias) !== '') return a.cicloDias;
  if (a.ciclo !== undefined && a.ciclo !== null && String(a.ciclo) !== '') return a.ciclo;
  const inicio = parseDataBR(a.data);
  if (!inicio) return '-';
  const fim = parseDataBR(a.finalizado || a.dataFinalizacao || a.finalizadoEm) || new Date();
  fim.setHours(0,0,0,0);
  return Math.max(0, Math.floor((fim - inicio) / 86400000));
}

function opcoesAtendimento(campo) {
  return [...new Set(atendimentosCache.map(a => String(a[campo] || '').trim()).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b, 'pt-BR'));
}

      <select id="fTipoAtend" onchange="aplicarFiltroAtend()">
        <option value="">Todos os tipos</option>

let agendaEventosCache = [];
let agendaMes = new Date().getMonth();
let agendaAno = new Date().getFullYear();
let agendaSelecionada = new Date();

function dataISOlocal(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dia=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dia}`;
}
function dataBRdeISO(iso){ if(!iso) return '-'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function escapar(v){ return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

window.RENDERIZADORES.agenda = async function(){
  const c=document.getElementById('conteudo');
  c.classList.add('modo-agenda');
  c.innerHTML='<div class="carregando-tela">Carregando agenda...</div>';
  try{
    const snap=await getDocs(collection(db,'agendaEventos'));
    agendaEventosCache=snap.docs.map(d=>({_docId:d.id,...d.data()}));
    desenharAgenda();
    verificarLembretesAgenda();
  }catch(e){ c.innerHTML='<div class="painel-box">Não foi possível carregar a agenda: '+escapar(e.message)+'</div>'; }
};

function desenharAgenda(){
  const c=document.getElementById('conteudo');
  const nomesMes=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const primeiro=new Date(agendaAno,agendaMes,1), ultimo=new Date(agendaAno,agendaMes+1,0);
  const inicio=(primeiro.getDay()+6)%7; // segunda=0
  const hojeISO=dataISOlocal(new Date()), selISO=dataISOlocal(agendaSelecionada);
  let celulas='';
  for(let i=0;i<inicio;i++) celulas+='<div class="agenda-cel vazio"></div>';
  for(let dia=1;dia<=ultimo.getDate();dia++){
    const iso=`${agendaAno}-${String(agendaMes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const evs=agendaEventosCache.filter(e=>e.data===iso).sort((a,b)=>String(a.hora||'').localeCompare(String(b.hora||'')));
    celulas+=`<div class="agenda-cel ${iso===hojeISO?'hoje':''} ${iso===selISO?'sel':''}" onclick="selecionarDiaAgenda('${iso}')"><span class="agenda-num">${dia}</span>${evs.slice(0,3).map(e=>`<span class="agenda-eventinho">${escapar(e.hora||'')} ${escapar(e.titulo||'Compromisso')}</span>`).join('')}${evs.length>3?`<span class="agenda-eventinho">+${evs.length-3} mais</span>`:''}</div>`;
  }
  const evDia=agendaEventosCache.filter(e=>e.data===selISO).sort((a,b)=>String(a.hora||'').localeCompare(String(b.hora||'')));
  const podeEditar=!somenteLeitura();
  c.innerHTML=`
    <div class="agenda-toolbar"><div><h2 style="margin:0">Agenda <span class="destaque">do Gabinete</span></h2><div style="font-size:11px;color:var(--texto-fraco);margin-top:4px">Compromissos, sessões, reuniões e lembretes</div></div>${podeEditar?'<button class="btn-primario" onclick="abrirModalAgenda()">+ Novo Compromisso</button>':''}</div>
    <div class="agenda-layout">
      <section class="agenda-cal">
        <div class="agenda-nav"><button class="btn-secundario" onclick="mudarMesAgenda(-1)">‹</button><strong>${nomesMes[agendaMes]} ${agendaAno}</strong><button class="btn-secundario" onclick="mudarMesAgenda(1)">›</button></div>
        <div class="agenda-semana"><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div><div>Dom</div></div>
        <div class="agenda-grade">${celulas}</div>
      </section>
      <aside class="agenda-dia"><h3>${dataBRdeISO(selISO)}</h3><div class="agenda-lista">${evDia.map(e=>`<div class="agenda-item" onclick='abrirModalAgenda(${JSON.stringify(e).replace(/'/g,"&#39;")})'><div class="agenda-hora">${escapar(e.hora||'Sem horário')} ${e.horaFim?'– '+escapar(e.horaFim):''}</div><div class="agenda-titulo">${escapar(e.titulo||'Compromisso')}</div><div class="agenda-meta">${escapar(e.tipo||'COMPROMISSO')}${e.local?' · '+escapar(e.local):''}</div>${e.observacoes?`<div class="agenda-meta">${escapar(e.observacoes)}</div>`:''}</div>`).join('')||'<div style="color:var(--texto-fraco);font-size:12px;padding:12px 0">Nenhum compromisso neste dia.</div>'}</div></aside>
    </div>`;
}

function selecionarDiaAgenda(iso){ const [y,m,d]=iso.split('-').map(Number); agendaSelecionada=new Date(y,m-1,d); desenharAgenda(); }
function mudarMesAgenda(delta){ agendaMes+=delta; if(agendaMes<0){agendaMes=11;agendaAno--} if(agendaMes>11){agendaMes=0;agendaAno++} agendaSelecionada=new Date(agendaAno,agendaMes,1); desenharAgenda(); }
window.selecionarDiaAgenda=selecionarDiaAgenda; window.mudarMesAgenda=mudarMesAgenda;

function abrirModalAgenda(registro={}){
  if(somenteLeitura() && registro._docId===undefined) return;
  const fundo=document.createElement('div'); fundo.className='modal-fundo'; fundo.onclick=e=>{if(e.target===fundo)fundo.remove()};
  const dataPadrao=registro.data||dataISOlocal(agendaSelecionada);
  fundo.innerHTML=`<div class="modal" onclick="event.stopPropagation()"><h2>${registro._docId?'Editar':'Novo'} Compromisso</h2>
    <div class="campo-modal"><label>Título</label><input id="ag_titulo" value="${escapar(registro.titulo)}" placeholder="Ex.: Sessão extraordinária"></div>
    <div class="grid-2"><div class="campo-modal"><label>Data</label><input id="ag_data" type="date" value="${dataPadrao}"></div><div class="campo-modal"><label>Tipo</label><select id="ag_tipo">${['SESSÃO','REUNIÃO','ATENDIMENTO','EVENTO','VIAGEM','COMPROMISSO'].map(x=>`<option ${norm(x)===norm(registro.tipo)?'selected':''}>${x}</option>`).join('')}</select></div></div>
    <div class="grid-2"><div class="campo-modal"><label>Início</label><input id="ag_hora" type="time" value="${escapar(registro.hora)}"></div><div class="campo-modal"><label>Fim</label><input id="ag_horaFim" type="time" value="${escapar(registro.horaFim)}"></div></div>
    <div class="campo-modal"><label>Local</label><input id="ag_local" value="${escapar(registro.local)}" placeholder="Ex.: Câmara Municipal"></div>
    <div class="grid-2"><div class="campo-modal"><label>Status</label><select id="ag_status">${['PLANEJADO','CONFIRMADO','REALIZADO','CANCELADO'].map(x=>`<option ${norm(x)===norm(registro.status)?'selected':''}>${x}</option>`).join('')}</select></div><div class="campo-modal"><label>Lembrete</label><select id="ag_lembrete"><option value="1" ${registro.lembrete!==false?'selected':''}>Avisar no dia anterior</option><option value="0" ${registro.lembrete===false?'selected':''}>Sem lembrete</option></select></div></div>
    <div class="campo-modal"><label>Observações</label><textarea id="ag_obs">${escapar(registro.observacoes)}</textarea></div>
    <div class="modal-acoes">${registro._docId&&!somenteLeitura()?`<button class="btn-secundario" style="color:#F26D6D" onclick="excluirAgenda('${registro._docId}')">Excluir</button>`:'<span></span>'}<div style="display:flex;gap:8px"><button class="btn-secundario" onclick="this.closest('.modal-fundo').remove()">Cancelar</button>${!somenteLeitura()?`<button class="btn-primario" id="btnSalvarAgenda" onclick="salvarAgenda('${registro._docId||''}')">Salvar</button>`:''}</div></div>
  </div>`; document.body.appendChild(fundo);
}
window.abrirModalAgenda=abrirModalAgenda;

async function salvarAgenda(docId){
  const b=document.getElementById('btnSalvarAgenda'); b.disabled=true; b.innerText='Salvando...';
  const dados={titulo:document.getElementById('ag_titulo').value.trim(),data:document.getElementById('ag_data').value,hora:document.getElementById('ag_hora').value,horaFim:document.getElementById('ag_horaFim').value,tipo:document.getElementById('ag_tipo').value,local:document.getElementById('ag_local').value.trim(),status:document.getElementById('ag_status').value,lembrete:document.getElementById('ag_lembrete').value==='1',observacoes:document.getElementById('ag_obs').value.trim(),ultimaEdicaoPor:USUARIO.nome,ultimaEdicaoData:new Date().toLocaleString('pt-BR')};
  if(!dados.titulo||!dados.data){alert('Informe pelo menos o título e a data.');b.disabled=false;b.innerText='Salvar';return}
  try{ if(docId) await updateDoc(doc(db,'agendaEventos',docId),dados); else{dados.criadoPor=USUARIO.nome;await addDoc(collection(db,'agendaEventos'),dados)} document.querySelector('.modal-fundo').remove(); await window.RENDERIZADORES.agenda(); }
  catch(e){alert('Não foi possível salvar: '+e.message);b.disabled=false;b.innerText='Salvar'}
}
async function excluirAgenda(id){ if(!confirm('Excluir este compromisso?'))return; try{await deleteDoc(doc(db,'agendaEventos',id));document.querySelector('.modal-fundo').remove();await window.RENDERIZADORES.agenda()}catch(e){alert('Não foi possível excluir: '+e.message)} }
window.salvarAgenda=salvarAgenda; window.excluirAgenda=excluirAgenda;

function verificarLembretesAgenda(){
  const amanha=new Date(); amanha.setDate(amanha.getDate()+1); const iso=dataISOlocal(amanha);
  const evs=agendaEventosCache.filter(e=>e.data===iso && e.lembrete!==false && norm(e.status)!=='CANCELADO');
  if(!evs.length) return;
  const chave='agendaAviso-'+iso; if(sessionStorage.getItem(chave)) return; sessionStorage.setItem(chave,'1');
  const texto=evs.length===1?`Amanhã: ${evs[0].hora?evs[0].hora+' · ':''}${evs[0].titulo}`:`Você tem ${evs.length} compromissos amanhã.`;
  if('Notification' in window && Notification.permission==='granted') new Notification('Agenda do Gabinete',{body:texto,icon:'./icon-192.png'});
}

</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(err => console.error('Erro ao registrar Service Worker:', err));
  });
}
</script>
