<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gabinete Digital — Vereador Murillo Godoy</title>
<link rel="apple-touch-icon" sizes="180x180" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gabinete Digital">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Gabinete Digital">
<meta name="theme-color" content="#0A1728">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo:#070E19; --superficie:#0A1728; --superficie-sutil:#0D1D33;
    --borda:#1C2C41; --texto:#F5F8FC; --texto-suave:#B8C4D4; --texto-fraco:#7C8BA0;
    --acento:#E5272D; --verde:#22C55E; --azul:#2563EB; --amarelo:#F2B23A; --roxo:#A855F7;
    --raio-s:8px; --raio-m:12px; --raio-l:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',Arial,sans-serif;background:var(--fundo);color:var(--texto);-webkit-font-smoothing:antialiased;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ===== SPLASH (abertura) ===== */
  #telaSplash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#101F35,#070E19 60%);gap:18px;text-align:center;padding:20px;}
  .splash-caixa{width:170px;height:170px;border-radius:var(--raio-l);background:var(--superficie);border:1px solid var(--borda);display:flex;align-items:center;justify-content:center;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .splash-caixa img{width:100%;object-fit:contain;border-radius:8px;}
  .splash-titulo{font-size:22px;font-weight:900;letter-spacing:.3px;}
  .splash-titulo span{color:var(--acento);}
  .splash-sub{font-size:11.5px;color:var(--texto-fraco);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-top:-8px;}
  .splash-spin{width:30px;height:30px;border-radius:50%;border:3px solid #1C2C41;border-top-color:var(--acento);animation:girar 0.8s linear infinite;margin-top:6px;}
  @keyframes girar{to{transform:rotate(360deg);}}
  #pularSplash{color:#5C86D8;font-size:12.5px;text-decoration:underline;background:none;border:none;margin-top:4px;}

  /* ===== LOGIN ===== */
  #telaLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#101F35,#070E19 60%);padding:20px;}
  .card-login{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-l);padding:40px 32px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,.5);}
  .card-login img{width:100%;max-width:220px;display:block;margin:0 auto 16px;border-radius:8px;}
  .card-login h1{text-align:center;font-size:15px;letter-spacing:.5px;color:var(--texto-suave);margin:0 0 28px;text-transform:uppercase;font-weight:700;}
  .card-login h1 span{color:var(--acento);}
  .campo-login{margin-bottom:14px;}
  .campo-login input{width:100%;padding:13px 14px;border-radius:var(--raio-s);border:1px solid var(--borda);background:var(--superficie-sutil);color:var(--texto);font-size:14px;outline:none;}
  .campo-login input:focus{border-color:var(--acento);}
  #btnEntrar{width:100%;padding:14px;border:none;border-radius:var(--raio-s);background:var(--acento);color:#fff;font-weight:800;font-size:14.5px;margin-top:6px;transition:filter .15s;}
  #btnEntrar:hover{filter:brightness(1.1);}
  #btnEntrar:disabled{opacity:.6;cursor:default;}
  #erroLogin{color:#FF7479;font-size:12.5px;margin-top:12px;text-align:center;min-height:16px;}

  /* ===== APP ===== */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  header.topo-app{background:var(--superficie);border-bottom:1px solid var(--borda);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .logo-topo img{height:42px;width:auto;max-width:170px;object-fit:contain;border-radius:6px;}
  .saudacao-bloco h2{margin:0;font-size:19px;font-weight:800;}
  .saudacao-bloco .sub{font-size:11px;color:var(--texto-fraco);text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
  .topo-direita{display:flex;align-items:center;gap:14px;margin-left:auto;}
  .perfil-topo{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--borda);}
  .avatar-topo{width:36px;height:36px;border-radius:50%;background:var(--superficie-sutil);border:1px solid var(--borda);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;}
  .perfil-texto b{display:block;font-size:12.5px;}
  .perfil-texto span{font-size:10.5px;color:var(--texto-fraco);}
  #btnSair{background:none;border:1px solid #4A2430;color:#F26D6D;border-radius:var(--raio-s);padding:8px 14px;font-weight:700;font-size:12.5px;}
  #btnSair:hover{background:#2A1218;}

  nav.menu-nav-topo{display:flex;gap:4px;padding:0 24px;background:var(--superficie);border-bottom:1px solid var(--borda);overflow-x:auto;}
  nav.menu-nav-topo button{background:none;border:none;color:var(--texto-suave);padding:13px 16px;font-size:13.5px;font-weight:700;white-space:nowrap;border-bottom:3px solid transparent;}
  nav.menu-nav-topo button.ativo{color:#fff;border-bottom-color:var(--acento);}
  nav.menu-nav-topo button:hover{color:#fff;}

  main{flex:1;padding:22px 24px 60px;max-width:1400px;width:100%;margin:0 auto;}

  .topo-pagina{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .topo-pagina h2{margin:0;font-size:21px;font-weight:800;}
  .topo-pagina h2 .destaque{color:var(--acento);}
  .btn-primario{background:var(--acento);color:#fff;border:none;border-radius:var(--raio-s);padding:11px 18px;font-weight:800;font-size:13px;}
  .btn-primario:hover{filter:brightness(1.1);}
  .btn-secundario{background:var(--superficie-sutil);color:var(--texto);border:1px solid var(--borda);border-radius:var(--raio-s);padding:9px 14px;font-weight:700;font-size:12.5px;}
  .btn-secundario:hover{background:#132238;}

  .kpis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px;}
  .kpi-card{background:var(--superficie);border:1px solid var(--borda);border-left:4px solid var(--acento);border-radius:var(--raio-s);padding:18px 20px;}
  .kpi-card .num{font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1;color:#fff;}
  .kpi-card .rot{font-size:10.5px;color:var(--acento);text-transform:uppercase;letter-spacing:.4px;font-weight:800;margin-top:6px;}

  .grafico-box,.painel-box{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-m);padding:20px;}
  .grafico-box h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--texto-suave);}

  .carregando-tela{text-align:center;padding:60px 20px;color:var(--texto-fraco);}

  /* ===== Tabela ===== */
  .tabela-box{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-m);overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  thead th{text-align:left;padding:12px 14px;color:var(--acento);text-transform:uppercase;font-size:10.5px;letter-spacing:.4px;font-weight:800;border-bottom:1px solid var(--borda);background:rgba(229,39,45,.06);white-space:nowrap;}
  tbody td{padding:11px 14px;border-bottom:1px solid rgba(132,158,190,.08);vertical-align:middle;}
  tbody tr:hover{background:rgba(255,255,255,.02);}
  .barra-acoes{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .barra-acoes input,.barra-acoes select{padding:10px 12px;border-radius:var(--raio-s);border:1px solid var(--borda);background:var(--superficie-sutil);color:var(--texto);font-size:13px;}
  .barra-acoes input{flex:1;min-width:180px;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge-verde{background:rgba(34,197,94,.15);color:#4ADE80;}
  .badge-amarelo{background:rgba(242,178,58,.15);color:#F2B23A;}
  .badge-vermelho{background:rgba(229,39,45,.15);color:#F26D6D;}
  .badge-cinza{background:rgba(124,139,160,.15);color:#9CAAC0;}

  /* ===== Modal ===== */
  .modal-fundo{position:fixed;inset:0;background:rgba(3,7,14,.72);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;}
  .modal{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-l);padding:26px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}
  .modal h2{margin:0 0 18px;font-size:18px;}
  .campo-modal{margin-bottom:14px;}
  .campo-modal label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--texto-fraco);font-weight:700;margin-bottom:6px;}
  .campo-modal input,.campo-modal select,.campo-modal textarea{width:100%;padding:10px 12px;border-radius:var(--raio-s);border:1px solid var(--borda);background:var(--superficie-sutil);color:var(--texto);font-size:13.5px;box-sizing:border-box;}
  .campo-modal textarea{resize:vertical;min-height:70px;font-family:inherit;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-acoes{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;}

  @media(max-width:640px){
    header.topo-app{padding:12px 16px;}
    .saudacao-bloco h2{font-size:16px;}
    .saudacao-bloco .sub{display:none;}
    main{padding:16px;}
    nav.menu-nav-topo{padding:0 8px;}
  }
</style>
</head>
<body>

<div id="telaSplash">
  <div class="splash-caixa"><img src="./icon-512.png" alt="Gabinete Digital" onerror="this.style.display='none'"></div>
  <div class="splash-titulo">GABINETE <span>DIGITAL</span></div>
  <div class="splash-sub">Vereador Murillo Godoy</div>
  <div class="splash-spin"></div>
  <button id="pularSplash">Não abriu? Toque aqui</button>
</div>

<div id="telaLogin" class="hidden">
  <div class="card-login">
    <img src="./icon-512.png" alt="Gabinete Digital" onerror="this.style.display='none'">
    <h1>GABINETE <span>DIGITAL</span></h1>
    <div class="campo-login"><input id="inputEmail" type="email" placeholder="E-mail" autocomplete="username"></div>
    <div class="campo-login"><input id="inputSenha" type="password" placeholder="Senha" autocomplete="current-password"></div>
    <button id="btnEntrar">Entrar</button>
    <div id="erroLogin"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="topo-app">
    <div class="logo-topo"><img src="./icon-512.png" alt="Logo" onerror="this.style.display='none'"></div>
    <div class="saudacao-bloco">
      <h2 id="saudacaoTopo">Olá!</h2>
      <div class="sub">Painel Geral de Gestão • Gabinete Digital</div>
    </div>
    <div class="topo-direita">
      <div class="perfil-topo">
        <div class="avatar-topo" id="avatarTopo">-</div>
        <div class="perfil-texto"><b id="nomeTopo">-</b><span id="cargoTopo">-</span></div>
      </div>
      <button id="btnSair">Sair</button>
    </div>
  </header>
  <nav class="menu-nav-topo" id="menuNav"></nav>
  <main id="conteudo"><div class="carregando-tela">Carregando...</div></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc,
  onSnapshot, collection, query, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ---- Config real do projeto Gabinete-Murillo Godoy ----
const firebaseConfig = {
  apiKey: "AIzaSyD23LG4NhHDRfiHeXCSumKyTiXRV_yk5bc",
  authDomain: "gabinete-murillo-godoy.firebaseapp.com",
  projectId: "gabinete-murillo-godoy",
  storageBucket: "gabinete-murillo-godoy.firebasestorage.app",
  messagingSenderId: "1039162247732",
  appId: "1:1039162247732:web:900c8f90cd7b210930d861"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Expõe pro resto do código (módulos futuros usam window.db, window.auth)
window.__db = db;
window.__auth = auth;

let USUARIO = null;
let UID = null;
let paginaAtual = 'dashboard';
let pararDeOuvirPerfil = null;

const telaSplash = document.getElementById('telaSplash');
const telaLogin = document.getElementById('telaLogin');
const appEl = document.getElementById('app');

function esconderSplash() {
  if (telaSplash.classList.contains('hidden')) return;
  telaSplash.classList.add('hidden');
  telaLogin.classList.remove('hidden');
}
document.getElementById('pularSplash').onclick = esconderSplash;
setTimeout(esconderSplash, 1200);
const inputEmail = document.getElementById('inputEmail');
const inputSenha = document.getElementById('inputSenha');
const btnEntrar = document.getElementById('btnEntrar');
const erroLogin = document.getElementById('erroLogin');
const btnSair = document.getElementById('btnSair');

function mapaErroFirebase(codigo) {
  const mapa = {
    'auth/invalid-email': 'E-mail inválido.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/wrong-password': 'E-mail ou senha incorretos.',
    'auth/user-not-found': 'E-mail ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas. Espera um pouco e tenta de novo.',
    'auth/network-request-failed': 'Falha de conexão. Verifica sua internet.'
  };
  return mapa[codigo] || 'Não foi possível entrar. Tente novamente.';
}

async function fazerLogin() {
  const email = inputEmail.value.trim();
  const senha = inputSenha.value;
  if (!email || !senha) { erroLogin.innerText = 'Preenche e-mail e senha.'; return; }
  btnEntrar.disabled = true; btnEntrar.innerText = 'Entrando...'; erroLogin.innerText = '';
  try {
    await signInWithEmailAndPassword(auth, email, senha);
    // onAuthStateChanged cuida do resto (carregar perfil e abrir o app)
  } catch (e) {
    erroLogin.innerText = mapaErroFirebase(e.code);
    btnEntrar.disabled = false; btnEntrar.innerText = 'Entrar';
  }
}

btnEntrar.onclick = fazerLogin;
inputSenha.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
inputEmail.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });

btnSair.onclick = async () => {
  if (pararDeOuvirPerfil) pararDeOuvirPerfil();
  await signOut(auth);
};

function iniciaisNome(nome) {
  if (!nome) return '?';
  const p = nome.trim().split(' ');
  return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
}

function rotuloCargo(cargo) {
  const mapa = { ADMIN: 'Administrador', ASSESSOR: 'Assessor', ASSESSORA: 'Assessora', VEREADOR: 'Vereador' };
  return mapa[cargo] || cargo || '-';
}

function somenteLeitura() {
  return USUARIO && USUARIO.cargo === 'VEREADOR';
}
window.somenteLeitura = somenteLeitura;
window.getUsuario = () => USUARIO;
window.getUid = () => UID;

const MODULOS = [
  { id: 'dashboard', label: '🏠 Dashboard', admin: false },
  { id: 'atendimentos', label: '👥 Atendimentos', admin: false },
  { id: 'transportes', label: '🚐 Transportes', admin: false },
  { id: 'equipamentos', label: '🏆 Equipamentos', admin: false },
  { id: 'pessoas', label: '📇 Pessoas', admin: false },
  { id: 'agenda', label: '📅 Agenda', admin: false },
  { id: 'relatorios', label: '📊 Relatórios', admin: false },
  { id: 'usuarios', label: '🔑 Usuários', admin: true },
  { id: 'configuracoes', label: '⚙️ Configurações', admin: true }
];

function montarMenu() {
  const nav = document.getElementById('menuNav');
  const ehAdmin = USUARIO && USUARIO.cargo === 'ADMIN';
  nav.innerHTML = MODULOS
    .filter(m => !m.admin || ehAdmin)
    .map(m => `<button data-mod="${m.id}" class="${paginaAtual === m.id ? 'ativo' : ''}">${m.label}</button>`)
    .join('');
  nav.querySelectorAll('button').forEach(b => {
    b.onclick = () => irPara(b.dataset.mod);
  });
}

function irPara(pagina) {
  paginaAtual = pagina;
  montarMenu();
  const conteudo = document.getElementById('conteudo');
  conteudo.innerHTML = '<div class="carregando-tela">Carregando...</div>';
  const renderFn = window.RENDERIZADORES && window.RENDERIZADORES[pagina];
  if (renderFn) {
    renderFn();
  } else {
    conteudo.innerHTML = `<div class="topo-pagina"><h2>${pagina}</h2></div><div class="painel-box">Módulo em construção.</div>`;
  }
}
window.irPara = irPara;

function saudacaoHora() {
  const h = new Date().getHours();
  if (h < 12) return 'Bom dia';
  if (h < 18) return 'Boa tarde';
  return 'Boa noite';
}

function abrirApp() {
  telaSplash.classList.add('hidden');
  telaLogin.classList.add('hidden');
  appEl.classList.remove('hidden');
  document.getElementById('saudacaoTopo').innerText = `${saudacaoHora()}, ${USUARIO.nome.split(' ')[0]}! 👋`;
  document.getElementById('nomeTopo').innerText = USUARIO.nome;
  document.getElementById('cargoTopo').innerText = rotuloCargo(USUARIO.cargo);
  document.getElementById('avatarTopo').innerText = iniciaisNome(USUARIO.nome);
  montarMenu();
  irPara('dashboard');
}

function fecharApp() {
  esconderSplash();
  appEl.classList.add('hidden');
  telaLogin.classList.remove('hidden');
  inputEmail.value = ''; inputSenha.value = ''; erroLogin.innerText = '';
  btnEntrar.disabled = false; btnEntrar.innerText = 'Entrar';
  USUARIO = null; UID = null;
}

// Observa login/logout
onAuthStateChanged(auth, async (user) => {
  if (pararDeOuvirPerfil) { pararDeOuvirPerfil(); pararDeOuvirPerfil = null; }

  if (!user) {
    fecharApp();
    return;
  }

  UID = user.uid;
  const refPerfil = doc(db, 'usuarios', user.uid);

  // Ouve o perfil em tempo real: se alguém desativar esse usuário
  // (ativo:false), ele é deslogado na hora, sem precisar recarregar.
  pararDeOuvirPerfil = onSnapshot(refPerfil, (snap) => {
    if (!snap.exists()) {
      erroLogin.innerText = 'Seu usuário não tem perfil cadastrado no sistema. Fala com o administrador.';
      signOut(auth);
      return;
    }
    const dados = snap.data();
    if (dados.ativo !== true) {
      if (!appEl.classList.contains('hidden')) {
        alert('Seu acesso foi desativado. Fala com o administrador.');
      }
      signOut(auth);
      return;
    }
    USUARIO = { ...dados, uid: user.uid };
    if (appEl.classList.contains('hidden')) {
      abrirApp();
    } else {
      // perfil mudou (ex: cargo) enquanto já estava logado — atualiza topo e menu
      document.getElementById('nomeTopo').innerText = USUARIO.nome;
      document.getElementById('cargoTopo').innerText = rotuloCargo(USUARIO.cargo);
      montarMenu();
    }
  }, (erro) => {
    console.error('Erro ao ouvir perfil:', erro);
    erroLogin.innerText = 'Erro ao carregar seu perfil. Tente novamente.';
  });
});

// ---------------- DASHBOARD (provisório — outros módulos entram depois) ----------------
window.RENDERIZADORES = window.RENDERIZADORES || {};
window.RENDERIZADORES.dashboard = async function () {
  const c = document.getElementById('conteudo');
  c.innerHTML = '<div class="carregando-tela">Carregando...</div>';

  const [atendSnap, transpSnap, equipSnap, pessoasSnap] = await Promise.all([
    getDocs(collection(db, 'atendimentos')),
    getDocs(collection(db, 'transportes')),
    getDocs(collection(db, 'equipamentos')),
    getDocs(collection(db, 'pessoas'))
  ]);

  const atend = atendSnap.docs.map(d => d.data());
  const transp = transpSnap.docs.map(d => d.data());
  const equip = equipSnap.docs.map(d => d.data());
  const totalPessoas = pessoasSnap.size;

  const norm = s => (s || '').toString().trim().toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  const equipEmUso = equip.filter(e => norm(e.devolucao) === 'USANDO').length;

  c.innerHTML = `
    <div class="topo-pagina"><h2>Visão <span class="destaque">Geral</span></h2></div>
    <div class="kpis-grid">
      <div class="kpi-card"><div class="num">${atend.length}</div><div class="rot">Atendimentos</div></div>
      <div class="kpi-card"><div class="num">${transp.length}</div><div class="rot">Transportes</div></div>
      <div class="kpi-card"><div class="num">${equipEmUso}</div><div class="rot">Equipamentos em uso</div></div>
      <div class="kpi-card"><div class="num">${totalPessoas}</div><div class="rot">Pessoas cadastradas</div></div>
    </div>
    <div class="painel-box">
      <h3 style="margin-top:0;">🎂 Aniversariantes</h3>
      <p style="color:var(--texto-fraco);font-size:13px;">Módulo Pessoas ainda não conectado — chega no próximo passo.</p>
    </div>
  `;
};

// ---------------- ATENDIMENTOS ----------------
const norm = s => (s || '').toString().trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function badgeStatus(status) {
  const s = norm(status);
  let classe = 'badge-cinza';
  if (s === 'CONCLUIDO' || s === 'SIM' || s === 'ENTREGUE') classe = 'badge-verde';
  else if (s === 'EM ANALISE') classe = 'badge-amarelo';
  else if (s === 'CANCELADO' || s === 'NAO') classe = 'badge-vermelho';
  return `<span class="badge ${classe}">${status || '-'}</span>`;
}
window.badgeStatus = badgeStatus;

let atendimentosCache = [];

window.RENDERIZADORES.atendimentos = async function () {
  const c = document.getElementById('conteudo');
  c.innerHTML = '<div class="carregando-tela">Carregando...</div>';
  const snap = await getDocs(collection(db, 'atendimentos'));
  atendimentosCache = snap.docs.map(d => ({ _docId: d.id, ...d.data() }));
  desenharAtendimentos();
};

let filtroAtendTexto = '';
let filtroAtendTextoOriginal = '';

function aplicarFiltroAtend() {
  filtroAtendTextoOriginal = document.getElementById('fTextoAtend').value;
  filtroAtendTexto = norm(filtroAtendTextoOriginal);
  desenharAtendimentos();
}
window.aplicarFiltroAtend = aplicarFiltroAtend;

function desenharAtendimentos() {
  const c = document.getElementById('conteudo');
  const lista = atendimentosCache.filter(a =>
    !filtroAtendTexto ||
    norm(a.nome).includes(filtroAtendTexto) ||
    norm(a.bairro).includes(filtroAtendTexto) ||
    norm(a.telefone).includes(filtroAtendTexto)
  );
  const podeEditar = !somenteLeitura();

  c.innerHTML = `
    <div class="topo-pagina">
      <h2>Controle de <span class="destaque">Atendimentos</span></h2>
      ${podeEditar ? '<button class="btn-primario" onclick="abrirModalAtendimento()">+ Novo Atendimento</button>' : ''}
    </div>
    <div class="barra-acoes">
      <input id="fTextoAtend" placeholder="Buscar por nome, bairro ou telefone..." oninput="aplicarFiltroAtend()" value="${filtroAtendTextoOriginal.replace(/"/g,'&quot;')}">
    </div>
    <div class="tabela-box">
      <table>
        <thead><tr>
          <th>Data</th><th>Nome</th><th>Telefone</th><th>Bairro</th><th>Tipo</th><th>Status</th><th>Responsável</th>${podeEditar ? '<th></th>' : ''}
        </tr></thead>
        <tbody>
          ${lista.map(a => `
            <tr>
              <td>${a.data || '-'}</td>
              <td>${a.nome || '-'}</td>
              <td>${a.telefone || '-'}</td>
              <td>${a.bairro || '-'}</td>
              <td>${a.tipoAtendimento || '-'}</td>
              <td>${badgeStatus(a.status)}</td>
              <td>${a.responsavel || '-'}</td>
              ${podeEditar ? `<td style="display:flex;gap:6px;"><button class="btn-secundario" onclick='abrirModalAtendimento(${JSON.stringify(a).replace(/'/g, "&#39;")})'>Editar</button><button class="btn-secundario" style="color:#F26D6D;border-color:#4A2430;" onclick="excluirAtendimento('${a._docId}')">Excluir</button></td>` : ''}
            </tr>
          `).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--texto-fraco);padding:24px;">${filtroAtendTexto ? 'Nenhum resultado.' : 'Nenhum atendimento cadastrado ainda.'}</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

const TIPOS_ATENDIMENTO = ['CESTA BASICA','CONSULTA MED','DOACOES','EMENDA IMPOSITIVA','EMPREGO','EQUIPAMENTOS','ESCOLA','EXAME MED','OUTROS','PATROCINIO','REMEDIO','TRANSPORTE','CIRURGIA','TROCA DE LAMPADAS'];
const STATUS_ATENDIMENTO = ['EM ANALISE','CONCLUIDO','CANCELADO'];

function abrirModalAtendimento(registro) {
  registro = registro || {};
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  fundo.onclick = (ev) => { if (ev.target === fundo) fundo.remove(); };
  fundo.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <h2>${registro._docId ? 'Editar' : 'Novo'} Atendimento</h2>
      <div class="grid-2">
        <div class="campo-modal"><label>Nome</label><input id="m_nome" value="${(registro.nome||'').replace(/"/g,'&quot;')}"></div>
        <div class="campo-modal"><label>Telefone</label><input id="m_telefone" value="${(registro.telefone||'').replace(/"/g,'&quot;')}"></div>
      </div>
      <div class="campo-modal"><label>Endereço</label><input id="m_endereco" value="${(registro.endereco||'').replace(/"/g,'&quot;')}"></div>
      <div class="grid-2">
        <div class="campo-modal"><label>Bairro</label><input id="m_bairro" value="${(registro.bairro||'').replace(/"/g,'&quot;')}"></div>
        <div class="campo-modal"><label>Data</label><input id="m_data" placeholder="dd/mm/aaaa" value="${(registro.data||'').replace(/"/g,'&quot;')}"></div>
      </div>
      <div class="grid-2">
        <div class="campo-modal"><label>Tipo de Atendimento</label>
          <select id="m_tipo">${TIPOS_ATENDIMENTO.map(t => `<option ${norm(t)===norm(registro.tipoAtendimento)?'selected':''}>${t}</option>`).join('')}</select>
        </div>
        <div class="campo-modal"><label>Status</label>
          <select id="m_status">${STATUS_ATENDIMENTO.map(s => `<option ${norm(s)===norm(registro.status)?'selected':''}>${s}</option>`).join('')}</select>
        </div>
      </div>
      <div class="grid-2">
        <div class="campo-modal"><label>Responsável</label><input id="m_responsavel" value="${(registro.responsavel||'').replace(/"/g,'&quot;')}"></div>
        <div class="campo-modal"><label>Indicador</label><input id="m_indicador" value="${(registro.indicador||'').replace(/"/g,'&quot;')}"></div>
      </div>
      <div class="campo-modal"><label>Observações</label><textarea id="m_obs">${registro.observacoes||''}</textarea></div>
      <div class="modal-acoes">
        <button class="btn-secundario" onclick="this.closest('.modal-fundo').remove()">Cancelar</button>
        <button class="btn-primario" id="btnSalvarAtend" onclick="salvarAtendimento('${registro._docId||''}')">Salvar</button>
      </div>
    </div>`;
  document.body.appendChild(fundo);
}
window.abrirModalAtendimento = abrirModalAtendimento;

async function salvarAtendimento(docId) {
  const botao = document.getElementById('btnSalvarAtend');
  if (botao.disabled) return;
  botao.disabled = true; botao.innerText = 'Salvando...';

  const dados = {
    nome: document.getElementById('m_nome').value.trim(),
    telefone: document.getElementById('m_telefone').value.trim(),
    endereco: document.getElementById('m_endereco').value.trim(),
    bairro: document.getElementById('m_bairro').value.trim(),
    data: document.getElementById('m_data').value.trim(),
    tipoAtendimento: document.getElementById('m_tipo').value,
    status: document.getElementById('m_status').value,
    responsavel: document.getElementById('m_responsavel').value.trim(),
    indicador: document.getElementById('m_indicador').value.trim(),
    observacoes: document.getElementById('m_obs').value.trim(),
    ultimaEdicaoPor: USUARIO.nome,
    ultimaEdicaoData: new Date().toLocaleString('pt-BR')
  };

  try {
    if (docId) {
      await updateDoc(doc(db, 'atendimentos', docId), dados);
    } else {
      dados.criadoPor = USUARIO.nome;
      await addDoc(collection(db, 'atendimentos'), dados);
    }
    document.querySelector('.modal-fundo').remove();
    window.RENDERIZADORES.atendimentos();
  } catch (e) {
    alert('Não foi possível salvar: ' + e.message);
    botao.disabled = false; botao.innerText = 'Salvar';
  }
}
window.salvarAtendimento = salvarAtendimento;

async function excluirAtendimento(docId) {
  if (!confirm('Excluir este atendimento? Não tem como desfazer.')) return;
  try {
    await deleteDoc(doc(db, 'atendimentos', docId));
    window.RENDERIZADORES.atendimentos();
  } catch (e) {
    alert('Não foi possível excluir: ' + e.message);
  }
}
window.excluirAtendimento = excluirAtendimento;
</script>
</body>
</html>
