// ============================================================
// USUÁRIOS (só ADMIN) — bloquear/desbloquear, trocar cargo
// IMPORTANTE: criar um LOGIN novo (e-mail/senha) tem que ser feito no
// Firebase Console > Authentication > Add user, porque criar pelo app
// derrubaria a sua própria sessão de admin (limitação do Firebase, não
// do sistema). Depois de criar o login lá, você cria o PERFIL aqui,
// colando o UID que o Console mostrou.
// ============================================================
let usuariosCache = [];

async function renderUsuarios(){
  if(USUARIO.cargo !== 'ADMIN'){
    document.getElementById('conteudo').innerHTML = '<div class="topo-pagina"><div><h2>Acesso restrito</h2></div></div><p style="color:#9FB3A6;">Esta área é exclusiva do administrador.</p>';
    return;
  }
  const c = document.getElementById('conteudo');
  c.innerHTML = '<div class="topo-pagina"><div><h2>Controle de <span class="destaque">Usuários</span></h2><div class="barra-assinatura"></div></div></div><p style="color:#9FB3A6;">Carregando...</p>';
  const snap = await getDocs(collection(db,'usuarios'));
  usuariosCache = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  desenharUsuarios();
}

function desenharUsuarios(){
  const c = document.getElementById('conteudo');
  c.innerHTML = `
    <div class="topo-pagina">
      <div><h2>Controle de <span class="destaque">Usuários</span></h2><div class="barra-assinatura"></div></div>
      <button class="btn-primario" onclick="window.abrirModalUsuario()">+ Novo Perfil</button>
    </div>
    <div class="aviso-perfil">
      Pra criar um LOGIN novo (e-mail/senha), use o Firebase Console → Authentication → Add user.
      Depois clique em "+ Novo Perfil" aqui e cole o UID que o Console mostrou. "+ Novo Perfil"
      sozinho não cria acesso — só define nome, cargo e se está ativo.
    </div>
    <div class="tabela-box">
      <table>
        <thead><tr><th>Nome</th><th>E-mail</th><th>Cargo</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${usuariosCache.map(u=>`
            <tr>
              <td>${u.nome||''}</td><td>${u.email||''}</td><td>${rotuloCargo(normalizarTexto(u.cargo))}</td>
              <td>${u.ativo===false ? '<span class="badge CANCELADO">BLOQUEADO</span>' : '<span class="badge CONCLUIDO">ATIVO</span>'}</td>
              <td><div class="grupo-acoes-tabela"><button class="btn-secundario" onclick='window.abrirModalUsuario(${JSON.stringify(u)})'>Editar</button>${u.id===USUARIO.uid ? '' : `<button class="btn-perigo" onclick="window.excluirUsuario('${u.id}')">Excluir</button>`}</div></td>
            </tr>`).join('') || `<tr><td colspan="5" style="text-align:center;color:#5E7368;padding:20px;">Nenhum perfil cadastrado.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

window.abrirModalUsuario = function(registro){
  registro = registro || {};
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  fundo.onclick = (ev)=>{ if(ev.target===fundo) fundo.remove(); };
  fundo.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <h3>${registro.id ? 'Editar' : 'Novo'} Perfil de Usuário</h3>
      ${!registro.id ? `<div class="aviso-perfil">Cole aqui o UID que o Firebase Console mostrou ao criar o login. Sem isso, o perfil não fica ligado a nenhum acesso real.</div>` : ''}
      <div class="modal-grid">
        ${!registro.id ? `<div class="campo-2"><label>UID (do Firebase Authentication)</label><input id="u_uid" placeholder="Cole o UID aqui"></div>` : ''}
        <div><label>Nome</label><input id="u_nome" value="${registro.nome||''}"></div>
        <div><label>E-mail</label><input id="u_email" value="${registro.email||''}" ${registro.id?'disabled':''}></div>
        <div>
          <label>Cargo</label>
          <select id="u_cargo">
            <option value="ADMIN" ${registro.cargo==='ADMIN'?'selected':''}>Administrador</option>
            <option value="ASSESSOR" ${registro.cargo==='ASSESSOR'?'selected':''}>Assessor</option>
            <option value="ASSESSORA" ${registro.cargo==='ASSESSORA'?'selected':''}>Assessora</option>
            <option value="VEREADOR" ${registro.cargo==='VEREADOR'?'selected':''}>Vereador (somente leitura)</option>
          </select>
        </div>
        <div>
          <label>Status de acesso</label>
          <select id="u_ativo">
            <option value="true" ${registro.ativo!==false?'selected':''}>Ativo (libera entrada)</option>
            <option value="false" ${registro.ativo===false?'selected':''}>Bloqueado (derruba na hora)</option>
          </select>
        </div>
      </div>
      <div class="modal-acoes">
        <button class="btn-secundario" onclick="this.closest('.modal-fundo').remove()">Cancelar</button>
        <button class="btn-primario" onclick="window.salvarUsuario('${registro.id||''}')">Salvar</button>
      </div>
    </div>`;
  document.body.appendChild(fundo);
};

window.excluirUsuario = async function(id){
  if(id === USUARIO.uid){ mostrarToast('Você não pode excluir o seu próprio perfil.', 'aviso'); return; }
  if(!(await confirmarAcao('Excluir este perfil? A pessoa perde acesso ao sistema na hora. (O login dela continua existindo no Firebase Authentication — se quiser apagar de vez, remova também por lá.)', 'Excluir'))) return;
  try{
    await deleteDoc(doc(db,'usuarios',id));
    renderUsuarios();
  }catch(erro){
    mostrarToast('Não foi possível excluir. ('+erro.message+')', 'erro');
  }
};

window.salvarUsuario = async function(id){
  const dados = {
    nome: document.getElementById('u_nome').value.trim(),
    email: document.getElementById('u_email').value.trim(),
    cargo: document.getElementById('u_cargo').value,
    ativo: document.getElementById('u_ativo').value === 'true'
  };
  let uidFinal = id;
  if(!id){
    uidFinal = document.getElementById('u_uid').value.trim();
    if(!uidFinal){ mostrarToast('Cole o UID do Firebase Authentication antes de salvar.', 'aviso'); return; }
  }
  if(!dados.nome){ mostrarToast('Preencha o nome.', 'aviso'); return; }
  try{
    await setDoc(doc(db,'usuarios',uidFinal), dados, { merge:true });
    document.querySelector('.modal-fundo').remove();
    mostrarToast('Perfil salvo com sucesso!', 'sucesso');
    renderUsuarios();
  }catch(erro){
    mostrarToast('Não foi possível salvar. Só ADMIN pode editar perfis. ('+erro.message+')', 'erro');
  }
};

window.fazerLogin = fazerLogin;
window.fazerLogout = fazerLogout;

// Registra o service worker (necessário pro "Adicionar à tela inicial" aparecer)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
