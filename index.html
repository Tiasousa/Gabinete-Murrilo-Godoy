<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gabinete Digital — Tatiquinho</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E3B2A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tatiquinho">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  /* ============================================================
     TOKENS DE MARCA — TATIQUINHO
     Verde-escuro + preto + verde-limão (degradê), extraídos do logo.
     Headline: Barlow Condensed (poster de campanha). Corpo: Inter.
     Assinatura visual: barra em degradê verde→limão sob os títulos,
     repetindo o traço que já existe na marca.
     ============================================================ */
  :root{
    --preto:#060907;
    --preto-suave:#0B120E;
    --verde:#0E3B2A;
    --verde-escuro:#082A1D;
    --verde-vivo:#16A34A;
    --limao:#A8D948;
    --limao-2:#6FBF3E;
    --superficie:#0E1712;
    --superficie-2:#121C16;
    --borda:#1E2C23;
    --texto:#F5F7F4;
    --texto-suave:#9FB3A6;
    --texto-fraco:#5E7368;
    --alerta:#E5484D;
    --aviso:#E8AE00;
    --raio-s:10px;
    --raio-m:14px;
    --raio-l:20px;
    --degrade-assinatura: linear-gradient(90deg, var(--verde) 0%, var(--verde-vivo) 45%, var(--limao) 100%);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--preto);color:var(--texto);font-family:'Inter',sans-serif;overflow-x:hidden;}
  h1,h2,h3,.font-display{font-family:'Barlow Condensed',sans-serif;letter-spacing:.3px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .hidden{display:none !important;}
  img{max-width:100%;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#233529;border-radius:8px;}
  @keyframes entra{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .barra-assinatura{height:4px;border-radius:4px;background:var(--degrade-assinatura);}

  /* ---------- LOGIN ---------- */
  #telaLogin{height:100vh;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(circle at 50% 0%, rgba(168,217,72,.10), transparent 45%), var(--preto);perspective:1200px;}
  .card-login{
    position:relative;
    background:linear-gradient(160deg, rgba(22,36,27,.96), rgba(6,9,7,.98));
    border:1px solid rgba(168,217,72,.14);
    padding:44px 38px;border-radius:var(--raio-l);width:380px;max-width:92vw;
    box-shadow:
      0 2px 4px rgba(0,0,0,.35),
      0 14px 28px rgba(0,0,0,.4),
      0 50px 100px rgba(0,0,0,.6),
      inset 0 1px 0 rgba(255,255,255,.07);
    animation:entra .35s ease both;
    transform-style:preserve-3d;
    transition:transform .18s ease-out, box-shadow .18s ease-out;
    will-change:transform;
  }
  .card-login::before{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.07), transparent 45%);
  }
  .card-login::after{
    content:'';position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;z-index:-1;
    background:linear-gradient(135deg, rgba(168,217,72,.55), transparent 32%, transparent 68%, rgba(111,191,62,.5));
    padding:1px;
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
  }
  .card-login.tilt-ativo{box-shadow:
      0 4px 8px rgba(0,0,0,.4),
      0 22px 40px rgba(0,0,0,.5),
      0 60px 120px rgba(0,0,0,.65),
      inset 0 1px 0 rgba(255,255,255,.09);}
  .card-login .marca{text-align:center;margin-bottom:22px;}
  .card-login .marca .arroba{color:var(--texto-suave);font-size:12px;letter-spacing:1px;margin-bottom:6px;}
  .card-login .marca h1{font-size:42px;font-weight:900;margin:0;line-height:.9;color:#fff;text-transform:uppercase;}
  .card-login .marca .slogan{background:var(--verde-escuro);color:var(--limao);font-weight:700;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;padding:6px 10px;border-radius:6px;display:inline-block;margin-top:10px;}
  .card-login .barra-assinatura{margin:16px 0 22px;}
  .card-login input{width:100%;padding:13px 14px;margin-bottom:12px;border:1.5px solid var(--borda);border-radius:var(--raio-s);font-size:14px;font-family:inherit;background:var(--preto-suave);color:var(--texto);}
  .card-login input:focus{outline:none;border-color:var(--limao);}
  .card-login button{width:100%;padding:14px;background:var(--degrade-assinatura);color:#062012;border:none;border-radius:var(--raio-s);font-weight:800;font-size:14px;cursor:pointer;letter-spacing:.3px;text-transform:uppercase;}
  .card-login button:disabled{opacity:.6;cursor:default;}
  #erroLogin{color:#FF8E92;font-size:12px;margin-top:10px;min-height:16px;text-align:center;font-weight:600;}

  /* ---------- SHELL ---------- */
  #app{display:flex;flex-direction:column;height:100vh;width:100%;}
  header.topo-app{background:var(--superficie);border-bottom:1px solid var(--borda);flex-shrink:0;padding-top:env(safe-area-inset-top, 0px);}
  .topo-linha1{display:flex;align-items:center;gap:18px;padding:14px 28px;}
  .logo-topo h1{font-size:22px;font-weight:900;margin:0;color:#fff;text-transform:uppercase;line-height:.9;}
  .logo-topo .arroba{font-size:9.5px;color:var(--texto-suave);letter-spacing:1px;}
  .saudacao-bloco{margin-left:14px;}
  .saudacao-bloco h2{margin:0;font-size:19px;font-weight:700;color:#fff;}
  .saudacao-bloco span{font-size:11px;color:var(--texto-suave);}
  .topo-direita{display:flex;align-items:center;gap:14px;margin-left:auto;}
  .avatar-topo{width:36px;height:36px;border-radius:50%;background:var(--verde);color:var(--limao);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;border:1px solid var(--borda);}
  .perfil-texto{display:flex;flex-direction:column;line-height:1.25;}
  .perfil-texto b{font-size:12.5px;color:#fff;}
  .perfil-texto span{font-size:10.5px;color:var(--texto-suave);}
  .btn-sair{background:none;border:1px solid var(--borda);color:var(--texto-suave);padding:8px 14px;border-radius:var(--raio-s);font-size:12px;font-weight:700;cursor:pointer;}
  .btn-sair:hover{background:var(--alerta);color:#fff;border-color:var(--alerta);}
  nav.menu-nav{display:flex;gap:2px;padding:0 24px;overflow-x:auto;border-top:1px solid var(--borda);}
  nav.menu-nav button{background:none;border:none;color:var(--texto-suave);font-family:inherit;font-weight:700;font-size:13px;padding:12px 15px;cursor:pointer;white-space:nowrap;position:relative;}
  nav.menu-nav button:hover{color:#fff;}
  nav.menu-nav button.ativo{color:var(--limao);}
  nav.menu-nav button.ativo::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px;background:var(--degrade-assinatura);}

  main{flex:1;overflow-y:auto;padding:26px 28px 40px;}

  .topo-pagina{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:16px;flex-wrap:wrap;}
  .topo-pagina .cabecalho-titulo{display:flex;flex-direction:column;gap:6px;}
  .topo-pagina .cabecalho-titulo p{margin:0;font-size:11.5px;color:var(--texto-suave);}
  .kpis-mini-row{display:flex;gap:10px;flex-wrap:wrap;flex:1;justify-content:center;min-width:280px;}
  .kpi-mini{display:flex;align-items:center;gap:10px;background:var(--superficie);border:1px solid var(--borda);border-radius:12px;padding:10px 16px;min-width:135px;}
  .icone-kpi-mini{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .num-kpi-mini{font-size:18px;font-weight:800;color:#fff;line-height:1;}
  .rot-kpi-mini{font-size:9.5px;color:var(--texto-suave);margin-top:2px;text-transform:uppercase;letter-spacing:.3px;}
  @media(max-width:900px){ .kpis-mini-row{order:3;width:100%;justify-content:flex-start;} }
  .topo-pagina h2{margin:0 0 8px;font-size:24px;font-weight:800;color:#fff;}
  .topo-pagina .destaque{color:var(--limao);}
  .topo-pagina .barra-assinatura{width:64px;}
  .btn-primario{background:var(--degrade-assinatura);color:#062012;border:none;padding:11px 18px;border-radius:var(--raio-s);font-weight:800;font-family:inherit;cursor:pointer;font-size:13px;text-transform:uppercase;letter-spacing:.3px;}
  .btn-primario:hover{filter:brightness(1.08);}
  .btn-secundario{background:var(--superficie-2);border:1px solid var(--borda);color:var(--texto);padding:10px 14px;border-radius:var(--raio-s);cursor:pointer;font-size:12.5px;font-family:inherit;font-weight:600;}
  .btn-secundario:hover{border-color:var(--limao);color:var(--limao);}
  .btn-perigo{background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.4);color:#FF8E92;padding:10px 14px;border-radius:var(--raio-s);cursor:pointer;font-size:12.5px;font-family:inherit;font-weight:600;}
  .btn-perigo:hover{background:#E5484D;color:#fff;border-color:#E5484D;}
  .grupo-acoes-tabela{display:flex;gap:6px;}
  .grupo-acoes-topo{display:flex;gap:10px;}

  /* ---------- KPIs ---------- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px;}
  .graficos-dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .listas-dashboard-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:1000px){
    .graficos-dashboard-grid{grid-template-columns:1fr;}
    .listas-dashboard-grid{grid-template-columns:1fr;}
  }
  .kpi{background:var(--superficie);border:1px solid var(--borda);border-left:4px solid var(--limao);border-radius:var(--raio-m);padding:18px 20px;}
  .kpi .num{font-size:28px;font-weight:800;color:#fff;line-height:1;}
  .kpi .rot{font-size:10.5px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.5px;margin-top:8px;font-weight:700;}

  /* ---------- tabela ---------- */
  .barra-acoes{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .barra-acoes input,.barra-acoes select{padding:10px 13px;border:1.5px solid var(--borda);border-radius:var(--raio-s);font-size:13px;font-family:inherit;background:var(--superficie);color:var(--texto);}
  .barra-acoes input:focus,.barra-acoes select:focus{outline:none;border-color:var(--limao);}
  .tabela-box{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-m);overflow:auto;max-height:60vh;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{position:sticky;top:0;background:var(--verde-escuro);color:var(--limao);text-align:left;padding:11px 14px;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;font-weight:800;z-index:2;}
  td{padding:11px 14px;border-bottom:1px solid var(--borda);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;color:var(--texto);}
  tbody tr:hover td{background:var(--superficie-2);}
  .link-wa{color:var(--limao);text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:5px;}
  .link-wa:hover{text-decoration:underline;}

  .badge{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.2px;display:inline-block;}
  .badge.CONCLUIDO,.badge.SIM,.badge.ENTREGUE,.badge.CONFIRMADO,.badge.REALIZADO{background:rgba(22,163,74,.18);color:#3FD17D;border:1px solid rgba(63,209,125,.3);}
  .badge.EM_ANALISE,.badge.PLANEJAMENTO{background:rgba(232,174,0,.18);color:#F2C43D;border:1px solid rgba(242,196,61,.3);}
  .badge.CANCELADO,.badge.NAO{background:rgba(229,72,77,.18);color:#FF8E92;border:1px solid rgba(255,142,146,.3);}
  .badge.USANDO{background:rgba(232,174,0,.18);color:#F2C43D;border:1px solid rgba(242,196,61,.3);}

  /* ---------- modal ---------- */
  .modal-fundo{position:fixed;inset:0;background:rgba(2,6,4,.66);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:80;}
  .modal{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-l);padding:28px;width:640px;max-width:100%;box-shadow:0 40px 90px rgba(0,0,0,.5);animation:entra .2s ease both;}
  .modal h3{margin:0 0 16px;font-size:19px;font-weight:800;color:#fff;}
  .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
  .campo-2{grid-column:1/-1;}
  .modal label{font-size:10px;color:var(--texto-suave);display:block;margin:0 0 5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .modal input,.modal select,.modal textarea{width:100%;padding:10px 12px;border:1.5px solid var(--borda);border-radius:var(--raio-s);font-size:13px;font-family:inherit;background:var(--preto-suave);color:var(--texto);}
  .modal input:focus,.modal select:focus,.modal textarea:focus{outline:none;border-color:var(--limao);}
  .modal-acoes{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;}
  .aviso-perfil{background:rgba(232,174,0,.12);border:1px solid rgba(232,174,0,.35);color:#F2C43D;padding:11px 15px;border-radius:var(--raio-s);font-size:12px;margin-bottom:16px;}
  .resultados-busca-pessoa{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--preto-suave);border:1px solid var(--limao);border-radius:var(--raio-s);max-height:220px;overflow-y:auto;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.5);}
  .seletor-intencao{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .opcao-intencao{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px;border:1.5px solid var(--borda);border-radius:var(--raio-s);background:var(--preto-suave);color:var(--texto-suave);cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;transition:border-color .15s ease,background .15s ease,color .15s ease;}
  .opcao-intencao .icone-intencao{font-size:20px;}
  .opcao-intencao:hover{border-color:var(--limao);}
  .opcao-intencao.selecionada{border-color:var(--limao);background:var(--verde-escuro);color:#fff;}
  .badge-intencao{padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:800;display:inline-flex;align-items:center;gap:4px;}
  .badge-intencao.SIM{background:rgba(22,163,74,.18);color:#3FD17D;}
  .badge-intencao.INDECISO{background:rgba(232,174,0,.18);color:#F2C43D;}
  .badge-intencao.NAO{background:rgba(229,72,77,.18);color:#FF8E92;}
  .badge-intencao.vazio{background:var(--superficie-2);color:var(--texto-fraco);}
  .item-resultado-pessoa{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--borda);display:flex;flex-direction:column;gap:2px;}
  .item-resultado-pessoa:last-child{border-bottom:none;}
  .item-resultado-pessoa:hover{background:var(--verde-escuro);}
  .item-resultado-pessoa b{font-size:12.5px;color:#fff;}
  .item-resultado-pessoa span{font-size:11px;color:var(--texto-suave);}
  .item-resultado-pessoa.sem-resultado{color:var(--texto-fraco);font-size:12px;cursor:default;}
  .item-resultado-pessoa.sem-resultado:hover{background:none;}
  .lista-anexos-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--borda);font-size:12px;}
  .lista-anexos-item span{display:flex;gap:8px;}
  .lista-anexos-item a{color:var(--limao);text-decoration:none;font-weight:600;}
  .lista-anexos-item a:hover{text-decoration:underline;}
  .anexo-upload{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .anexo-upload input[type=file]{flex:1;font-size:11.5px;color:var(--texto-suave);}

  /* ---------- TOASTS ---------- */
  .toast-container{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:340px;}
  .toast{background:var(--superficie);border:1px solid var(--borda);border-left:4px solid var(--limao);color:var(--texto);padding:12px 16px;border-radius:var(--raio-s);font-size:12.5px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:entra .2s ease both;display:flex;align-items:flex-start;gap:10px;transition:opacity .25s ease,transform .25s ease;}
  .toast.sucesso{border-left-color:var(--verde-vivo);}
  .toast.erro{border-left-color:var(--alerta);}
  .toast.aviso{border-left-color:var(--aviso);}
  @media(max-width:760px){ .toast-container{left:12px;right:12px;top:12px;max-width:none;} }

  /* ---------- AGENDA (estilo calendário, sem rolagem, proporcional à tela) ---------- */
  main.modo-agenda{overflow:hidden;display:flex;flex-direction:column;}
  main.modo-agenda .topo-pagina{flex:0 0 auto;}
  .agenda-layout{display:flex;gap:16px;flex:1;min-height:0;}
  .agenda-layout > .agenda-box{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
  .agenda-layout > .agenda-box.agenda-lateral{flex:0 0 320px;}
  .agenda-box{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-m);padding:16px 18px;}
  .agenda-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex:0 0 auto;}
  .mes-atual-agenda{font-size:15px;color:#fff;text-transform:capitalize;min-width:130px;text-align:center;}
  .btn-nav-mes{background:var(--superficie-2);border:1px solid var(--borda);color:var(--texto);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1;flex-shrink:0;}
  .btn-nav-mes:hover{border-color:var(--limao);color:var(--limao);}
  .agenda-cabecalho-dias{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:clamp(8px,1.6vw,10px);color:var(--texto-fraco);font-weight:800;letter-spacing:.4px;margin-bottom:6px;flex:0 0 auto;}
  .agenda-grade{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(52px,1fr);gap:4px;flex:1;min-height:0;overflow-y:auto;}
  .dia-agenda{border:1px solid var(--borda);border-radius:8px;padding:4px 5px;cursor:pointer;transition:border-color .15s ease,background .15s ease;min-height:44px;overflow:hidden;display:flex;flex-direction:column;}
  .dia-agenda:hover{border-color:var(--limao);}
  .dia-agenda.vazio{border:none;cursor:default;}
  .dia-agenda.vazio:hover{border-color:transparent;}
  .dia-agenda.hoje{border-color:var(--limao);}
  .dia-agenda.hoje .num-dia-agenda{color:var(--limao);}
  .dia-agenda.selecionado{background:var(--verde-escuro);border-color:var(--limao);}
  .num-dia-agenda{font-size:clamp(10px,1.4vw,12.5px);font-weight:700;color:var(--texto);}
  .pontos-dia-agenda{display:flex;gap:2px;margin-top:auto;flex-wrap:wrap;align-items:center;}
  .mini-eventos-dia{margin-top:3px;display:flex;flex-direction:column;gap:2px;overflow:hidden;}
  .mini-evento-texto{font-size:clamp(8px,1.3vw,10.5px);font-weight:700;color:var(--verde-escuro);background:var(--limao);padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.6;}
  .mais-eventos-mini{font-size:clamp(7px,1.1vw,9px);color:var(--texto-fraco);font-weight:700;padding-left:2px;}
  .ponto-evento{width:5px;height:5px;border-radius:50%;background:var(--limao);display:inline-block;flex-shrink:0;}
  .mais-pontos{font-size:7.5px;color:var(--texto-fraco);font-weight:700;}
  .agenda-lateral h3{margin:0 0 12px;font-size:14px;color:#fff;font-weight:800;flex:0 0 auto;}
  .lista-eventos-dia{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto;}

function normalizarTexto(txt){
  return String(txt||'').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function somenteLeitura(){ return false; } // Vereador agora tem os mesmos acessos de escrita que Assessor
function iniciaisNome(nome){
  if(!nome) return '?';
  const p = nome.trim().split(' ');
  return (p[0][0] + (p[1]?p[1][0]:'')).toUpperCase();
}
function badgeStatus(status){
  if(!status || String(status).trim()==='') return '<span style="color:#5E7368;">— sem status —</span>';
  const classe = normalizarTexto(status).replace(/\s/g,'_');
  return '<span class="badge '+classe+'">'+status+'</span>';
}
// Card compacto de estatística (ícone redondo + número + rótulo), usado nos
// cabeçalhos de Atendimentos, Equipamentos e Eventos.
function kpiMini(corFundo, corTexto, icone, numero, rotulo){
  return `<div class="kpi-mini"><div class="icone-kpi-mini" style="background:${corFundo};color:${corTexto};">${icone}</div><div><div class="num-kpi-mini">${numero}</div><div class="rot-kpi-mini">${rotulo}</div></div></div>`;
}
// telefone clicável -> abre WhatsApp direto (wa.me). Não é disparo em massa,
// é 1 clique = 1 conversa aberta manualmente, sem custo e sem risco de banimento.
// Formata o campo de horário enquanto a pessoa digita: só números,
// insere os dois pontos sozinho (ex: digitar 1400 vira 14:00), e trava
// em valores válidos (hora até 23, minuto até 59).
window.formatarHorario = function(input){
  let digitos = input.value.replace(/\D/g,'').slice(0,4);
  if(digitos.length >= 2){
    let hh = digitos.slice(0,2);
    if(Number(hh) > 23) hh = '23';
    let mm = digitos.slice(2,4);
    if(mm.length === 2 && Number(mm) > 59) mm = '59';
    input.value = digitos.length > 2 ? hh+':'+mm : hh;
  } else {
    input.value = digitos;
  }
};

function linkWhatsapp(telefone){
  if(!telefone) return '-';
  const numeros = String(telefone).replace(/\D/g,'');
  if(!numeros) return telefone;
  const comDDI = numeros.length <= 11 ? '55'+numeros : numeros;
  return '<a class="link-wa" target="_blank" href="https://wa.me/'+comDDI+'">💬 '+telefone+'</a>';
}
// Igual ao de cima, mas já abre o WhatsApp com uma mensagem pronta no campo
// de texto — usado no painel de aniversariantes (você só confere e envia).
function linkWhatsappComMensagem(telefone, mensagem){
  const numeros = String(telefone||'').replace(/\D/g,'');
  if(!numeros) return null;
  const comDDI = numeros.length <= 11 ? '55'+numeros : numeros;
  return 'https://wa.me/'+comDDI+'?text='+encodeURIComponent(mensagem);
}
// dataNascimento vem como texto "dd/mm/aaaa" ou "dd/mm". Retorna {dia,mes} ou null.
function diaEMesNascimento(dataNascimento){
  const partes = String(dataNascimento||'').split('/');
  if(partes.length < 2) return null;
  const dia = Number(partes[0]), mes = Number(partes[1]);
  if(!dia || !mes) return null;
  return { dia, mes };
}
function diasAteProximoAniversario(dataNascimento){
  const dm = diaEMesNascimento(dataNascimento);
  if(!dm) return null;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  let proximo = new Date(hoje.getFullYear(), dm.mes-1, dm.dia);
  if(proximo < hoje) proximo = new Date(hoje.getFullYear()+1, dm.mes-1, dm.dia);
  return Math.round((proximo - hoje) / (1000*60*60*24));
}

// ---------------- TOASTS E CONFIRMAÇÃO (substituem alert/confirm nativos) ----------------
function mostrarToast(mensagem, tipo){
  tipo = tipo || 'info';
  const container = document.getElementById('toastContainer');
  if(!container) return;
  const icones = { sucesso:'✅', erro:'⚠️', aviso:'⚠️', info:'ℹ️' };
  const el = document.createElement('div');
  el.className = 'toast '+tipo;
  el.innerHTML = '<span>'+(icones[tipo]||icones.info)+'</span><span>'+mensagem+'</span>';
  container.appendChild(el);
  setTimeout(()=>{
    el.style.opacity = '0';
    el.style.transform = 'translateX(12px)';
    setTimeout(()=>el.remove(), 250);
  }, 4200);
}

// Substitui window.confirm por um modal no mesmo estilo do resto do app.
// Retorna uma Promise<boolean> — use com await dentro das funções async.
function confirmarAcao(mensagem, textoBotao){
  return new Promise(resolve=>{
    const fundo = document.createElement('div');
    fundo.className = 'modal-fundo';
    fundo.style.zIndex = 100;
    fundo.innerHTML = `
      <div class="modal" style="width:380px;" onclick="event.stopPropagation()">
        <h3>Confirmar ação</h3>
        <p style="font-size:13px;color:var(--texto-suave);line-height:1.5;margin:0 0 22px;">${mensagem}</p>
        <div class="modal-acoes">
          <button class="btn-secundario" id="btnConfirmarCancelar">Cancelar</button>
          <button class="btn-perigo" id="btnConfirmarOk">${textoBotao||'Confirmar'}</button>
        </div>
      </div>`;
    document.body.appendChild(fundo);
    const finalizar = (valor)=>{ fundo.remove(); resolve(valor); };
    fundo.onclick = (ev)=>{ if(ev.target===fundo) finalizar(false); };
    fundo.querySelector('#btnConfirmarCancelar').onclick = ()=>finalizar(false);
    fundo.querySelector('#btnConfirmarOk').onclick = ()=>finalizar(true);
  });
}

// Exporta uma lista de objetos pra CSV (separador ";", padrão do Excel
// em pt-BR) e dispara o download no navegador. colunas = [{chave,rotulo}].
function exportarCSV(nomeArquivo, colunas, linhas){
  if(!linhas.length){ mostrarToast('Não há dados para exportar.', 'aviso'); return; }
  const escapar = (valor)=>'"'+String(valor==null?'':valor).replace(/"/g,'""')+'"';
  const cabecalho = colunas.map(c=>escapar(c.rotulo)).join(';');
  const corpo = linhas.map(linha=>colunas.map(c=>escapar(linha[c.chave])).join(';'));
  const conteudo = '﻿'+[cabecalho, ...corpo].join('\r\n');
  const blob = new Blob([conteudo], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = nomeArquivo;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  mostrarToast('Arquivo '+nomeArquivo+' exportado!', 'sucesso');
}

// ---------------- LOGIN ----------------
document.getElementById('inputUsuario').addEventListener('keydown', e=>{ if(e.key==='Enter') fazerLogin(); });
document.getElementById('inputSenha').addEventListener('keydown', e=>{ if(e.key==='Enter') fazerLogin(); });

// Efeito 3D no card de login, seguindo o cursor — só em telas com mouse de
// verdade (hover + pointer fino). No celular fica só a profundidade estática
// (sombras em camadas), sem "tilt", porque não faz sentido no toque.
if(window.matchMedia('(hover: hover) and (pointer: fine)').matches){
  const cardLogin = document.querySelector('.card-login');
  if(cardLogin){
    cardLogin.addEventListener('mousemove', (ev)=>{
      const rect = cardLogin.getBoundingClientRect();
      const x = (ev.clientX - rect.left) / rect.width - 0.5;
      const y = (ev.clientY - rect.top) / rect.height - 0.5;
      const rotY = x * 10;
      const rotX = y * -10;
      cardLogin.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.015)`;
      cardLogin.classList.add('tilt-ativo');
    });
    cardLogin.addEventListener('mouseleave', ()=>{
      cardLogin.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
      cardLogin.classList.remove('tilt-ativo');
    });
  }
}

async function fazerLogin(){
  const email = document.getElementById('inputUsuario').value.trim();
  const senha = document.getElementById('inputSenha').value;
  const erroEl = document.getElementById('erroLogin');
  const btn = document.getElementById('btnEntrar');
  erroEl.innerText = '';
  if(!email || !senha){ erroEl.innerText = 'Preencha usuário e senha.'; return; }
  btn.disabled = true; btn.innerText = 'Entrando...';
  try{
    await signInWithEmailAndPassword(auth, email, senha);
    // onAuthStateChanged cuida do resto
  }catch(erro){
    const mapa = {
      'auth/invalid-credential':'Usuário ou senha incorretos.',
      'auth/user-not-found':'Usuário não encontrado.',
      'auth/wrong-password':'Senha incorreta.',
      'auth/too-many-requests':'Muitas tentativas. Aguarde um pouco.',
      'auth/invalid-email':'E-mail inválido.'
    };
    erroEl.innerText = mapa[erro.code] || 'Erro ao entrar. Tente novamente.';
  }finally{
    btn.disabled = false; btn.innerText = 'Entrar';
  }
}

async function fazerLogout(){
  await signOut(auth);
}

onAuthStateChanged(auth, async (user) => {
  if(!user){
    USUARIO = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('telaLogin').classList.remove('hidden');
    return;
  }
  const perfilSnap = await getDoc(doc(db,'usuarios',user.uid));
  if(!perfilSnap.exists() || perfilSnap.data().ativo === false){
    document.getElementById('erroLogin').innerText = 'Seu usuário não tem perfil ativo. Fale com o administrador.';
    await signOut(auth);
    return;
  }
  const p = perfilSnap.data();
  USUARIO = { uid:user.uid, email:user.email, nome:p.nome||user.email, cargo:normalizarTexto(p.cargo), ativo:true, foto:p.foto||null };
  iniciarApp();

  // VIGIA EM TEMPO REAL: se o ADMIN desativar esse usuário enquanto ele
  // está com o app aberto, a sessão cai na hora — não espera próxima ação.
  if(pararVigiaPerfil) pararVigiaPerfil();
  pararVigiaPerfil = onSnapshot(doc(db,'usuarios',user.uid), (snap)=>{
    if(!snap.exists() || snap.data().ativo === false){
      alert('Seu acesso foi bloqueado pelo administrador.');
      signOut(auth);
    }
  });
});

async function iniciarApp(){
  document.getElementById('telaLogin').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('nomeTopo').innerText = USUARIO.nome;
  document.getElementById('cargoTopo').innerText = rotuloCargo(USUARIO.cargo);

  montarMenu();

}

function rotuloCargo(c){
  const m = {ADMIN:'ADMINISTRADOR',VEREADOR:'VEREADOR',ASSESSOR:'ASSESSOR',ASSESSORA:'ASSESSORA'};
  return m[c] || c || '-';
}

function montarMenu(){
  const itens = [
    {id:'dashboard',label:'Dashboard'},
    {id:'eventos',label:'Eventos'},
    {id:'pessoas',label:'Cadastro'},
    {id:'votantes',label:'Votantes'},
    {id:'atendimentos',label:'Atendimentos'},
    {id:'transportes',label:'Transportes'},
    {id:'equipamentos',label:'Equipamentos'},
    {id:'agenda',label:'Agenda'}
  ];
  if(USUARIO.cargo === 'ADMIN') itens.push({id:'configuracoes',label:'Configurações'}, {id:'usuarios',label:'Usuários'});
  const nav = document.getElementById('menuNav');
  nav.innerHTML = '';
  itens.forEach(it=>{
    const btn = document.createElement('button');
    btn.innerText = it.label;
    btn.id = 'menu_'+it.id;
    btn.onclick = ()=>irPara(it.id);
    nav.appendChild(btn);

}
function marcarMenuAtivo(id){
  document.querySelectorAll('#menuNav button').forEach(b=>b.classList.remove('ativo'));
  const el = document.getElementById('menu_'+id);
  if(el) el.classList.add('ativo');

function irPara(pagina){
  paginaAtual = pagina;
  marcarMenuAtivo(pagina);
  document.getElementById('conteudo').classList.toggle('modo-agenda', pagina==='agenda');
  const funcoes = { dashboard:renderDashboard, eventos:renderEventos, pessoas:renderPessoas, votantes:renderVotantes, atendimentos:renderAtendimentos, transportes:renderTransportes, equipamentos:renderEquipamentos, agenda:renderAgenda, usuarios:renderUsuarios, configuracoes:renderConfiguracoes };
  funcoes[pagina]();
}

// ---------------- HELPERS FIRESTORE ----------------
async function listarColecao(nome){
  const snap = await getDocs(query(collection(db,nome), orderBy('criadoEm','desc')));
  return snap.docs.map(d=>({ id:d.id, ...d.data() }));
}
// Listagem simples, sem depender do campo criadoEm — usada pras coleções de
// configuração (tipos), que podem ser cadastradas de qualquer jeito.
async function listarColecaoSimples(nome){
  const snap = await getDocs(collection(db,nome));
  return snap.docs.map(d=>({ id:d.id, ...d.data() })).sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||'')));
}
async function salvarDoc(colecaoNome, id, dados){
  dados.ultimaEdicaoPor = USUARIO.nome;
  dados.ultimaEdicaoData = new Date().toLocaleString('pt-BR');
  if(id){
    await updateDoc(doc(db,colecaoNome,id), dados);
    return id;
  } else {
    dados.criadoPor = USUARIO.nome;
    dados.criadoEm = serverTimestamp();
    const ref = await addDoc(collection(db,colecaoNome), dados);
    return ref.id;
  }
}

let chartsDashboardAtivos = [];

// dd/mm/aaaa -> Date (ou null se inválido). Reaproveitado em vários lugares
// do Dashboard pra ordenar por data mais próxima.
function parseDataBRGlobal(str){
  const p = String(str||'').split('/');
  if(p.length !== 3) return null;
  const d = new Date(Number(p[2]), Number(p[1])-1, Number(p[0]));
  return isNaN(d.getTime()) ? null : d;
}

async function renderDashboard(){
  const c = document.getElementById('conteudo');
  c.innerHTML = '<div class="topo-pagina"><div><h2>Visão <span class="destaque">Geral</span></h2><div class="barra-assinatura"></div></div></div><p style="color:#9FB3A6;">Carregando...</p>';

  chartsDashboardAtivos.forEach(ch=>{ try{ ch.destroy(); }catch(e){} });
  chartsDashboardAtivos = [];

  const [atend, transp, equip, agendaEv, eventosDb] = await Promise.all([
    listarColecao('atendimentos'), listarColecao('transportes'), listarColecao('equipamentos'),
    listarColecaoSimples('agendaEventos'), listarColecao('eventos')
  ]);
  pessoasCache = await listarColecaoSimples('pessoas');

  const emAnalise = atend.filter(a=>normalizarTexto(a.status)==='EM ANALISE').length;
  const concluidos = atend.filter(a=>normalizarTexto(a.status)==='CONCLUIDO').length;
  const cancelados = atend.filter(a=>normalizarTexto(a.status)==='CANCELADO').length;
  const transpConfirmados = transp.filter(t=>normalizarTexto(t.confirmado)==='SIM').length;
  const equipEmUso = equip.filter(e=>normalizarTexto(e.devolucao)==='USANDO').length;

  // --- Agrupamentos pros gráficos ---
  const porTipo = {};
  atend.forEach(a=>{ const t = a.tipoAtendimento || 'Sem tipo'; porTipo[t] = (porTipo[t]||0)+1; });
  const tiposOrdenados = Object.entries(porTipo).sort((a,b)=>b[1]-a[1]);

  const porBairro = {};
  atend.forEach(a=>{ const b = a.bairro || 'Sem bairro'; porBairro[b] = (porBairro[b]||0)+1; });
  const bairrosOrdenados = Object.entries(porBairro).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const porEquip = {};
  equip.forEach(e=>{ const t = e.equipamento || 'Sem tipo'; porEquip[t] = (porEquip[t]||0)+1; });
  const equipOrdenados = Object.entries(porEquip).sort((a,b)=>b[1]-a[1]);

  const hoje = new Date(); hoje.setHours(0,0,0,0);

  const proximosCompromissos = agendaEv
    .map(ev=>({ ...ev, dataObj: parseDataBRGlobal(ev.data) }))
    .filter(ev=>ev.dataObj && ev.dataObj >= hoje)
    .sort((a,b)=>a.dataObj-b.dataObj)
    .slice(0,5);

  const proximosEventos = eventosDb
    .map(ev=>({ ...ev, dataObj: parseDataBRGlobal(ev.data) }))
    .filter(ev=>normalizarTexto(ev.status)!=='REALIZADO' && normalizarTexto(ev.status)!=='CANCELADO')
    .sort((a,b)=>(a.dataObj||new Date(8640000000000000)) - (b.dataObj||new Date(8640000000000000)))
    .slice(0,5);

  const ultimosAtendimentos = atend.slice(0,6);

  const aniversariantes = pessoasCache
    .map(p=>({ pessoa:p, dias: diasAteProximoAniversario(p.dataNascimento) }))
    .filter(x=>x.dias !== null && x.dias <= 7)
    .sort((a,b)=>a.dias-b.dias);

  function rotuloDias(d){
    if(d===0) return 'Hoje';
    if(d===1) return 'Amanhã';
    return 'Em '+d+' dias';
  }

  c.innerHTML = `
    <div class="topo-pagina"><div><h2>Visão <span class="destaque">Geral</span></h2><div class="barra-assinatura"></div></div></div>
    <div class="kpis">
      <div class="kpi"><div class="num">${atend.length}</div><div class="rot">Atendimentos Totais</div></div>
      <div class="kpi"><div class="num">${emAnalise}</div><div class="rot">Em Análise</div></div>
      <div class="kpi"><div class="num">${concluidos}</div><div class="rot">Concluídos</div></div>
      <div class="kpi"><div class="num">${transp.length}</div><div class="rot">Transportes</div></div>
      <div class="kpi"><div class="num">${transpConfirmados}</div><div class="rot">Confirmados</div></div>
      <div class="kpi"><div class="num">${equipEmUso}</div><div class="rot">Equipamentos em Uso</div></div>
    </div>

    ${aniversariantes.length ? `
    <div class="agenda-box" style="height:auto;margin-bottom:20px;">
      <h3 style="margin:0 0 4px;font-size:15px;color:#fff;">🎂 Aniversariantes dos próximos 7 dias</h3>
      <p style="font-size:11.5px;color:var(--texto-suave);margin:0 0 14px;">Clique em Enviar pra abrir o WhatsApp já com a mensagem pronta.</p>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${aniversariantes.map(x=>{
          const msg = 'Olá, '+(x.pessoa.nome||'').split(' ')[0]+'! Passando pra desejar um feliz aniversário em nome do vereador Tatiquinho. Muita saúde e felicidades! 🎉';
          const link = linkWhatsappComMensagem(x.pessoa.telefone, msg);
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 14px;background:var(--superficie-2);border-radius:10px;">
            <div>
              <b style="font-size:13px;color:#fff;">${x.pessoa.nome}</b>
              <span style="font-size:11px;color:var(--limao);margin-left:8px;font-weight:700;">${rotuloDias(x.dias)}</span>
            </div>
            ${link ? `<a href="${link}" target="_blank" class="btn-secundario" style="text-decoration:none;">💬 Enviar</a>` : '<span style="font-size:11px;color:var(--texto-fraco);">Sem telefone</span>'}
          </div>`;
        }).join('')}
      </div>
    </div>` : ''}

    <div class="graficos-dashboard-grid">
      <div class="agenda-box" style="height:auto;">
        <h3 style="margin:0 0 14px;font-size:13px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.4px;">Atendimentos por Status</h3>
        <div style="position:relative;height:210px;"><canvas id="chartStatus"></canvas></div>
      </div>
      <div class="agenda-box" style="height:auto;">
        <h3 style="margin:0 0 14px;font-size:13px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.4px;">Atendimentos por Tipo</h3>
        <div style="position:relative;height:210px;"><canvas id="chartTipo"></canvas></div>
      </div>
    </div>

    <div class="graficos-dashboard-grid">
      <div class="agenda-box" style="height:auto;">
        <h3 style="margin:0 0 14px;font-size:13px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.4px;">Atendimentos por Bairro</h3>
        <div style="position:relative;height:220px;">${bairrosOrdenados.length ? '<canvas id="chartBairro"></canvas>' : '<p style="color:#5E7368;font-size:12px;">Sem dados ainda.</p>'}</div>
      </div>
      <div class="agenda-box" style="height:auto;">
        <h3 style="margin:0 0 14px;font-size:13px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.4px;">Equipamentos — onde mais ajudou</h3>
        <div style="position:relative;height:220px;">${equipOrdenados.length ? '<canvas id="chartEquip"></canvas>' : '<p style="color:#5E7368;font-size:12px;">Sem empréstimos ainda.</p>'}</div>
      </div>
    </div>

    <div class="listas-dashboard-grid">
      <div class="agenda-box" style="height:auto;">
        <h3 style="margin:0 0 14px;font-size:13px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.4px;">Últimos Atendimentos</h3>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${ultimosAtendimentos.map(a=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--superficie-2);border-radius:8px;">
              <div><b style="font-size:12.5px;color:#fff;">${a.nome||'-'}</b><div style="font-size:10.5px;color:var(--texto-suave);">${a.tipoAtendimento||''} · ${a.data||''}</div></div>
              ${badgeStatus(a.status)}
            </div>`).join('') || '<p style="color:#5E7368;font-size:12px;">Nenhum atendimento ainda.</p>'}
        </div>
      </div>
      <div class="agenda-box" style="height:auto;">
        <h3 style="margin:0 0 14px;font-size:13px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.4px;">Próximos Compromissos (Agenda)</h3>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${proximosCompromissos.map(ev=>`
            <div style="padding:8px 12px;background:var(--superficie-2);border-radius:8px;">
              <b style="font-size:12.5px;color:#fff;">${ev.titulo||''}</b>
              <div style="font-size:10.5px;color:var(--limao);font-weight:700;">${ev.data||''}${ev.horaInicio?' · '+ev.horaInicio:''}</div>
            </div>`).join('') || '<p style="color:#5E7368;font-size:12px;">Nenhum compromisso agendado.</p>'}
        </div>
      </div>
      <div class="agenda-box" style="height:auto;">
        <h3 style="margin:0 0 14px;font-size:13px;color:var(--texto-suave);text-transform:uppercase;letter-spacing:.4px;">Próximos Eventos</h3>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${proximosEventos.map(ev=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--superficie-2);border-radius:8px;">
              <div><b style="font-size:12.5px;color:#fff;">${ev.titulo||''}</b><div style="font-size:10.5px;color:var(--texto-suave);">${ev.data||'Sem data'}${ev.local?' · '+ev.local:''}</div></div>
              ${badgeStatus(ev.status)}
            </div>`).join('') || '<p style="color:#5E7368;font-size:12px;">Nenhum evento planejado.</p>'}
        </div>
      </div>
    </div>
  `;

  // ---- Monta os gráficos (Chart.js) ----
  const corTexto = '#9FB3A6';
  const corGrade = 'rgba(159,179,166,.12)';
  Chart.defaults.font.family = "'Inter', sans-serif";

  chartsDashboardAtivos.push(new Chart(document.getElementById('chartStatus'), {
    type:'doughnut',
    data:{
      labels:['Concluídos','Em Análise','Cancelados'],
      datasets:[{ data:[concluidos, emAnalise, cancelados], backgroundColor:['#3FD17D','#F2C43D','#FF6B70'], borderWidth:0 }]
    },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{ legend:{ position:'bottom', labels:{ color:corTexto, boxWidth:9, boxHeight:9, padding:14, font:{size:10.5,weight:'600'} } } }
    }
  }));

  chartsDashboardAtivos.push(new Chart(document.getElementById('chartTipo'), {
    type:'bar',
    data:{
      labels:tiposOrdenados.map(t=>t[0]),
      datasets:[{ data:tiposOrdenados.map(t=>t[1]), backgroundColor:'#A8D948', borderRadius:6, maxBarThickness:22 }]
    },
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false } },
      scales:{
        x:{ beginAtZero:true, ticks:{ color:corTexto, stepSize:1, font:{size:9.5} }, grid:{ color:corGrade } },
        y:{ ticks:{ color:corTexto, font:{size:9.5} }, grid:{ display:false } }
      }
    }
  }));

  if(bairrosOrdenados.length){
    chartsDashboardAtivos.push(new Chart(document.getElementById('chartBairro'), {
      type:'bar',
      data:{
        labels:bairrosOrdenados.map(b=>b[0]),
        datasets:[{ data:bairrosOrdenados.map(b=>b[1]), backgroundColor:'#60A5FA', borderRadius:6, maxBarThickness:26 }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{
          x:{ ticks:{ color:corTexto, font:{size:9}, maxRotation:35, minRotation:20 }, grid:{ display:false } },
          y:{ beginAtZero:true, ticks:{ color:corTexto, stepSize:1, font:{size:9.5} }, grid:{ color:corGrade } }
        }
      }
    }));
  }

  if(equipOrdenados.length){
    chartsDashboardAtivos.push(new Chart(document.getElementById('chartEquip'), {
      type:'bar',
      data:{
        labels:equipOrdenados.map(e=>e[0]),
        datasets:[{ data:equipOrdenados.map(e=>e[1]), backgroundColor:'#C084FC', borderRadius:6, maxBarThickness:26 }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{
          x:{ ticks:{ color:corTexto, font:{size:9}, maxRotation:35, minRotation:20 }, grid:{ display:false } },
          y:{ beginAtZero:true, ticks:{ color:corTexto, stepSize:1, font:{size:9.5} }, grid:{ color:corGrade } }
        }
      }
    }));
  }
}

let atendimentosCache = [];
let atendimentosFiltradosAtual = [];

async function renderAtendimentos(){
  const c = document.getElementById('conteudo');
  c.innerHTML = '<div class="topo-pagina"><div><h2>Controle de <span class="destaque">Atendimentos</span></h2><div class="barra-assinatura"></div></div></div><p style="color:#9FB3A6;">Carregando...</p>';
  atendimentosCache = await listarColecao('atendimentos');
  desenharAtendimentos();
}

function desenharAtendimentos(){
  const c = document.getElementById('conteudo');
  const botaoNovo = somenteLeitura() ? '' : '<button class="btn-primario" onclick="window.abrirModalAtendimento()">+ Novo Atendimento</button>';
  const aviso = somenteLeitura() ? '<div class="aviso-perfil">Seu perfil (VEREADOR) tem acesso somente para visualização.</div>' : '';

  const hoje = new Date().toLocaleDateString('pt-BR');
  const total = atendimentosCache.length;
  const concluidos = atendimentosCache.filter(a=>normalizarTexto(a.status)==='CONCLUIDO').length;
  const emAnalise = atendimentosCache.filter(a=>normalizarTexto(a.status)==='EM ANALISE').length;
  const deHoje = atendimentosCache.filter(a=>a.data===hoje).length;

  c.innerHTML = `
    <div class="topo-pagina">
      <div class="cabecalho-titulo">
        <h2>Controle de <span class="destaque">Atendimentos</span></h2>
        <p>Acompanhe e gerencie todos os atendimentos registrados.</p>
      </div>
      <div class="kpis-mini-row">
        ${kpiMini('rgba(22,163,74,.18)','#3FD17D','🗒️',total,'Total')}
        ${kpiMini('rgba(59,130,246,.18)','#60A5FA','✅',concluidos,'Concluídos')}
        ${kpiMini('rgba(232,174,0,.18)','#F2C43D','🕐',emAnalise,'Em Análise')}
        ${kpiMini('rgba(168,85,247,.18)','#C084FC','📅',deHoje,'Hoje')}
      </div>
      ${botaoNovo}
    </div>
    ${aviso}
    <div class="barra-acoes">
      <input id="fTexto" placeholder="Buscar nome ou bairro..." oninput="window.filtrarAtendimentos()">
      <select id="fStatus" onchange="window.filtrarAtendimentos()">
        <option value="">Todos os status</option>
        ${STATUS_ATENDIMENTO.map(s=>`<option>${s}</option>`).join('')}
      </select>
      <button class="btn-secundario" onclick="window.irPara('atendimentos')">↻ Atualizar</button>
      <button class="btn-secundario" onclick="window.exportarAtendimentosCSV()">⬇ Exportar CSV</button>
    </div>
    <div class="tabela-box">
      <table>
        <thead><tr><th>Data</th><th>Nome</th><th>Telefone</th><th>Bairro</th><th>Tipo</th><th>Status</th><th>Responsável</th><th>Anexos</th>${somenteLeitura()?'':'<th></th>'}</tr></thead>
        <tbody id="tbodyAtend"></tbody>
      </table>
    </div>
  `;
  filtrarAtendimentos();
}

function filtrarAtendimentos(){
  const texto = (document.getElementById('fTexto').value||'').toLowerCase();
  const status = document.getElementById('fStatus').value;
  let linhas = atendimentosCache;
  if(texto) linhas = linhas.filter(a=>((a.nome||'')+' '+(a.bairro||'')).toLowerCase().includes(texto));
  if(status) linhas = linhas.filter(a=>normalizarTexto(a.status)===normalizarTexto(status));
  atendimentosFiltradosAtual = linhas;

  document.getElementById('tbodyAtend').innerHTML = linhas.map(a=>`
    <tr>
      <td>${a.data||''}</td>
      <td>${a.nome||''}</td>
      <td>${linkWhatsapp(a.telefone)}</td>
      <td>${a.bairro||''}</td>
      <td>${a.tipoAtendimento||''}</td>
      <td>${badgeStatus(a.status)}</td>
      <td>${a.responsavel||''}</td>
      <td>${a.qtdAnexos ? '📎 '+a.qtdAnexos : '—'}</td>
      ${somenteLeitura() ? '' : `<td><div class="grupo-acoes-tabela"><button class="btn-secundario" onclick='window.abrirModalAtendimento(${JSON.stringify(a)})'>Editar</button><button class="btn-perigo" onclick="window.excluirAtendimento('${a.id}')">Excluir</button></div></td>`}
    </tr>
  `).join('') || `<tr><td colspan="9" style="text-align:center;color:#5E7368;padding:20px;">Nenhum atendimento encontrado.</td></tr>`;
}

window.filtrarAtendimentos = filtrarAtendimentos;
window.irPara = irPara;

window.exportarAtendimentosCSV = function(){
  exportarCSV('atendimentos.csv', [
    {chave:'data', rotulo:'Data'}, {chave:'nome', rotulo:'Nome'}, {chave:'telefone', rotulo:'Telefone'},
    {chave:'bairro', rotulo:'Bairro'}, {chave:'endereco', rotulo:'Endereço'}, {chave:'tipoAtendimento', rotulo:'Tipo'},
    {chave:'status', rotulo:'Status'}, {chave:'responsavel', rotulo:'Responsável'}, {chave:'observacoes', rotulo:'Observações'}
  ], atendimentosFiltradosAtual);
};

window.abrirModalAtendimento = function(registro){
  registro = registro || {};
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  fundo.onclick = (ev)=>{ if(ev.target===fundo) fundo.remove(); };
  fundo.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <h3>${registro.id ? 'Editar' : 'Novo'} Atendimento</h3>
      <div class="modal-grid">
        ${campoBuscaPessoa('m')}
        <div><label>Nome</label><input id="m_nome" value="${registro.nome||''}"></div>
        <div><label>Telefone</label><input id="m_telefone" value="${registro.telefone||''}" placeholder="64 99999-0000"></div>
        <div class="campo-2"><label>Endereço</label><input id="m_endereco" value="${registro.endereco||''}"></div>
        <div><label>Bairro</label><input id="m_bairro" value="${registro.bairro||''}"></div>
        <div><label>Tipo</label><select id="m_tipo">${tiposAtendimentoCache.length ? tiposAtendimentoCache.map(t=>`<option ${t.nome===registro.tipoAtendimento?'selected':''}>${t.nome}</option>`).join('') : '<option value="">Nenhum tipo cadastrado — vá em Configurações</option>'}</select></div>
        <div><label>Status</label><select id="m_status">${STATUS_ATENDIMENTO.map(s=>`<option ${s===registro.status?'selected':''}>${s}</option>`).join('')}</select></div>
        <div><label>Responsável</label><input id="m_responsavel" value="${registro.responsavel||''}"></div>
        <div class="campo-2"><label>Observações</label><textarea id="m_obs" rows="3">${registro.observacoes||''}</textarea></div>
        <div class="campo-2">
          <label>Anexos (RG, laudo, comprovante...)</label>
          ${registro.id ? `
            <div id="listaAnexosAtend"></div>
            ${somenteLeitura() ? '' : `<div class="anexo-upload">
              <input type="file" id="inputAnexoAtend" multiple>
              <button type="button" class="btn-secundario" onclick="window.enviarAnexosAtendimento('${registro.id}')">Enviar</button>
            </div>`}
          ` : `<p style="color:#5E7368;font-size:11.5px;margin:0;">Salve o atendimento primeiro pra poder anexar documentos.</p>`}
        </div>
      </div>
      <div class="modal-acoes">
        <button class="btn-secundario" onclick="this.closest('.modal-fundo').remove()">Cancelar</button>
        ${somenteLeitura() ? '' : `<button class="btn-primario" onclick="window.salvarAtendimento('${registro.id||''}')">Salvar</button>`}
      </div>
    </div>`;
  document.body.appendChild(fundo);
  ligarBuscaPessoa('m', { nome:'m_nome', telefone:'m_telefone', endereco:'m_endereco', bairro:'m_bairro' });
  if(registro.id) renderizarListaAnexos(registro.id, registro.anexos||[]);
};

// Mostra a lista de anexos já enviados dentro do modal de Atendimento,
// com link pra abrir cada um e botão de excluir.
function renderizarListaAnexos(atendimentoId, anexos){
  const container = document.getElementById('listaAnexosAtend');
  if(!container) return;
  if(!anexos || !anexos.length){
    container.innerHTML = '<p style="color:#5E7368;font-size:11.5px;margin:0 0 8px;">Nenhum anexo enviado ainda.</p>';
    return;
  }
  container.innerHTML = anexos.map((a,i)=>`
    <div class="lista-anexos-item">
      <span>📎 <a href="${a.url}" target="_blank" rel="noopener">${a.nome}</a></span>
      ${somenteLeitura() ? '' : `<button class="btn-perigo" style="padding:4px 9px;font-size:10.5px;" onclick="window.excluirAnexoAtendimento('${atendimentoId}', ${i})">Excluir</button>`}
    </div>`).join('');
}

window.enviarAnexosAtendimento = async function(atendimentoId){
  const input = document.getElementById('inputAnexoAtend');
  const arquivos = Array.from(input.files||[]);
  if(!arquivos.length){ mostrarToast('Escolha ao menos um arquivo.', 'aviso'); return; }
  try{
    const snap = await getDoc(doc(db,'atendimentos',atendimentoId));
    const anexosAtuais = (snap.exists() && snap.data().anexos) || [];
    const novosAnexos = [];
    for(const arquivo of arquivos){
      const caminho = 'atendimentos/'+atendimentoId+'/'+Date.now()+'_'+arquivo.name;
      const refArquivo = ref(storage, caminho);
      await uploadBytes(refArquivo, arquivo);
      const url = await getDownloadURL(refArquivo);
      novosAnexos.push({ nome: arquivo.name, url, caminho });
    }
    const anexosFinal = anexosAtuais.concat(novosAnexos);
    await updateDoc(doc(db,'atendimentos',atendimentoId), { anexos: anexosFinal, qtdAnexos: anexosFinal.length });
    input.value = '';
    renderizarListaAnexos(atendimentoId, anexosFinal);
    mostrarToast('Anexo(s) enviado(s) com sucesso!', 'sucesso');
    const idx = atendimentosCache.findIndex(a=>a.id===atendimentoId);
    if(idx>-1){ atendimentosCache[idx].anexos = anexosFinal; atendimentosCache[idx].qtdAnexos = anexosFinal.length; }
  }catch(erro){
    mostrarToast('Não foi possível enviar o(s) anexo(s). ('+erro.message+')', 'erro');
  }
};

window.excluirAnexoAtendimento = async function(atendimentoId, indice){
  if(!(await confirmarAcao('Excluir este anexo? Essa ação não pode ser desfeita.', 'Excluir'))) return;
  try{
    const snap = await getDoc(doc(db,'atendimentos',atendimentoId));
    const anexosAtuais = (snap.exists() && snap.data().anexos) || [];
    const anexo = anexosAtuais[indice];
    if(!anexo) return;
    try{ await deleteObject(ref(storage, anexo.caminho)); }catch(erroStorage){}
    const anexosFinal = anexosAtuais.filter((_,i)=>i!==indice);
    await updateDoc(doc(db,'atendimentos',atendimentoId), { anexos: anexosFinal, qtdAnexos: anexosFinal.length });
    renderizarListaAnexos(atendimentoId, anexosFinal);
    mostrarToast('Anexo excluído.', 'sucesso');
    const idx = atendimentosCache.findIndex(a=>a.id===atendimentoId);
    if(idx>-1){ atendimentosCache[idx].anexos = anexosFinal; atendimentosCache[idx].qtdAnexos = anexosFinal.length; }
  }catch(erro){
    mostrarToast('Não foi possível excluir o anexo. ('+erro.message+')', 'erro');
  }
};

// Converte o criadoEm (Timestamp do Firestore) em dias corridos desde o
// empréstimo — usado pra sinalizar equipamento parado há muito tempo, já
// que o cadastro de Equipamentos não tinha nenhum campo de data.
function diasEmprestado(criadoEm){
  if(!criadoEm || typeof criadoEm.toDate !== 'function') return null;
  const hoje = new Date();
  return Math.max(0, Math.floor((hoje - criadoEm.toDate()) / (1000*60*60*24)));
}

  const entregues = equipCache.filter(e=>normalizarTexto(e.devolucao)==='ENTREGUE').length;

      <table>
        <thead><tr><th>Nome</th><th>Equipamento</th><th>Contato</th><th>Emprestado há</th><th>Status</th>${somenteLeitura()?'':'<th></th>'}</tr></thead>
        <tbody>
          ${equipCache.map(e=>{
            const emUsoAgora = normalizarTexto(e.devolucao)==='USANDO';

// ============================================================
// AGENDA — estilo Google Agenda: calendário do mês à esquerda,
// compromissos do dia selecionado à direita.
// ============================================================
let agendaCache = [];
let agendaMes = new Date().getMonth();
let agendaAno = new Date().getFullYear();
let agendaDiaSelecionado = new Date().getDate();

async function renderAgenda(){
  const c = document.getElementById('conteudo');
  c.innerHTML = '<div class="topo-pagina"><div><h2>Agenda</h2><div class="barra-assinatura"></div></div></div><p style="color:#9FB3A6;">Carregando...</p>';
  agendaCache = await listarColecao('agendaEventos');
  agendaMes = new Date().getMonth();
  agendaAno = new Date().getFullYear();
  agendaDiaSelecionado = new Date().getDate();
  desenharAgenda();
}

function mudarMesAgenda(delta){
  agendaMes += delta;
  if(agendaMes < 0){ agendaMes = 11; agendaAno--; }
  if(agendaMes > 11){ agendaMes = 0; agendaAno++; }
  agendaDiaSelecionado = null;
  desenharAgenda();
}

function irParaHojeAgenda(){
  const hoje = new Date();
  agendaMes = hoje.getMonth();
  agendaAno = hoje.getFullYear();
  agendaDiaSelecionado = hoje.getDate();
  desenharAgenda();
}

function chaveDataAgenda(dia, mes, ano){
  return String(dia).padStart(2,'0')+'/'+String(mes+1).padStart(2,'0')+'/'+ano;
}

function eventosDoDia(dia, mes, ano){
  const chave = chaveDataAgenda(dia, mes, ano);
  return agendaCache.filter(ev => ev.data === chave).sort((a,b)=>String(a.horaInicio||'').localeCompare(String(b.horaInicio||'')));
}

function desenharAgenda(){
  const c = document.getElementById('conteudo');
  const hoje = new Date();
  const primeiroDia = new Date(agendaAno, agendaMes, 1).getDay();
  const totalDias = new Date(agendaAno, agendaMes+1, 0).getDate();
  const nomeMes = new Intl.DateTimeFormat('pt-BR', { month:'long', year:'numeric' }).format(new Date(agendaAno, agendaMes, 1));

  let celulas = '';
  for(let i=0;i<primeiroDia;i++) celulas += '<div class="dia-agenda vazio"></div>';
  for(let dia=1; dia<=totalDias; dia++){
    const ehHoje = dia===hoje.getDate() && agendaMes===hoje.getMonth() && agendaAno===hoje.getFullYear();
    const ehSelecionado = dia===agendaDiaSelecionado;
    const evs = eventosDoDia(dia, agendaMes, agendaAno);
    celulas += `
      <div class="dia-agenda ${ehHoje?'hoje':''} ${ehSelecionado?'selecionado':''}" onclick="window.selecionarDiaAgenda(${dia})">
        <div class="num-dia-agenda">${dia}</div>
        ${evs.length ? `<div class="mini-eventos-dia">
          <div class="mini-evento-texto" title="${(evs[0].titulo||'').replace(/"/g,'&quot;')}">${evs[0].titulo||''}</div>
          ${evs.length>1 ? `<span class="mais-eventos-mini">+${evs.length-1} compromisso${evs.length>2?'s':''}</span>` : ''}
        </div>` : ''}
      </div>`;
  }

  const botaoNovo = somenteLeitura() ? '' : `<button class="btn-primario" onclick="window.abrirNovoCompromisso()">+ Novo Compromisso</button>`;

  c.innerHTML = `
    <div class="topo-pagina">
      <div><h2>Agenda</h2><div class="barra-assinatura"></div></div>
      ${botaoNovo}
    </div>
    <div class="agenda-layout">
      <div class="agenda-box">
        <div class="agenda-nav">
          <button onclick="window.irParaHojeAgenda()" class="btn-secundario" style="padding:7px 12px;">Hoje</button>
          <div style="display:flex;align-items:center;gap:14px;">
            <button class="btn-nav-mes" onclick="window.mudarMesAgenda(-1)">‹</button>
            <b class="mes-atual-agenda">${nomeMes.charAt(0).toUpperCase()+nomeMes.slice(1)}</b>
            <button class="btn-nav-mes" onclick="window.mudarMesAgenda(1)">›</button>
          </div>
        </div>
        <div class="agenda-cabecalho-dias">
          <div>DOM</div><div>SEG</div><div>TER</div><div>QUA</div><div>QUI</div><div>SEX</div><div>SÁB</div>
        </div>
        <div class="agenda-grade">${celulas}</div>
      </div>

      <div class="agenda-box agenda-lateral">
        <h3 id="tituloDiaAgenda">Compromissos</h3>
        <div id="listaEventosDia" class="lista-eventos-dia"></div>
      </div>
    </div>
  `;
  atualizarPainelDiaAgenda();
}

function atualizarPainelDiaAgenda(){
  const titulo = document.getElementById('tituloDiaAgenda');
  const lista = document.getElementById('listaEventosDia');
  if(!titulo || !lista) return;

  if(!agendaDiaSelecionado){
    titulo.innerText = 'Compromissos';
    lista.innerHTML = '<p style="color:#5E7368;font-size:12.5px;">Clique num dia do calendário pra ver os compromissos.</p>';
    return;
  }

  const dataObj = new Date(agendaAno, agendaMes, agendaDiaSelecionado);
  const rotulo = new Intl.DateTimeFormat('pt-BR', { weekday:'long', day:'2-digit', month:'long' }).format(dataObj);
  titulo.innerText = rotulo.charAt(0).toUpperCase()+rotulo.slice(1);

  const evs = eventosDoDia(agendaDiaSelecionado, agendaMes, agendaAno);
  if(!evs.length){
    lista.innerHTML = '<p style="color:#5E7368;font-size:12.5px;">Nenhum compromisso neste dia.</p>';
    return;
  }
  lista.innerHTML = evs.map(ev => `
    <div class="item-evento-dia" onclick='window.abrirModalEvento(${JSON.stringify(ev)})'>
      <div class="faixa-evento"></div>
      <div class="corpo-evento-dia">
        <div class="hora-evento-dia">${ev.horaInicio || 'Sem horário'}</div>
        <div class="titulo-evento-dia">${ev.titulo||''}</div>
        ${ev.descricao ? `<div class="desc-evento-dia">${ev.descricao}</div>` : ''}
      </div>
    </div>
  `).join('');
}

window.selecionarDiaAgenda = function(dia){
  agendaDiaSelecionado = dia;
  document.querySelectorAll('.dia-agenda').forEach(el=>el.classList.remove('selecionado'));
  const dias = document.querySelectorAll('.dia-agenda:not(.vazio)');
  if(dias[dia-1]) dias[dia-1].classList.add('selecionado');
  atualizarPainelDiaAgenda();
};
window.mudarMesAgenda = mudarMesAgenda;
window.irParaHojeAgenda = irParaHojeAgenda;

// Lê o dia selecionado NA HORA do clique (não no momento em que a tela foi
// desenhada) — corrige o bug de sempre abrir com a data de hoje mesmo depois
// de clicar em outro dia do calendário.
window.abrirNovoCompromisso = function(){
  const dataPreSelecionada = agendaDiaSelecionado ? chaveDataAgenda(agendaDiaSelecionado, agendaMes, agendaAno) : '';

};

function badgeIntencao(valor){
  const mapa = { SIM:'✅ Vai votar', INDECISO:'🤔 Indeciso', NAO:'❌ Não vai votar' };
  if(!valor || !mapa[valor]) return '<span class="badge-intencao vazio">Não informado</span>';
  return `<span class="badge-intencao ${valor}">${mapa[valor]}</span>`;
}

let chartsPessoasAtivos = [];
let pessoasFiltradasAtual = [];

function desenharPessoas(filtroTexto){
  const c = document.getElementById('conteudo');
  const botaoNovo = somenteLeitura() ? '' : '<button class="btn-primario" onclick="window.abrirModalPessoa()">+ Nova Pessoa</button>';

  chartsPessoasAtivos = [];

  const aniversariantesHoje = pessoasCache.filter(p=>{
    const dm = diaEMesNascimento(p.dataNascimento);
    return dm && dm.dia===hoje.getDate() && dm.mes===hoje.getMonth()+1;
  }).length;
  const aniversariantesMes = pessoasCache.filter(p=>{
    const dm = diaEMesNascimento(p.dataNascimento);
    return dm && dm.mes===hoje.getMonth()+1;
  }).length;

      normalizarTexto(p.bairro).includes(f) ||

      <div class="cabecalho-titulo">
        <h2>Cadastro de <span class="destaque">Pessoas</span></h2>

        ${kpiMini('rgba(22,163,74,.18)','#3FD17D','👤',total,'Total')}

        ${kpiMini('rgba(168,85,247,.18)','#C084FC','📆',aniversariantesMes,'Aniversário no Mês')}
        ${kpiMini('rgba(59,130,246,.18)','#60A5FA','📍',comEndereco,'Com Bairro')}
      </div>
      ${botaoNovo}
    </div>

      <div class="agenda-box" style="height:auto;">
        <h3 style="margin:0 0 4px;font-size:15px;color:#fff;">🗳️ Estatística de Intenção de Voto</h3>
        <p style="font-size:11px;color:var(--texto-suave);margin:0 0 12px;">Estimativa baseada só em quem já foi marcado — dado sensível, uso interno.</p>
        <div style="position:relative;height:190px;">${total ? '<canvas id="chartIntencaoVoto"></canvas>' : '<p style="color:#5E7368;font-size:12px;">Cadastre pessoas pra ver a estatística.</p>'}</div>
      </div>
      <div class="agenda-box" style="height:auto;display:flex;flex-direction:column;justify-content:center;gap:12px;">
        <div class="kpi-mini" style="min-width:0;"><div class="icone-kpi-mini" style="background:rgba(22,163,74,.18);color:#3FD17D;">✅</div><div><div class="num-kpi-mini">${votosSim}</div><div class="rot-kpi-mini">Vão Votar</div></div></div>
        <div class="kpi-mini" style="min-width:0;"><div class="icone-kpi-mini" style="background:rgba(232,174,0,.18);color:#F2C43D;">🤔</div><div><div class="num-kpi-mini">${votosIndeciso}</div><div class="rot-kpi-mini">Indecisos</div></div></div>
        <div class="kpi-mini" style="min-width:0;"><div class="icone-kpi-mini" style="background:rgba(229,72,77,.18);color:#FF8E92;">❌</div><div><div class="num-kpi-mini">${votosNao}</div><div class="rot-kpi-mini">Não Vão Votar</div></div></div>
      </div>
    </div>

    <div class="barra-acoes">
      <input id="fTextoPessoa" placeholder="Buscar por nome, bairro, CPF, RG ou título..." value="${filtroTexto||''}" oninput="window.filtrarPessoas()">

      <button class="btn-secundario" onclick="window.exportarPessoasCSV()">⬇ Exportar CSV</button>
    </div>
    <div class="tabela-box">
      <table>
        <thead><tr><th>Nome</th><th>CPF</th><th>Telefone</th><th>Bairro</th><th>Nascimento</th><th>Intenção de Voto</th>${somenteLeitura()?'':'<th></th>'}</tr></thead>
        <tbody>
          ${lista.map(p=>`
            <tr>
              <td>${p.nome||''}</td><td>${p.cpf||'-'}</td><td>${linkWhatsapp(p.telefone)}</td><td>${p.bairro||''}</td><td>${p.dataNascimento||'-'}</td>
              <td>${badgeIntencao(p.intencaoVoto)}</td>
              ${somenteLeitura() ? '' : `<td><div class="grupo-acoes-tabela"><button class="btn-secundario" onclick='window.abrirModalPessoa(${JSON.stringify(p)})'>Editar</button><button class="btn-perigo" onclick="window.excluirPessoa('${p.id}')">Excluir</button></div></td>`}
            </tr>`).join('') || `<tr><td colspan="7" style="text-align:center;color:#5E7368;padding:20px;">${filtroTexto ? 'Nenhum resultado.' : 'Nenhuma pessoa cadastrada ainda.'}</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  if(total){
    chartsPessoasAtivos.push(new Chart(document.getElementById('chartIntencaoVoto'), {
      type:'doughnut',
      data:{
        labels:['Vão votar','Indecisos','Não vão votar','Não informado'],
        datasets:[{ data:[votosSim, votosIndeciso, votosNao, votosNaoInformado], backgroundColor:['#3FD17D','#F2C43D','#FF6B70','#3A4A40'], borderWidth:0 }]
      },
      options:{
        responsive:true, maintainAspectRatio:false, cutout:'60%',
        plugins:{ legend:{ position:'bottom', labels:{ color:'#9FB3A6', boxWidth:9, boxHeight:9, padding:12, font:{size:10,weight:'600'} } } }
      }
    }));
  }
}

// Marca visualmente qual botão de intenção de voto está selecionado (toggle:
// clicar de novo no mesmo desmarca, deixando "não informado").
window.marcarIntencaoVoto = function(valor, apenasAplicarSemAlternar){
  const campoOculto = document.getElementById('p_intencao');
  if(!campoOculto) return;
  const jaEstavaMarcado = campoOculto.value === valor;
  const novoValor = (apenasAplicarSemAlternar || !jaEstavaMarcado) ? valor : '';
  campoOculto.value = novoValor;
  document.querySelectorAll('.opcao-intencao').forEach(btn=>{
    btn.classList.toggle('selecionada', btn.dataset.valor === novoValor && novoValor !== '');
  });
};

window.excluirPessoa = async function(id){
  if(!(await confirmarAcao('Excluir esta pessoa do cadastro? Essa ação não pode ser desfeita. Atendimentos/transportes/equipamentos já registrados NÃO são apagados.', 'Excluir'))) return;
  try{
    await deleteDoc(doc(db,'pessoas',id));
    pessoasCache = await listarColecaoSimples('pessoas');
    if(paginaAtual==='votantes') desenharVotantes(); else desenharPessoas();
  }catch(erro){
    mostrarToast('Não foi possível excluir. ('+erro.message+')', 'erro');
  }
};

window.salvarPessoa = async function(id){
  const dados = {
    nome: document.getElementById('p_nome').value.trim(),
    telefone: document.getElementById('p_telefone').value.trim(),
    dataNascimento: document.getElementById('p_nascimento').value.trim(),
    rg: document.getElementById('p_rg').value.trim(),
    cpf: document.getElementById('p_cpf').value.trim(),
    tituloEleitor: document.getElementById('p_titulo').value.trim(),
    bairro: document.getElementById('p_bairro').value.trim(),

// Busca rápida de pessoa cadastrada — usada nos formulários de Atendimento,
// Transporte e Equipamento pra identificar alguém sem digitar tudo de novo.
// Busca por nome, CPF, RG, título de eleitor ou telefone.
function campoBuscaPessoa(prefixo){
  return `
    <div class="campo-2 busca-pessoa-wrap" style="position:relative;">
      <label>Buscar pessoa já cadastrada (nome, CPF, RG, título ou telefone)</label>
      <input id="${prefixo}_buscaPessoa" placeholder="Comece a digitar..." autocomplete="off">
      <div id="${prefixo}_resultadosPessoa" class="resultados-busca-pessoa hidden"></div>
    </div>`;
}

function ligarBuscaPessoa(prefixo, mapaCampos){
  const input = document.getElementById(prefixo+'_buscaPessoa');
  const resultados = document.getElementById(prefixo+'_resultadosPessoa');
  if(!input || !resultados) return;

  input.addEventListener('input', ()=>{
    const termo = normalizarTexto(input.value);
    const termoNumeros = input.value.replace(/\D/g,'');
    if(termo.length < 2){ resultados.classList.add('hidden'); resultados.innerHTML=''; return; }

    const encontrados = pessoasCache.filter(p=>
      normalizarTexto(p.nome).includes(termo) ||
      (p.cpf && normalizarTexto(p.cpf).includes(termo)) ||
      (p.rg && normalizarTexto(p.rg).includes(termo)) ||
      (p.tituloEleitor && normalizarTexto(p.tituloEleitor).includes(termo)) ||
      (termoNumeros.length>=3 && String(p.telefone||'').replace(/\D/g,'').includes(termoNumeros))
    ).slice(0,6);

    if(!encontrados.length){
      resultados.innerHTML = '<div class="item-resultado-pessoa sem-resultado">Nenhuma pessoa encontrada. Preencha manualmente abaixo.</div>';
      resultados.classList.remove('hidden');
      return;
    }
    resultados.innerHTML = encontrados.map(p=>`
      <div class="item-resultado-pessoa" data-id="${p.id}">
        <b>${p.nome}</b>
        <span>${p.cpf ? 'CPF '+p.cpf+' · ' : ''}${p.telefone||'sem telefone'}</span>
      </div>`).join('');
    resultados.classList.remove('hidden');
    resultados.querySelectorAll('.item-resultado-pessoa[data-id]').forEach(el=>{
      el.onclick = ()=>{
        const pessoa = pessoasCache.find(p=>p.id===el.dataset.id);
        if(!pessoa) return;
        Object.keys(mapaCampos).forEach(campoPessoa=>{
          const alvo = document.getElementById(mapaCampos[campoPessoa]);
          if(alvo && pessoa[campoPessoa]) alvo.value = pessoa[campoPessoa];
        });
        input.value = pessoa.nome;
        resultados.classList.add('hidden');
      };
    });
  });

  document.addEventListener('click', (ev)=>{
    if(!ev.target.closest('.busca-pessoa-wrap')) resultados.classList.add('hidden');
  }, { once:false });
}

// ============================================================
// CONFIGURAÇÕES (só ADMIN) — cadastra os tipos usados nos formulários

  desenharConfiguracoes();
}

        </div>
        <div style="display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;">
          ${tiposAtendimentoCache.map(t=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--superficie-2);border-radius:8px;">
              <span style="font-size:12.5px;">${t.nome}</span>
              <button class="btn-secundario" style="padding:5px 10px;font-size:11px;" onclick="window.excluirTipoAtendimento('${t.id}')">Excluir</button>
            </div>`).join('') || '<p style="color:#5E7368;font-size:12px;">Nenhum tipo cadastrado ainda.</p>'}
        </div>
      </div>

      <div class="agenda-box" style="height:auto;">
        <h3 style="margin:0 0 4px;font-size:15px;color:#fff;">Tipos de Equipamento</h3>
        <p style="font-size:11.5px;color:var(--texto-suave);margin:0 0 14px;">Aparecem no formulário de novo empréstimo.</p>
        <div style="display:flex;gap:8px;margin-bottom:14px;">
          <input id="novoTipoEquipamento" placeholder="Ex: CADEIRA DE RODAS" style="flex:1;padding:10px 12px;border:1.5px solid var(--borda);border-radius:var(--raio-s);background:var(--preto-suave);color:var(--texto);font-family:inherit;">

        </div>
        <div style="display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;">
          ${tiposEquipamentoCache.map(t=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--superficie-2);border-radius:8px;">
              <span style="font-size:12.5px;">${t.nome}</span>
              <button class="btn-secundario" style="padding:5px 10px;font-size:11px;" onclick="window.excluirTipoEquipamento('${t.id}')">Excluir</button>
            </div>`).join('') || '<p style="color:#5E7368;font-size:12px;">Nenhum tipo cadastrado ainda.</p>'}
        </div>
      </div>

    </div>
  `;
}

window.adicionarTipoAtendimento = async function(){
  const campo = document.getElementById('novoTipoAtendimento');

  try{
    await addDoc(collection(db,'tiposAtendimento'), { nome, criadoEm: serverTimestamp() });
    campo.value = '';
    await carregarTiposConfiguraveis();
    desenharConfiguracoes();
  }catch(erro){
    mostrarToast('Não foi possível adicionar. Só ADMIN pode cadastrar tipos. ('+erro.message+')', 'erro');
  }
};
