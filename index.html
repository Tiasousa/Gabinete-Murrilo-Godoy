function abrirMaisAgenda(iso,evt){
  evt?.stopPropagation();
  fecharPopupDiaAgenda();

  const evs=eventosDoDiaISO(iso);
  if(!evs.length) return;

  const [y,m,d]=iso.split('-').map(Number);
  const data=new Date(y,m-1,d,12,0,0,0);
  const semana=new Intl.DateTimeFormat('pt-BR',{weekday:'short'}).format(data).replace('.','').toUpperCase();

  const pop=document.createElement('div');
  pop.className='gcal-day-popup';

  pop.innerHTML=`
    <div class="gcal-day-popup-head">
      <div>
        <div class="gcal-day-popup-weekday">${semana}</div>
        <div class="gcal-day-popup-num">${d}</div>
      </div>
      <button class="gcal-day-popup-close" onclick="fecharPopupDiaAgenda()" title="Fechar">×</button>
    </div>

    <div class="gcal-day-popup-list">
      ${evs.map(ev=>{
        const hora=ev.hora?escapar(ev.hora):'';
        const titulo=escapar(ev.titulo||'Compromisso');
        return `<div class="gcal-event ${classeStatusAgenda(ev.status)} ${ev._origemGoogle?'gcal-google-event':''}"
                     onclick='event.stopPropagation();fecharPopupDiaAgenda();abrirModalAgenda(${escapeAttrJson(ev)})'>
                  ${hora?`<span class="gcal-event-time">${hora}</span>`:''}
                  <span class="gcal-event-title">${titulo}</span>
                </div>`;
      }).join('')}
    </div>`;

  document.body.appendChild(pop);

  const alvo=evt?.currentTarget || evt?.target;
  const r=alvo?.getBoundingClientRect?.();
  const pr=pop.getBoundingClientRect();

  let left=(r ? r.left + (r.width/2) - (pr.width/2) : (window.innerWidth-pr.width)/2);
  let top=(r ? r.top + 18 : (window.innerHeight-pr.height)/2);

  left=Math.max(12,Math.min(left,window.innerWidth-pr.width-12));
  top=Math.max(12,Math.min(top,window.innerHeight-pr.height-12));

  pop.style.left=`${left}px`;
  pop.style.top=`${top}px`;

  setTimeout(()=>{
    document.addEventListener('mousedown', fecharPopupDiaAgendaFora, true);
    window.addEventListener('resize', fecharPopupDiaAgenda, {once:true});
  },0);
}
window.abrirMaisAgenda=abrirMaisAgenda;

function desenharAgenda(){
  fecharPopupDiaAgenda();
  const c=document.getElementById('conteudo');
  const hoje=new Date();
  hoje.setHours(12,0,0,0);
  const hojeISO=dataISOlocal(hoje);
  const selISO=dataISOlocal(agendaSelecionada);
  const nomeMes=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(agendaAno,agendaMes,1));
  const podeEditar=!somenteLeitura();

  const primeiroMes=new Date(agendaAno,agendaMes,1,12,0,0,0);
  const inicioGrade=new Date(primeiroMes);
  inicioGrade.setDate(1-primeiroMes.getDay());

  let celulas='';
  for(let i=0;i<42;i++){
    const d=new Date(inicioGrade);
    d.setDate(inicioGrade.getDate()+i);
    d.setHours(12,0,0,0);
    const iso=dataISOlocal(d);
    const fora=d.getMonth()!==agendaMes;
    const evs=eventosDoDiaISO(iso);
    const limite=limiteEventosPorDia();
    const visiveis=evs.slice(0,limite);

    const eventosHtml=visiveis.map(ev=>{
      const hora=ev.hora ? escapar(ev.hora) : '';
      const titulo=escapar(ev.titulo||'Compromisso');
      return `<div class="gcal-event ${classeStatusAgenda(ev.status)} ${ev._origemGoogle?'gcal-google-event':''}"
                   title="${hora?hora+' ':''}${titulo}"
                   onclick='event.stopPropagation();abrirModalAgenda(${escapeAttrJson(ev)})'>
                ${hora?`<span class="gcal-event-time">${hora}</span>`:''}
                <span class="gcal-event-title">${titulo}</span>
              </div>`;
    }).join('');

    celulas+=`
      <div class="gcal-day ${fora?'outside':''} ${iso===hojeISO?'today':''} ${iso===selISO?'selected':''}"
           onclick="selecionarDiaAgenda('${iso}',true)">
        <div class="gcal-daynum">${d.getDate()}</div>
        <div class="gcal-events">
          ${eventosHtml}
          ${evs.length>limite?`<div class="gcal-more" onclick="abrirMaisAgenda('${iso}',event)">Mais ${evs.length-limite}</div>`:''}
        </div>
      </div>`;
  }

  c.innerHTML=`
    <div class="gcal-shell">
      <div class="gcal-toolbar">
        <button class="gcal-hoje" onclick="irParaHojeAgenda()">Hoje</button>
        <button class="gcal-navbtn" title="Mês anterior" onclick="mudarMesAgenda(-1)">‹</button>
        <button class="gcal-navbtn" title="Próximo mês" onclick="mudarMesAgenda(1)">›</button>
        <div class="gcal-mes">${nomeMes.charAt(0).toUpperCase()+nomeMes.slice(1)}</div>
        <div class="gcal-spacer"></div>
        <button id="btnGoogleAgenda" class="gcal-google-btn ${googleTokenValido()?'conectado':''}" onclick="conectarGoogleAgenda()">
          <span class="gcal-google-dot"></span>${googleTokenValido()?'Google conectado':'Conectar Google'}
        </button>
        <button id="btnSyncGoogleAgenda" class="gcal-sync-btn" title="Atualizar Google Agenda" onclick="carregarEventosGoogleMes(true)" ${googleTokenValido()?'':'disabled'}>↻</button>
        ${podeEditar?'<button class="gcal-novo" onclick="abrirModalAgenda()">＋ Compromisso</button>':''}
        <button class="gcal-view">Mês ▾</button>
      </div>

      <div class="gcal-weekdays">
        <div>DOM.</div><div>SEG.</div><div>TER.</div><div>QUA.</div><div>QUI.</div><div>SEX.</div><div>SÁB.</div>
      </div>

      <div class="gcal-grid">${celulas}</div>
    </div>`;
}

function selecionarDiaAgenda(iso,abrirNovo=false){
  const [y,m,d]=iso.split('-').map(Number);
  agendaAno=y;
  agendaMes=m-1;
  agendaSelecionada=new Date(y,m-1,d,12,0,0,0);
  desenharAgenda();

async function mudarMesAgenda(delta){
  agendaMes+=delta;
  if(agendaMes<0){agendaMes=11;agendaAno--;}
  if(agendaMes>11){agendaMes=0;agendaAno++;}
  agendaSelecionada=new Date(agendaAno,agendaMes,1,12,0,0,0);
  desenharAgenda();
  if(googleTokenValido()) await carregarEventosGoogleMes(true);
}

function formatarHorarioMurillo(input){
  let digitos=input.value.replace(/\D/g,'').slice(0,4);
  if(digitos.length>=2){
    let hh=digitos.slice(0,2);
    if(Number(hh)>23) hh='23';
    let mm=digitos.slice(2,4);
    if(mm.length===2 && Number(mm)>59) mm='59';
    input.value=digitos.length>2?hh+':'+mm:hh;
  }else{
    input.value=digitos;
  }
}

async function salvarAgenda(docId,googleEventId='',origemGoogle=false){
  const b=document.getElementById('btnSalvarAgenda');
  b.disabled=true;b.innerText='Salvando...';

  const dados={
    titulo:document.getElementById('ag_titulo').value.trim(),
    data:document.getElementById('ag_data').value,
    hora:document.getElementById('ag_hora').value,
    horaFim:document.getElementById('ag_horaFim').value,
    tipo:document.getElementById('ag_tipo').value,
    local:document.getElementById('ag_local').value.trim(),
    status:document.getElementById('ag_status').value,
    lembrete:document.getElementById('ag_lembrete').value==='1',
    observacoes:document.getElementById('ag_obs').value.trim(),
    ultimaEdicaoPor:USUARIO.nome,
    ultimaEdicaoData:new Date().toLocaleString('pt-BR')
  };

  if(!dados.titulo||!dados.data){
    alert('Informe pelo menos o título e a data.');
    b.disabled=false;b.innerText='Salvar';
    return;
  }

  try{
    let idGoogle=googleEventId||'';

    // Evento que nasceu no Google: atualiza somente o Google.
    if(origemGoogle){
      if(!googleTokenValido()) throw new Error('Conecte o Google Agenda para editar este compromisso.');
      await atualizarEventoGoogle(idGoogle,dados);
    }else{
      // Evento do app: quando Google estiver conectado, cria/atualiza também no Calendar.
      if(googleTokenValido()){
        if(idGoogle){
          await atualizarEventoGoogle(idGoogle,dados);
        }else{
          const criado=await criarEventoGoogle(dados);
          idGoogle=criado?.id||'';
        }
      }

      const dadosFirestore={...dados};
      if(idGoogle) dadosFirestore.googleEventId=idGoogle;

      if(docId){
        await updateDoc(doc(db,'agendaEventos',docId),dadosFirestore);
      }else{
        dadosFirestore.criadoPor=USUARIO.nome;
        await addDoc(collection(db,'agendaEventos'),dadosFirestore);
      }
    }

    document.querySelector('.gcal-modal-bg, .modal-fundo')?.remove();

    const [y,m,d]=dados.data.split('-').map(Number);
    agendaAno=y;agendaMes=m-1;agendaSelecionada=new Date(y,m-1,d,12,0,0,0);agendaInicializada=true;

    const snap=await getDocs(collection(db,'agendaEventos'));
    agendaEventosCache=snap.docs.map(x=>({_docId:x.id,...x.data()}));

    if(googleTokenValido()) await carregarEventosGoogleMes(true);
    else desenharAgenda();

    atualizarBadgeNotificacoes();
  }catch(e){
    console.error(e);
    alert('Não foi possível salvar: '+e.message);
    b.disabled=false;b.innerText='Salvar';
  }
}

async function excluirAgenda(id,googleEventId='',origemGoogle=false){
  if(!confirm('Excluir este compromisso?')) return;

  try{
    if(googleEventId){
      if(!googleTokenValido()){
        throw new Error('Conecte o Google Agenda para excluir este compromisso também do Google.');
      }
      await excluirEventoGoogle(googleEventId);
    }

    if(id && !origemGoogle){
      await deleteDoc(doc(db,'agendaEventos',id));
    }

    document.querySelector('.gcal-modal-bg, .modal-fundo')?.remove();

    const snap=await getDocs(collection(db,'agendaEventos'));
    agendaEventosCache=snap.docs.map(x=>({_docId:x.id,...x.data()}));

    if(googleTokenValido()) await carregarEventosGoogleMes(true);
    else desenharAgenda();

    atualizarBadgeNotificacoes();
  }catch(e){
    console.error(e);
    alert('Não foi possível excluir: '+e.message);
  }
}

function desenharPessoasMurillo(filtro=''){
  const c=document.getElementById('conteudo');
  const podeEditar=!somenteLeitura();
  const hoje=new Date();
  const total=pessoasCache.length;
  const niverHoje=pessoasCache.filter(p=>{const dm=diaEMesNascimento(p.dataNascimento);return dm&&dm.dia===hoje.getDate()&&dm.mes===hoje.getMonth()+1}).length;
  const niverMes=pessoasCache.filter(p=>{const dm=diaEMesNascimento(p.dataNascimento);return dm&&dm.mes===hoje.getMonth()+1}).length;
  const comBairro=pessoasCache.filter(p=>String(p.bairro||'').trim()).length;
  const f=norm(filtro);
  const lista=!f?pessoasCache:pessoasCache.filter(p=>
    norm(p.nome).includes(f)||norm(p.bairro).includes(f)||norm(p.cpf).includes(f)||norm(p.rg).includes(f)||norm(p.tituloEleitor).includes(f)||norm(p.telefone).includes(f)
  );

  c.innerHTML=`
    <div class="topo-pagina-atend">
      <h2>Cadastro de <span style="color:var(--acento);">Pessoas</span></h2>
      <div class="kpis-faixa">
        <div class="kpi-faixa-item"><div class="num">${total}</div><div class="rot">Total</div></div>
        <div class="kpi-faixa-item"><div class="num">${niverHoje}</div><div class="rot">Aniversário hoje</div></div>
        <div class="kpi-faixa-item"><div class="num">${niverMes}</div><div class="rot">Aniversários mês</div></div>
        <div class="kpi-faixa-item"><div class="num">${comBairro}</div><div class="rot">Com bairro</div></div>
      </div>
      ${podeEditar?'<button class="btn-primario" onclick="abrirModalPessoaMurillo()">+ Nova Pessoa</button>':''}
    </div>
    ${somenteLeitura()?'<div class="aviso-perfil">Seu perfil possui acesso para visualização.</div>':''}
    <div class="barra-acoes" style="grid-template-columns:minmax(220px,1fr) 120px;">
      <input id="fPessoaMurillo" placeholder="Buscar nome, telefone, bairro, CPF, RG ou título..." value="${escapar(filtro)}" oninput="filtrarPessoasMurillo()">
      <button class="btn-secundario" onclick="window.irPara('pessoas')">↻ Atualizar</button>
    </div>
    <div class="modulo-table-box">
      <table class="modulo-table">
        <thead><tr><th>Nome</th><th>Telefone</th><th>CPF</th><th>RG</th><th>Título</th><th>Bairro</th><th>Nascimento</th>${podeEditar?'<th>Ação</th>':''}</tr></thead>
        <tbody>
          ${lista.map(p=>`
            <tr>
              <td>${escapar(p.nome||'')}</td><td>${linkWhatsapp(p.telefone)}</td><td>${escapar(p.cpf||'-')}</td>
              <td>${escapar(p.rg||'-')}</td><td>${escapar(p.tituloEleitor||'-')}</td><td>${escapar(p.bairro||'')}</td><td>${escapar(p.dataNascimento||'-')}</td>
              ${podeEditar?`<td><div class="acoes-linha"><button class="btn-secundario btn-tabela" onclick="abrirModalPessoaMurilloPorId('${p._docId}')">Editar</button><button class="btn-secundario btn-tabela" style="color:#F26D6D;border-color:#4A2430;" onclick="excluirPessoaMurillo('${p._docId}')">Excluir</button></div></td>`:''}
            </tr>`).join('') || `<tr><td colspan="8" style="text-align:center;color:var(--texto-fraco);padding:24px;">Nenhuma pessoa encontrada.</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

async function carregarColecaoRelatorio(nome){
  try{
    const snap=await getDocs(collection(db,nome));
    return { nome, dados:snap.docs.map(d=>({_docId:d.id,...d.data()})), erro:null };

window.RENDERIZADORES.relatorios = async function(){
  const c=document.getElementById('conteudo');
  c.innerHTML='<div class="carregando-tela">Carregando relatórios...</div>';
  try{
    const resultados=await Promise.all([
      carregarColecaoRelatorio('atendimentos'),
      carregarColecaoRelatorio('transportes'),
      carregarColecaoRelatorio('equipamentos'),
      carregarColecaoRelatorio('pessoas'),
      carregarColecaoRelatorio('eventos'),
      carregarColecaoRelatorio('agendaEventos')
    ]);

    const mapa=Object.fromEntries(resultados.map(r=>[r.nome,r]));
    const atend=mapa.atendimentos.dados;
    const transp=mapa.transportes.dados;
    const equip=mapa.equipamentos.dados;
    const pessoas=mapa.pessoas.dados;
    const eventos=mapa.eventos.dados;
    const agenda=mapa.agendaEventos.dados;
    const colecoesComErro=resultados.filter(r=>r.erro).map(r=>r.nome);

    const concluidos=atend.filter(x=>norm(x.status)==='CONCLUIDO').length;
    const analise=atend.filter(x=>norm(x.status)==='EM ANALISE').length;
    const confirmados=transp.filter(x=>norm(x.confirmado)==='SIM').length;
    const emUso=equip.filter(x=>norm(x.devolucao)==='USANDO').length;

    const porTipo={};
    atend.forEach(x=>{const k=x.tipoAtendimento||'Sem tipo';porTipo[k]=(porTipo[k]||0)+1});
    const topTipos=Object.entries(porTipo).sort((a,b)=>b[1]-a[1]).slice(0,8);

    c.innerHTML=`
      <div class="topo-pagina">
        <div><h2>Relatórios <span style="color:var(--acento);">Gerais</span></h2><div style="width:64px;height:3px;border-radius:4px;background:var(--acento);margin-top:7px;"></div></div>
        <button class="btn-secundario" onclick="window.irPara('relatorios')">↻ Atualizar</button>
      </div>
      ${colecoesComErro.length ? `<div class="aviso-perfil" style="margin-bottom:14px;">Alguns dados não puderam ser lidos agora: <b>${colecoesComErro.map(escapar).join(', ')}</b>. Os demais indicadores continuam disponíveis.</div>` : ''}
      <div class="relatorio-grid">
        <div class="relatorio-card"><b>${atend.length}</b><span>Atendimentos</span></div>
        <div class="relatorio-card"><b>${pessoas.length}</b><span>Pessoas cadastradas</span></div>
        <div class="relatorio-card"><b>${transp.length}</b><span>Transportes</span></div>
        <div class="relatorio-card"><b>${equip.length}</b><span>Equipamentos / empréstimos</span></div>
        <div class="relatorio-card"><b>${eventos.length}</b><span>Eventos</span></div>
        <div class="relatorio-card"><b>${agenda.length}</b><span>Compromissos agenda</span></div>
        <div class="relatorio-card"><b>${concluidos}</b><span>Atendimentos concluídos</span></div>
        <div class="relatorio-card"><b>${analise}</b><span>Em análise</span></div>
      </div>
      <div class="relatorio-secao">
        <div class="painel-box">
          <h3 style="margin-top:0">Resumo operacional</h3>
          <div class="dash-lista">
            <div class="dash-lista-item"><b>Transportes confirmados</b><span></span><strong>${confirmados}</strong></div>
            <div class="dash-lista-item"><b>Equipamentos em uso</b><span></span><strong>${emUso}</strong></div>
            <div class="dash-lista-item"><b>Taxa de conclusão</b><span></span><strong>${atend.length?Math.round(concluidos/atend.length*100):0}%</strong></div>
          </div>
        </div>
        <div class="painel-box">
          <h3 style="margin-top:0">Atendimentos por tipo</h3>
          <div class="dash-lista">
            ${topTipos.length?topTipos.map(([nome,qtd])=>`<div class="dash-lista-item"><b>${escapar(nome)}</b><span></span><strong>${qtd}</strong></div>`).join(''):'<div class="dash-vazio">Nenhum atendimento cadastrado.</div>'}
          </div>
        </div>
      </div>`;
  }catch(e){
    c.innerHTML='<div class="painel-box">Não foi possível carregar Relatórios. '+escapar(e.message||e)+'</div>';
  }
};

async function excluirTipoEquipamentoAdmin(id){
  if(!USUARIO || norm(USUARIO.cargo) !== 'ADMIN') return;
  if(!confirm('Excluir este tipo? Os empréstimos já cadastrados não serão apagados.')) return;

  try{
    await deleteDoc(doc(db,'tiposEquipamento',id));
    await carregarConfiguraveis();
    desenharConfiguracoesAdmin();
  }catch(e){
    alert('Não foi possível excluir. (' + e.message + ')');
  }
}
window.excluirTipoEquipamentoAdmin = excluirTipoEquipamentoAdmin;

let usuariosAdminCache = [];

window.RENDERIZADORES.usuarios = async function(){
  if(!USUARIO || norm(USUARIO.cargo) !== 'ADMIN'){
    document.getElementById('conteudo').innerHTML =
      '<div class="topo-pagina"><h2>Acesso restrito</h2></div><div class="admin-restrito">Esta área é exclusiva do administrador.</div>';
    return;
  }

  const c = document.getElementById('conteudo');
  c.innerHTML = '<div class="topo-pagina"><h2>Controle de <span style="color:var(--acento);">Usuários</span></h2></div><div class="carregando-tela">Carregando...</div>';

  try{
    const snap = await getDocs(collection(db,'usuarios'));
    usuariosAdminCache = snap.docs
      .map(d => ({ _docId:d.id, ...d.data() }))
      .sort((a,b) => String(a.nome || '').localeCompare(String(b.nome || '')));
    desenharUsuariosAdmin();
  }catch(e){
    c.innerHTML = '<div class="painel-box">Não foi possível carregar os usuários. ' + escapar(e.message || e) + '</div>';
  }
};

function desenharUsuariosAdmin(){
  const c = document.getElementById('conteudo');

  c.innerHTML = `
    <div class="topo-pagina">
      <div>
        <h2>Controle de <span style="color:var(--acento);">Usuários</span></h2>
        <div style="width:64px;height:3px;border-radius:4px;background:var(--acento);margin-top:7px;"></div>
      </div>
      <button class="btn-primario" onclick="abrirModalUsuarioAdmin()">+ Novo Perfil</button>
    </div>

    <div class="aviso-perfil">
      Para criar um LOGIN novo (e-mail e senha), use Firebase Console → Authentication → Adicionar usuário.
      Depois volte aqui, clique em “+ Novo Perfil” e cole o UID gerado pelo Firebase.
    </div>

    <div class="admin-table-box">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Cargo</th>
            <th>Status</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody>
          ${usuariosAdminCache.map(u => `
            <tr>
              <td>${escapar(u.nome || '')}</td>
              <td>${escapar(u.email || '')}</td>
              <td>${escapar(rotuloCargo(norm(u.cargo)))}</td>
              <td>${u.ativo === false
                ? '<span class="badge badge-vermelho">BLOQUEADO</span>'
                : '<span class="badge badge-verde">ATIVO</span>'}</td>
              <td>
                <div class="acoes-linha" style="justify-content:center;">
                  <button class="btn-secundario btn-tabela"
                    onclick="abrirModalUsuarioAdminPorId('${u._docId}')">Editar</button>
                  ${u._docId === UID ? '' : `<button class="btn-secundario btn-tabela" style="color:#F26D6D;border-color:#4A2430;" onclick="excluirUsuarioAdmin('${u._docId}')">Excluir</button>`}
                </div>
              </td>
            </tr>
          `).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--texto-fraco);padding:20px;">Nenhum perfil cadastrado.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

function abrirModalUsuarioAdminPorId(id){
  const registro = usuariosAdminCache.find(u => u._docId === id);
  abrirModalUsuarioAdmin(registro || {});
}
window.abrirModalUsuarioAdminPorId = abrirModalUsuarioAdminPorId;

function abrirModalUsuarioAdmin(registro = {}){
  if(!USUARIO || norm(USUARIO.cargo) !== 'ADMIN') return;

  const editando = !!registro._docId;
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  fundo.onclick = e => { if(e.target === fundo) fundo.remove(); };

  fundo.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <h2>${editando ? 'Editar' : 'Novo'} Perfil de Usuário</h2>

      ${!editando ? `
        <div class="aviso-perfil">
          Cole o UID do usuário criado no Firebase Authentication. Este formulário não cria senha.
        </div>
      ` : ''}

      ${!editando ? `
        <div class="campo-modal">
          <label>UID do Firebase Authentication</label>
          <input id="u_uid" placeholder="Cole o UID aqui">
        </div>
      ` : ''}

      <div class="grid-2">
        <div class="campo-modal">
          <label>Nome</label>
          <input id="u_nome" value="${escapar(registro.nome || '')}">
        </div>

        <div class="campo-modal">
          <label>E-mail</label>
          <input id="u_email" type="email" value="${escapar(registro.email || '')}" ${editando ? 'disabled' : ''}>
        </div>

        <div class="campo-modal">
          <label>Cargo</label>
          <select id="u_cargo">
            <option value="ADMIN" ${norm(registro.cargo) === 'ADMIN' ? 'selected' : ''}>Administrador</option>
            <option value="ASSESSOR" ${norm(registro.cargo) === 'ASSESSOR' ? 'selected' : ''}>Assessor</option>
            <option value="ASSESSORA" ${norm(registro.cargo) === 'ASSESSORA' ? 'selected' : ''}>Assessora</option>
            <option value="VEREADOR" ${norm(registro.cargo) === 'VEREADOR' ? 'selected' : ''}>Vereador (somente leitura)</option>
          </select>
        </div>

        <div class="campo-modal">
          <label>Status de acesso</label>
          <select id="u_ativo">
            <option value="true" ${registro.ativo !== false ? 'selected' : ''}>Ativo (libera entrada)</option>
            <option value="false" ${registro.ativo === false ? 'selected' : ''}>Bloqueado (derruba na hora)</option>
          </select>
        </div>
      </div>

      <div class="modal-acoes">
        <span></span>
        <div style="display:flex;gap:8px;">
          <button class="btn-secundario" onclick="this.closest('.modal-fundo').remove()">Cancelar</button>
          <button class="btn-primario" id="btnSalvarUsuarioAdmin"
            onclick="salvarUsuarioAdmin('${registro._docId || ''}')">Salvar</button>
        </div>
      </div>
    </div>
  `;

  document.body.appendChild(fundo);
}
window.abrirModalUsuarioAdmin = abrirModalUsuarioAdmin;

async function salvarUsuarioAdmin(id){
  if(!USUARIO || norm(USUARIO.cargo) !== 'ADMIN') return;

  const btn = document.getElementById('btnSalvarUsuarioAdmin');
  const nome = document.getElementById('u_nome').value.trim();
  const email = document.getElementById('u_email').value.trim();
  const cargo = document.getElementById('u_cargo').value;
  const ativo = document.getElementById('u_ativo').value === 'true';

  if(!nome){
    alert('Preencha o nome.');
    return;
  }

  let uidFinal = id;
  if(!uidFinal){
    uidFinal = document.getElementById('u_uid').value.trim();
    if(!uidFinal){
      alert('Cole o UID do Firebase Authentication antes de salvar.');
      return;
    }
    if(!email){
      alert('Preencha o e-mail.');
      return;
    }
  }

  if(uidFinal === UID && ativo === false){
    alert('Você não pode bloquear o seu próprio usuário enquanto está logado.');
    return;
  }

  btn.disabled = true;
  btn.innerText = 'Salvando...';

  try{
    const dados = { nome, cargo, ativo };
    if(!id) dados.email = email;

    await setDoc(doc(db,'usuarios',uidFinal), dados, { merge:true });

    document.querySelector('.modal-fundo')?.remove();
    await window.RENDERIZADORES.usuarios();
  }catch(e){
    alert('Não foi possível salvar. Só ADMIN pode editar perfis. (' + e.message + ')');
    btn.disabled = false;
    btn.innerText = 'Salvar';
  }
}
window.salvarUsuarioAdmin = salvarUsuarioAdmin;

async function excluirUsuarioAdmin(id){
  if(!USUARIO || norm(USUARIO.cargo) !== 'ADMIN') return;
  if(id === UID){ alert('Você não pode excluir o seu próprio usuário.'); return; }
  if(!confirm('Excluir este perfil? A pessoa perde acesso ao sistema na hora. (O login dela continua existindo no Firebase Authentication — se quiser remover de vez, apague também por lá.)')) return;
  try{
    await deleteDoc(doc(db,'usuarios',id));
    await window.RENDERIZADORES.usuarios();
  }catch(e){
    alert('Não foi possível excluir. (' + e.message + ')');
  }
}
window.excluirUsuarioAdmin = excluirUsuarioAdmin;

function verificarLembretesAgenda(){
  const hoje=new Date();
  const iso=dataISOlocal(hoje);
  const evs=agendaEventosCache.filter(e=>e.data===iso && e.lembrete!==false && norm(e.status)!=='CANCELADO');
  const badge=document.getElementById('notificacaoBadge');
  if(!badge) return;
  if(!evs.length){ badge.style.display='none'; return; }
  badge.textContent=String(evs.length);
  badge.style.display='flex';
}

async function atualizarBadgeNotificacoes(){
  try{
    const snap = await getDocs(collection(db,'agendaEventos'));
    agendaEventosCache = snap.docs.map(d=>({_docId:d.id,...d.data()}));
    verificarLembretesAgenda();
  }catch(e){
    console.error('Não foi possível atualizar notificações:', e);
  }
}

const sinoNotificacoes = document.querySelector('.notificacao-topo');
if (sinoNotificacoes) {
  sinoNotificacoes.style.cursor = 'pointer';
  sinoNotificacoes.onclick = () => { irPara('agenda'); };
}
