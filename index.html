<style>
  :root{
    --fundo:#070E19; --superficie:#0A1728; --superficie-sutil:#0D1D33;
    --borda:#1C2C41; --texto:#F5F8FC; --texto-suave:#B8C4D4; --texto-fraco:#7C8BA0;
    --acento:#E5272D; --verde:#22C55E; --azul:#2563EB; --amarelo:#F2B23A; --roxo:#A855F7;
    --raio-s:8px; --raio-m:12px; --raio-l:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',Arial,sans-serif;background:var(--fundo);color:var(--texto);-webkit-font-smoothing:antialiased;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ===== SPLASH (abertura) ===== */
  #telaSplash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#101F35,#070E19 60%);gap:18px;text-align:center;padding:20px;}
  .splash-caixa{width:170px;height:170px;border-radius:var(--raio-l);background:var(--superficie);border:1px solid var(--borda);display:flex;align-items:center;justify-content:center;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .splash-caixa img{width:100%;object-fit:contain;border-radius:8px;}
  .splash-titulo{font-size:22px;font-weight:900;letter-spacing:.3px;}
  .splash-titulo span{color:var(--acento);}
  .splash-sub{font-size:11.5px;color:var(--texto-fraco);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-top:-8px;}
  .splash-spin{width:30px;height:30px;border-radius:50%;border:3px solid #1C2C41;border-top-color:var(--acento);animation:girar 0.8s linear infinite;margin-top:6px;}
  @keyframes girar{to{transform:rotate(360deg);}}
  #pularSplash{color:#5C86D8;font-size:12.5px;text-decoration:underline;background:none;border:none;margin-top:4px;}

  /* ===== LOGIN ===== */
  #telaLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:24px;background:radial-gradient(circle at 50% 38%,rgba(25,61,103,.34) 0,rgba(10,23,40,.16) 28%,transparent 54%),linear-gradient(145deg,#050B14 0%,#081321 48%,#050B14 100%);}
  #telaLogin::before,#telaLogin::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none;}
  #telaLogin::before{width:520px;height:520px;left:-260px;top:-260px;background:radial-gradient(circle,rgba(229,39,45,.10),transparent 68%);}
  #telaLogin::after{width:600px;height:600px;right:-330px;bottom:-330px;background:radial-gradient(circle,rgba(37,99,235,.11),transparent 68%);}
  .card-login{position:relative;z-index:1;background:linear-gradient(145deg,rgba(13,29,51,.97),rgba(7,20,37,.98));border:1px solid rgba(93,125,164,.28);border-radius:24px;padding:34px 34px 30px;width:100%;max-width:430px;box-shadow:0 35px 90px rgba(0,0,0,.58),0 12px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05);animation:loginEntrada .55s cubic-bezier(.2,.8,.2,1) both;}
  .card-login::before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 38%,rgba(229,39,45,.18));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
  .login-logo-wrap{width:100%;max-width:270px;height:172px;margin:0 auto 20px;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 50% 48%,rgba(37,99,235,.13),rgba(7,20,37,.28) 62%,transparent 74%);perspective:800px;}
  .login-logo-wrap::after{content:"";position:absolute;width:68%;height:18px;left:16%;bottom:13px;border-radius:50%;background:rgba(0,0,0,.40);filter:blur(12px);}
  .card-login img{position:relative;z-index:1;width:88%;max-width:245px;display:block;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.48));transform:translateY(-2px) rotateX(1deg);animation:logoFlutua 4s ease-in-out infinite;}
  .login-eyebrow{text-align:center;color:#7590B5;font-size:10px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;margin-bottom:7px;}
  .card-login h1{text-align:center;font-size:19px;letter-spacing:1.2px;color:#F5F8FC;margin:0 0 5px;text-transform:uppercase;font-weight:900;}
  .card-login h1 span{color:var(--acento);text-shadow:0 0 22px rgba(229,39,45,.22);}
  .login-subtitulo{text-align:center;color:#70849F;font-size:11px;font-weight:600;letter-spacing:.5px;margin:0 0 25px;}
  .campo-login{margin-bottom:13px;position:relative;}
  .campo-login::before{position:absolute;left:15px;top:50%;transform:translateY(-50%);z-index:2;color:#7186A3;font-size:15px;pointer-events:none;}
  .campo-login.email::before{content:"✉";}
  .campo-login.senha::before{content:"●";font-size:10px;}
  .campo-login input{width:100%;padding:14px 15px 14px 42px;border-radius:11px;border:1px solid rgba(77,105,140,.38);background:linear-gradient(180deg,rgba(13,29,51,.94),rgba(10,25,44,.94));color:var(--texto);font-size:14px;outline:none;box-shadow:inset 0 1px 4px rgba(0,0,0,.22);transition:border-color .2s,box-shadow .2s,transform .2s;}
  .campo-login input::placeholder{color:#6F8096;}
  .campo-login input:focus{border-color:#456FAD;box-shadow:0 0 0 3px rgba(37,99,235,.10),inset 0 1px 4px rgba(0,0,0,.18);transform:translateY(-1px);}
  #btnEntrar{width:100%;padding:15px;border:1px solid rgba(255,104,108,.18);border-radius:11px;background:linear-gradient(180deg,#F03238 0%,#D91F26 100%);color:#fff;font-weight:900;font-size:14.5px;margin-top:7px;box-shadow:0 12px 24px rgba(229,39,45,.22),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s,filter .15s,box-shadow .15s;}
  #btnEntrar:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 15px 30px rgba(229,39,45,.28),inset 0 1px 0 rgba(255,255,255,.18);}
  #btnEntrar:active{transform:translateY(1px);box-shadow:0 6px 14px rgba(229,39,45,.20);}
  #btnEntrar:disabled{opacity:.6;cursor:default;transform:none;}
  #erroLogin{color:#FF7479;font-size:12.5px;margin-top:12px;text-align:center;min-height:16px;}
  .login-rodape{text-align:center;margin-top:13px;color:#536A87;font-size:9.5px;letter-spacing:.45px;text-transform:uppercase;font-weight:700;}
  @keyframes loginEntrada{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes logoFlutua{0%,100%{transform:translateY(-2px)}50%{transform:translateY(-7px)}}
  @media(max-width:520px){#telaLogin{padding:16px}.card-login{max-width:390px;padding:28px 22px 24px;border-radius:21px}.login-logo-wrap{height:150px;max-width:245px;margin-bottom:17px}.card-login h1{font-size:17px}.login-subtitulo{margin-bottom:21px}}
  @media(prefers-reduced-motion:reduce){.card-login,.card-login img{animation:none}}

  /* ===== APP ===== */
  #app{height:100dvh;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  .cabecalho-fixo{position:sticky;top:0;z-index:1000;background:#071425;box-shadow:0 8px 24px rgba(0,0,0,.18);}
  header.topo-app{background:#071425;border-bottom:1px solid var(--borda);padding:10px 30px;display:flex;align-items:center;gap:16px;min-height:68px;}
  .logo-topo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .logo-topo img{height:46px;width:auto;max-width:92px;object-fit:contain;border-radius:6px;}
  .marca-topo{font-size:13px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--texto-suave);white-space:nowrap;}
  .marca-topo span{color:var(--acento);}
  .saudacao-bloco{padding-left:4px;}
  .saudacao-bloco h2{margin:0;font-size:22px;font-weight:900;line-height:1.05;}
  .saudacao-bloco .sub{font-size:10.5px;color:#7590B5;text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-top:5px;}
  .topo-direita{display:flex;align-items:center;gap:14px;margin-left:auto;}
  .data-topo{min-width:142px;padding:8px 12px;border:1px solid var(--borda);border-radius:12px;text-align:right;background:#09182A;}
  .data-topo b{display:block;font-size:11px;color:#fff;}
  .data-topo span{font-size:9.5px;color:#7892B6;}
  .assinatura-topo-badge{min-width:138px;height:46px;padding:6px 12px;border:1px solid rgba(34,197,94,.42);border-radius:12px;background:linear-gradient(180deg,rgba(34,197,94,.18),rgba(10,33,31,.88));color:#D8FFE6;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;cursor:pointer;box-shadow:0 0 0 1px rgba(34,197,94,.04),0 8px 22px rgba(0,0,0,.18);transition:transform .15s,filter .15s,border-color .15s;}
  .assinatura-topo-badge:hover{transform:translateY(-1px);filter:brightness(1.08);}
  .assinatura-topo-badge .status{font-size:9px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;white-space:nowrap;}
  .assinatura-topo-badge .uso{font-size:11px;font-weight:900;color:#fff;white-space:nowrap;}
  .assinatura-topo-badge.alerta{border-color:rgba(242,178,58,.55);background:linear-gradient(180deg,rgba(242,178,58,.20),rgba(45,33,10,.88));color:#FFE6A8;}
  .assinatura-topo-badge.critico{border-color:rgba(229,39,45,.64);background:linear-gradient(180deg,rgba(229,39,45,.22),rgba(50,12,18,.92));color:#FFD0D2;animation:pulsarAssinatura 1.8s ease-in-out infinite;}
  @keyframes pulsarAssinatura{0%,100%{box-shadow:0 0 0 1px rgba(229,39,45,.08),0 8px 22px rgba(0,0,0,.18)}50%{box-shadow:0 0 0 4px rgba(229,39,45,.08),0 8px 22px rgba(0,0,0,.18)}}
  @media(max-width:900px){.assinatura-topo-badge{min-width:108px;padding:6px 9px}.assinatura-topo-badge .status{font-size:8px}.assinatura-topo-badge .uso{font-size:9.5px}}
  .notificacao-topo{position:relative;width:38px;height:38px;border:none;background:transparent;color:#FFD166;font-size:18px;display:flex;align-items:center;justify-content:center;}
  .notificacao-badge{position:absolute;top:0;right:1px;min-width:16px;height:16px;border-radius:10px;background:var(--acento);color:#fff;font-size:9px;font-weight:900;display:none;align-items:center;justify-content:center;padding:0 4px;}
  .perfil-topo{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--borda);}
  .avatar-topo{width:42px;height:42px;border-radius:50%;background:var(--superficie-sutil);border:2px solid #28415D;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;overflow:hidden;flex:0 0 42px;box-shadow:0 0 0 2px rgba(255,255,255,.02);}
  .avatar-topo img{width:100%;height:100%;object-fit:cover;}
  .perfil-texto b{display:block;font-size:12.5px;}
  .perfil-texto span{font-size:10px;color:#7892B6;text-transform:uppercase;}
  #btnSair{background:none;border:1px solid #5A2832;color:#FF6B70;border-radius:var(--raio-s);padding:8px 14px;font-weight:800;font-size:12.5px;}
  #btnSair:hover{background:#2A1218;}

  nav.menu-nav-topo{display:flex;gap:2px;padding:0 28px;background:#071425;border-bottom:1px solid var(--borda);overflow-x:auto;scrollbar-width:thin;}
  nav.menu-nav-topo button{background:none;border:none;color:#BFCBDD;padding:13px 14px;font-size:12.5px;font-weight:800;white-space:nowrap;border-bottom:3px solid transparent;}
  nav.menu-nav-topo button.ativo{color:#fff;border-bottom-color:var(--acento);background:rgba(229,39,45,.06);}
  nav.menu-nav-topo button:hover{color:#fff;}

  main{flex:1;min-height:0;padding:26px 28px 60px;width:100%;max-width:none;margin:0;overflow-y:auto;overflow-x:hidden;}

  .topo-pagina{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:14px;}
  .topo-pagina h2{margin:0;font-size:21px;font-weight:900;white-space:nowrap;}
  .topo-pagina h2 .destaque{color:var(--acento);}
  .topo-pagina-atend{display:grid;grid-template-columns:auto minmax(520px,1fr) minmax(230px,305px);align-items:center;gap:12px;margin-bottom:12px;}
  .kpis-faixa{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--borda);border-radius:14px;overflow:hidden;background:var(--superficie);}
  .kpi-faixa-item{padding:8px 14px;min-width:0;border-right:1px solid var(--borda);}
  .kpi-faixa-item:last-child{border-right:none;}
  .kpi-faixa-item .num{font-size:25px;font-weight:900;line-height:1;color:#fff;}
  .kpi-faixa-item .rot{font-size:8.5px;color:#7F91AA;text-transform:uppercase;font-weight:900;letter-spacing:.5px;margin-top:4px;}
  .btn-primario{background:var(--acento);color:#fff;border:none;border-radius:var(--raio-s);padding:11px 18px;font-weight:800;font-size:13px;}
  .btn-primario:hover{filter:brightness(1.1);}
  .btn-secundario{background:var(--superficie-sutil);color:var(--texto);border:1px solid var(--borda);border-radius:var(--raio-s);padding:9px 14px;font-weight:700;font-size:12.5px;}
  .btn-secundario:hover{background:#132238;}

  .kpis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px;}
  .kpi-card{background:var(--superficie);border:1px solid var(--borda);border-left:4px solid var(--acento);border-radius:var(--raio-s);padding:18px 20px;}
  .kpi-card .num{font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1;color:#fff;}
  .kpi-card .rot{font-size:10.5px;color:var(--acento);text-transform:uppercase;letter-spacing:.4px;font-weight:800;margin-top:6px;}

  .grafico-box,.painel-box{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-m);padding:20px;}
  .grafico-box h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--texto-suave);}

  .carregando-tela{text-align:center;padding:60px 20px;color:var(--texto-fraco);}

  /* ===== Tabela ===== */
  .tabela-box{background:var(--superficie);border:none;overflow:auto;max-height:calc(100vh - 315px);scrollbar-width:none;-ms-overflow-style:none;}
  .tabela-box::-webkit-scrollbar{display:none;width:0;height:0;}
  table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:1650px;}
  thead th{position:sticky;top:0;z-index:3;text-align:center;padding:12px 8px;color:#F4F7FC;text-transform:uppercase;font-size:8.5px;letter-spacing:.15px;font-weight:900;border-bottom:1px solid #315171;background:#09192B;white-space:nowrap;}
  tbody td{padding:9px 8px;border-bottom:1px solid #1A3048;vertical-align:middle;line-height:1.25;}
  tbody tr:hover{background:#0D2239;}

  /* ===== ATENDIMENTOS — aproveitamento total da tela ===== */
  main.modo-atendimentos{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:18px 28px 12px;}
  main.modo-atendimentos .topo-pagina-atend{flex:0 0 auto;margin-bottom:10px;}
  main.modo-atendimentos .barra-acoes{flex:0 0 auto;margin-bottom:10px;}
  main.modo-atendimentos .tabela-box{flex:1 1 0;min-height:0;max-height:none;width:100%;overflow-y:auto;overflow-x:hidden;background:transparent;border:0;border-radius:0;box-shadow:none;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none;-ms-overflow-style:none;}
  main.modo-atendimentos .tabela-box::-webkit-scrollbar{display:none;width:0;height:0;}
  main.modo-atendimentos table{width:100%;min-width:0;table-layout:fixed;font-size:10.5px;background:var(--superficie);}
  main.modo-atendimentos thead th{position:sticky;top:0;z-index:8;padding:10px 5px;font-size:7.8px;line-height:1.1;background:#09192B;border-bottom:1px solid #24435F;white-space:normal;}
  main.modo-atendimentos tbody td{padding:8px 6px;line-height:1.22;border-bottom:1px solid rgba(49,81,113,.42);white-space:normal;overflow-wrap:anywhere;word-break:normal;}
  main.modo-atendimentos tbody tr:last-child td{border-bottom:none;}
  main.modo-atendimentos .td-wrap{min-width:0;white-space:normal;}
  main.modo-atendimentos .td-obs{min-width:0;max-width:none;white-space:normal;overflow:hidden;vertical-align:middle;}
  main.modo-atendimentos .obs-resumo{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;max-height:2.45em;line-height:1.22;cursor:pointer;color:inherit;}
  main.modo-atendimentos .td-obs:hover .obs-resumo{color:#DCE8F8;}
  main.modo-atendimentos tbody tr{height:58px;}
  main.modo-atendimentos .acoes-linha{gap:4px;justify-content:center;flex-wrap:wrap;white-space:normal;}
  main.modo-atendimentos .btn-tabela{padding:5px 7px;font-size:9px;}
  main.modo-atendimentos .badge{padding:3px 6px;font-size:9px;gap:4px;white-space:nowrap;}
  main.modo-atendimentos .link-wa{white-space:normal;}

  main.modo-atendimentos th:nth-child(1),main.modo-atendimentos td:nth-child(1){width:10.5%;}
  main.modo-atendimentos th:nth-child(2),main.modo-atendimentos td:nth-child(2){width:5.5%;}
  main.modo-atendimentos th:nth-child(3),main.modo-atendimentos td:nth-child(3){width:8%;}
  main.modo-atendimentos th:nth-child(4),main.modo-atendimentos td:nth-child(4){width:10%;}
  main.modo-atendimentos th:nth-child(5),main.modo-atendimentos td:nth-child(5){width:7%;}
  main.modo-atendimentos th:nth-child(6),main.modo-atendimentos td:nth-child(6){width:8%;}
  main.modo-atendimentos th:nth-child(7),main.modo-atendimentos td:nth-child(7){width:7.5%;}
  main.modo-atendimentos th:nth-child(8),main.modo-atendimentos td:nth-child(8){width:6%;}
  main.modo-atendimentos th:nth-child(9),main.modo-atendimentos td:nth-child(9){width:7.5%;}
  main.modo-atendimentos th:nth-child(10),main.modo-atendimentos td:nth-child(10){width:7%;}
  main.modo-atendimentos th:nth-child(11),main.modo-atendimentos td:nth-child(11){width:5%;}
  main.modo-atendimentos th:nth-child(12),main.modo-atendimentos td:nth-child(12){width:4.5%;}
  main.modo-atendimentos th:nth-child(13),main.modo-atendimentos td:nth-child(13){width:8%;}
  main.modo-atendimentos th:nth-child(14),main.modo-atendimentos td:nth-child(14){width:5%;}

  main.modo-transportes,main.modo-equipamentos{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:18px 28px 12px;}
  main.modo-transportes .topo-pagina-atend,main.modo-equipamentos .topo-pagina-atend{flex:0 0 auto;margin-bottom:10px;}

  /* ===== AGENDA — estilo Google Calendar adaptado ao Gabinete ===== */

  .gcal-grid{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    grid-template-rows:repeat(6,minmax(0,1fr));

  .gcal-day{

async function comprimirFotoPerfil(arquivo){
  if(!arquivo || !arquivo.type.startsWith('image/')) throw new Error('Escolha uma imagem JPG, PNG ou WEBP.');
  if(arquivo.size > 8 * 1024 * 1024) throw new Error('A imagem original deve ter no máximo 8 MB.');

  const bitmap = await createImageBitmap(arquivo);
  const lado = Math.min(bitmap.width, bitmap.height);
  const sx = Math.max(0, (bitmap.width - lado) / 2);
  const sy = Math.max(0, (bitmap.height - lado) / 2);
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 320;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, sx, sy, lado, lado, 0, 0, 320, 320);
  bitmap.close?.();

  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.82));
  if(!blob) throw new Error('Não foi possível preparar a foto.');
  if(blob.size > 500 * 1024) {
    const blob2 = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.68));
    if(!blob2) throw new Error('Não foi possível comprimir a foto.');
    return blob2;
  }
  return blob;
}

function badgeStatus(status) {
  const s = norm(status);
  let classe = 'badge-cinza';
  if (s === 'CONCLUIDO' || s === 'SIM' || s === 'ENTREGUE' || s === 'CONFIRMADO' || s === 'REALIZADO') classe = 'badge-verde';
  else if (s === 'EM ANALISE' || s === 'PLANEJAMENTO') classe = 'badge-amarelo';
  else if (s === 'CANCELADO' || s === 'NAO') classe = 'badge-vermelho';
  return `<span class="badge ${classe}">${status || '-'}</span>`;
}
window.badgeStatus = badgeStatus;

function formatarTelefoneBR(valor) {
  let numeros = String(valor || '').replace(/\D/g, '');
  // Aceita também números colados com DDI 55 e mantém o padrão nacional.
  if ((numeros.length === 12 || numeros.length === 13) && numeros.startsWith('55')) numeros = numeros.slice(2);
  numeros = numeros.slice(0, 11);
  if (!numeros) return '';
  if (numeros.length <= 2) return '(' + numeros;
  const ddd = numeros.slice(0, 2);
  const resto = numeros.slice(2);
  if (resto.length <= 4) return `(${ddd}) ${resto}`;
  if (resto.length <= 8) return `(${ddd}) ${resto.slice(0, 4)}-${resto.slice(4)}`;
  return `(${ddd}) ${resto.slice(0, 5)}-${resto.slice(5, 9)}`;
}
window.formatarTelefoneBR = formatarTelefoneBR;

function aplicarMascaraTelefone(campo) {
  if (!campo) return;
  campo.value = formatarTelefoneBR(campo.value);
}
window.aplicarMascaraTelefone = aplicarMascaraTelefone;

function linkWhatsapp(telefone) {
  if (!telefone) return '-';
  let numeros = String(telefone).replace(/\D/g, '');
  if ((numeros.length === 12 || numeros.length === 13) && numeros.startsWith('55')) numeros = numeros.slice(2);
  if (!numeros) return telefone;
  const comDDI = numeros.length <= 11 ? '55' + numeros : numeros;
  const exibicao = formatarTelefoneBR(numeros) || telefone;
  return '<a href="https://wa.me/' + comDDI + '" target="_blank" style="color:#4ADE80;text-decoration:none;font-weight:700;">💬 ' + exibicao + '</a>';
}
function linkWhatsappComMensagem(telefone, mensagem) {
  const numeros = String(telefone || '').replace(/\D/g, '');
  if (!numeros) return null;
  const comDDI = numeros.length <= 11 ? '55' + numeros : numeros;
  return 'https://wa.me/' + comDDI + '?text=' + encodeURIComponent(mensagem);
}
function diaEMesNascimento(dataNascimento) {
  const partes = String(dataNascimento || '').split('/');
  if (partes.length < 2) return null;
  const dia = Number(partes[0]), mes = Number(partes[1]);
  if (!dia || !mes) return null;
  return { dia, mes };
}
function diasAteProximoAniversario(dataNascimento) {
  const dm = diaEMesNascimento(dataNascimento);
  if (!dm) return null;
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  let proximo = new Date(hoje.getFullYear(), dm.mes - 1, dm.dia);
  if (proximo < hoje) proximo = new Date(hoje.getFullYear() + 1, dm.mes - 1, dm.dia);
  return Math.round((proximo - hoje) / (1000 * 60 * 60 * 24));
}

function campoBuscaPessoa(prefixo) {
  return `
    <div class="campo-modal busca-pessoa-wrap" style="position:relative;grid-column:1/-1;">
      <label>Buscar no Cadastro Geral (nome, CPF, RG, título ou telefone)</label>
      <input type="hidden" id="${prefixo}_pessoaId" value="">
      <input id="${prefixo}_buscaPessoa" placeholder="Comece a digitar..." autocomplete="off">
      <div id="${prefixo}_resultadosPessoa" class="resultados-busca-pessoa hidden"></div>
    </div>`;
}
function ligarBuscaPessoa(prefixo, mapaCampos) {
  const input = document.getElementById(prefixo + '_buscaPessoa');
  const resultados = document.getElementById(prefixo + '_resultadosPessoa');
  if (!input || !resultados) return;
  input.addEventListener('input', () => {
    const termo = norm(input.value);
    const termoNumeros = input.value.replace(/\D/g, '');
    if (termo.length < 2) { resultados.classList.add('hidden'); resultados.innerHTML = ''; return; }
    const encontrados = pessoasCache.filter(p =>
      norm(p.nome).includes(termo) ||
      (p.cpf && norm(p.cpf).includes(termo)) ||
      (p.rg && norm(p.rg).includes(termo)) ||
      (p.tituloEleitor && norm(p.tituloEleitor).includes(termo)) ||
      (termoNumeros.length >= 3 && String(p.telefone || '').replace(/\D/g, '').includes(termoNumeros))
    ).slice(0, 6);
    if (!encontrados.length) {
      resultados.innerHTML = '<div class="item-resultado-pessoa">Nenhuma pessoa encontrada. Preencha manualmente abaixo.</div>';
      resultados.classList.remove('hidden');
      return;
    }
    resultados.innerHTML = encontrados.map(p => `
      <div class="item-resultado-pessoa" data-id="${p._docId}">
        <b>${p.nome}</b>
        <span>${p.cpf ? 'CPF ' + p.cpf + ' · ' : ''}${p.telefone || 'sem telefone'}</span>
      </div>`).join('');
    resultados.classList.remove('hidden');
    resultados.querySelectorAll('.item-resultado-pessoa[data-id]').forEach(el => {
      el.onclick = () => {
        const pessoa = pessoasCache.find(p => p._docId === el.dataset.id);
        if (!pessoa) return;
        const pessoaIdInput = document.getElementById(prefixo + '_pessoaId');
        if (pessoaIdInput) pessoaIdInput.value = pessoa._docId || '';
        Object.keys(mapaCampos).forEach(campoPessoa => {
          const alvo = document.getElementById(mapaCampos[campoPessoa]);
          if (alvo && pessoa[campoPessoa]) {
            alvo.value = campoPessoa === 'telefone' ? formatarTelefoneBR(pessoa[campoPessoa]) : pessoa[campoPessoa];
          }
        });
        input.value = pessoa.nome;
        resultados.classList.add('hidden');
      };
    });
  });
  document.addEventListener('click', (ev) => {
    if (!ev.target.closest('.busca-pessoa-wrap')) resultados.classList.add('hidden');
  });
}

/* ===== ANEXOS — 500 MB incluídos no plano; espaço adicional é contratado à parte ===== */
const LIMITE_ANEXO_MB = 5;
const LIMITE_ANEXOS_POR_ENVIO = 5;
const ARMAZENAMENTO_STATUS = { bytesUsados: 0, limiteBytes: limiteArmazenamentoBytes(), pct: 0 };

async function calcularUsoAnexos() {
  const colecoes = ['atendimentos','transportes','equipamentos'];
  const snaps = await Promise.all(colecoes.map(nome => getDocs(collection(db,nome))));
  let bytesUsados = 0;
  snaps.forEach(snap => snap.docs.forEach(d => {
    const anexos = Array.isArray(d.data().anexos) ? d.data().anexos : [];
    anexos.forEach(a => { bytesUsados += Number(a.tamanho || 0); });
  }));
  const limiteBytes = limiteArmazenamentoBytes();
  const pct = limiteBytes ? (bytesUsados / limiteBytes) * 100 : 0;
  Object.assign(ARMAZENAMENTO_STATUS, { bytesUsados, limiteBytes, pct });
  return ARMAZENAMENTO_STATUS;
}

function formatarTamanhoArquivo(bytes) {
  if (!bytes) return '';
  const kb = bytes / 1024;
  if (kb < 1024) return kb.toFixed(0) + ' KB';
  return (kb / 1024).toFixed(1) + ' MB';
}

function sanitizarNomeArquivo(nome) {
  return String(nome || 'arquivo').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9.\-_]/g, '_');
}

function formatarEspacoDisponivel(bytes) {
  const mb = Math.max(0, bytes) / 1024 / 1024;
  if (mb < 1024) return mb.toFixed(1).replace('.', ',') + ' MB';
  return (mb / 1024).toFixed(2).replace('.', ',') + ' GB';
}

async function validarSelecaoAnexos(prefixo) {
  const input = document.getElementById(prefixo + '_arquivosAnexo');
  const ajuda = document.getElementById(prefixo + '_ajudaAnexo');
  const arquivos = input && input.files ? Array.from(input.files) : [];
  if (!input || !ajuda) return;

  ajuda.style.color = '';
  if (!arquivos.length) {
    ajuda.textContent = `Até ${LIMITE_ANEXOS_POR_ENVIO} arquivos por envio, ${LIMITE_ANEXO_MB}MB cada. Armazenamento incluído no plano: ${limiteArmazenamentoTexto()}.`;
    return;
  }

  if (arquivos.length > LIMITE_ANEXOS_POR_ENVIO) {
    ajuda.style.color = '#F26D6D';
    ajuda.textContent = `Selecione no máximo ${LIMITE_ANEXOS_POR_ENVIO} arquivos por vez.`;
    input.value = '';
    return;
  }

  const grandeDemais = arquivos.find(f => f.size > LIMITE_ANEXO_MB * 1024 * 1024);
  if (grandeDemais) {
    ajuda.style.color = '#F26D6D';
    ajuda.textContent = `O arquivo “${grandeDemais.name}” ultrapassa ${LIMITE_ANEXO_MB} MB.`;
    input.value = '';
    return;
  }

  try {
    const uso = await calcularUsoAnexos();
    const bytesNovos = arquivos.reduce((total, f) => total + Number(f.size || 0), 0);
    const disponivel = Math.max(0, uso.limiteBytes - uso.bytesUsados);
    if (bytesNovos > disponivel) {
      ajuda.style.color = '#F26D6D';
      ajuda.textContent = `Esses arquivos excedem o limite do plano. Espaço disponível: ${formatarEspacoDisponivel(disponivel)}.`;
      input.value = '';
      return;
    }
    ajuda.style.color = '#4ADE80';
    ajuda.textContent = `${arquivos.length} arquivo(s) selecionado(s) • ${formatarEspacoDisponivel(bytesNovos)} • restarão ${formatarEspacoDisponivel(disponivel - bytesNovos)}.`;
  } catch (e) {
    ajuda.style.color = '#F2B23A';
    ajuda.textContent = 'Não foi possível conferir o espaço agora. O limite será validado novamente ao salvar.';
  }
}
window.validarSelecaoAnexos = validarSelecaoAnexos;

        ${anexos.map((a, i) => itemAnexoHtml(a, i, colecao, registro._docId || '', podeExcluir, prefixo)).join('') || '<div class="anexos-vazio">Nenhum anexo enviado ainda.</div>'}
      </div>

        <input type="file" id="${prefixo}_arquivosAnexo" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx" onchange="validarSelecaoAnexos('${prefixo}')">
        <div class="anexos-ajuda" id="${prefixo}_ajudaAnexo">Até ${LIMITE_ANEXOS_POR_ENVIO} arquivos por envio, ${LIMITE_ANEXO_MB}MB cada. Armazenamento incluído no plano: ${limiteArmazenamentoTexto()}.</div>
        ${avisoUso}

      ${limiteAtingido ? `<button type="button" class="btn-primario" style="margin-top:10px;background:#22C55E;" onclick="abrirAssinaturaPorLimite()">Aumentar armazenamento</button>` : ''}
    </div>`;
}

// Sobe os arquivos selecionados no input de anexos para o Firebase Storage
// e devolve os metadados prontos para gravar no array "anexos" do documento.
async function enviarAnexosSelecionados(prefixo, colecao, docId) {
  const input = document.getElementById(prefixo + '_arquivosAnexo');
  const arquivos = input && input.files ? Array.from(input.files) : [];
  if (!arquivos.length) return [];

  if (arquivos.length > LIMITE_ANEXOS_POR_ENVIO) {
    throw new Error(`Selecione no máximo ${LIMITE_ANEXOS_POR_ENVIO} arquivos por vez.`);
  }
  const grandeDemais = arquivos.find(f => f.size > LIMITE_ANEXO_MB * 1024 * 1024);
  if (grandeDemais) {
    throw new Error(`O arquivo "${grandeDemais.name}" passa de ${LIMITE_ANEXO_MB}MB.`);
  }

  const uso = await calcularUsoAnexos();
  const bytesNovos = arquivos.reduce((total, f) => total + Number(f.size || 0), 0);
  if (uso.bytesUsados + bytesNovos > uso.limiteBytes) {
    const disponivel = Math.max(0, uso.limiteBytes - uso.bytesUsados);
    throw new Error(`Este envio ultrapassa o limite de ${limiteArmazenamentoTexto()}. Espaço disponível: ${formatarEspacoDisponivel(disponivel)}. Aumente o armazenamento para enviar novos documentos.`);
  }

  const { getStorage, ref, uploadBytes, getDownloadURL } = await obterStorageMod();
  const storage = getStorage(app);

  const enviados = [];
  for (const arquivo of arquivos) {
    const caminho = `anexos/${colecao}/${docId}/${Date.now()}_${sanitizarNomeArquivo(arquivo.name)}`;
    const refArquivo = ref(storage, caminho);
    try {
      await uploadBytes(refArquivo, arquivo);
    } catch (e) {
      const codigo = String(e?.code || '');
      if (codigo.includes('storage/unauthorized')) {
        throw new Error('O Firebase Storage ainda não está liberado para este usuário ou as regras do Storage bloquearam o envio.');
      }
      if (codigo.includes('storage/bucket-not-found') || codigo.includes('storage/unknown')) {
        throw new Error('O Firebase Storage deste projeto ainda não está ativo/configurado. Ative o Storage no projeto e tente novamente.');
      }
      throw e;
    }
    const url = await getDownloadURL(refArquivo);
    enviados.push({
      nome: arquivo.name,
      url,
      caminho,
      tamanho: arquivo.size,
      tipo: arquivo.type || '',
      enviadoPor: USUARIO.nome,
      enviadoEm: new Date().toLocaleString('pt-BR')
    });
  }
  return enviados;
}

async function excluirAnexoRegistro(colecao, docId, indice, prefixo) {
  if (somenteLeitura()) return;
  if (!confirm('Remover este anexo?')) return;
  try {
    const refDoc = doc(db, colecao, docId);
    const snap = await getDoc(refDoc);
    if (!snap.exists()) return;
    const anexos = Array.isArray(snap.data().anexos) ? [...snap.data().anexos] : [];
    const [removido] = anexos.splice(indice, 1);
    await updateDoc(refDoc, { anexos });
    if (removido && removido.caminho) {
      obterStorageMod().then(({ getStorage, ref, deleteObject }) => {
        deleteObject(ref(getStorage(app), removido.caminho)).catch(() => {});
      });
    }

    // Atualiza só a lista de anexos dentro do modal aberto, sem fechar o formulário.
    await atualizarResumoAssinaturaTopo();
    const lista = document.getElementById(prefixo + '_listaAnexos');
    if (lista) {
      lista.innerHTML = anexos.map((a, i) => itemAnexoHtml(a, i, colecao, docId, true, prefixo)).join('')
        || '<div class="anexos-vazio">Nenhum anexo enviado ainda.</div>';
    }

    const cacheDoColecao = { atendimentos: atendimentosCache, transportes: transportesCache, equipamentos: equipCacheLista }[colecao];
    const registro = cacheDoColecao && cacheDoColecao.find(r => r._docId === docId);
    if (registro) registro.anexos = anexos;
  } catch (e) {
    alert('Não foi possível remover o anexo: ' + e.message);
  }
}
window.excluirAnexoRegistro = excluirAnexoRegistro;

let filtroAtendTexto = '';
let filtroAtendTextoOriginal = '';
let filtroAtendTipo = '';
let filtroAtendStatus = '';

function valorSeguro(v) {
  return (v === undefined || v === null || String(v).trim() === '') ? '-' : v;
}

function parseDataBR(txt) {
  const m = String(txt || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  d.setHours(0,0,0,0);
  return isNaN(d.getTime()) ? null : d;
}

function cicloDiasAtendimento(a) {
  if (a.cicloDias !== undefined && a.cicloDias !== null && String(a.cicloDias) !== '') return a.cicloDias;
  if (a.ciclo !== undefined && a.ciclo !== null && String(a.ciclo) !== '') return a.ciclo;
  const inicio = parseDataBR(a.data);
  if (!inicio) return '-';
  const fim = parseDataBR(a.finalizado || a.dataFinalizacao || a.finalizadoEm) || new Date();
  fim.setHours(0,0,0,0);
  return Math.max(0, Math.floor((fim - inicio) / 86400000));
}

function opcoesAtendimento(campo) {
  return [...new Set(atendimentosCache.map(a => String(a[campo] || '').trim()).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b, 'pt-BR'));
}

function aplicarFiltroAtend() {
  const textoEl = document.getElementById('fTextoAtend');
  const tipoEl = document.getElementById('fTipoAtend');
  const statusEl = document.getElementById('fStatusAtend');

  // Mantém o foco e a posição do cursor durante a pesquisa.
  // Antes, a tela inteira era redesenhada a cada letra e o input perdia o foco.
  const pesquisandoTexto = document.activeElement === textoEl;
  const posCursor = pesquisandoTexto && typeof textoEl.selectionStart === 'number'
    ? textoEl.selectionStart
    : null;

  filtroAtendTextoOriginal = textoEl ? textoEl.value : filtroAtendTextoOriginal;
  filtroAtendTexto = norm(filtroAtendTextoOriginal);
  filtroAtendTipo = tipoEl ? tipoEl.value : filtroAtendTipo;
  filtroAtendStatus = statusEl ? statusEl.value : filtroAtendStatus;
  desenharAtendimentos();

  if (pesquisandoTexto) {
    const novoCampo = document.getElementById('fTextoAtend');
    if (novoCampo) {
      novoCampo.focus();
      const p = posCursor === null ? novoCampo.value.length : Math.min(posCursor, novoCampo.value.length);
      try { novoCampo.setSelectionRange(p, p); } catch (_) {}
    }
  }
}
window.aplicarFiltroAtend = aplicarFiltroAtend;

function resumirObservacaoAtendimento(texto, limite=58) {
  const valor = String(texto || '').replace(/\s+/g, ' ').trim();
  if (!valor) return '—';
  return valor.length > limite ? valor.slice(0, limite).trimEnd() + '…' : valor;
}

        <div class="kpi-faixa-item"><div class="num">${cancelados}</div><div class="rot">Cancelados</div></div>
      </div>

      ${podeEditar ? '<button class="btn-primario" style="height:52px;" onclick="abrirModalAtendimento()">+ Novo Atendimento</button>' : ''}
    </div>

    <div class="barra-acoes">
      <input id="fTextoAtend" placeholder="Buscar nome ou bairro..." oninput="aplicarFiltroAtend()" value="${filtroAtendTextoOriginal.replace(/"/g,'&quot;')}">
      <select id="fTipoAtend" onchange="aplicarFiltroAtend()">

const TIPOS_ATENDIMENTO = ['CESTA BASICA','CONSULTA MED','DOACOES','EMENDA IMPOSITIVA','EMPREGO','EQUIPAMENTOS','ESCOLA','EXAME MED','OUTROS','PATROCINIO','REMEDIO','TRANSPORTE','CIRURGIA','TROCA DE LAMPADAS'];
const STATUS_ATENDIMENTO = ['EM ANALISE','CONCLUIDO','CANCELADO'];

function dataBRparaISO(valor) {
  const v = String(valor || '').trim();
  if (!v) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  const m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  return m ? `${m[3]}-${m[2]}-${m[1]}` : '';
}

function dataISOparaBR(valor) {
  const v = String(valor || '').trim();
  if (!v) return '';
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(v)) return v;
  const m = v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : v;
}

function maiusculo(valor) {
  return String(valor || '').trim().toLocaleUpperCase('pt-BR');

async function salvarAtendimento(docId) {
  const botao = document.getElementById('btnSalvarAtend');
  if (botao.disabled) return;
  botao.disabled = true; botao.innerText = 'Salvando...';

  const dados = {
    pessoaId: pessoaIdDoModal('m'),
    nome: maiusculo(document.getElementById('m_nome').value),
    telefone: formatarTelefoneBR(document.getElementById('m_telefone').value),
    endereco: document.getElementById('m_endereco').value.trim(),
    bairro: maiusculo(document.getElementById('m_bairro').value),
    data: dataISOparaBR(document.getElementById('m_data').value),
    tipoAtendimento: document.getElementById('m_tipo').value,
    status: document.getElementById('m_status').value,
    responsavel: maiusculo(document.getElementById('m_responsavel').value),
    indicador: maiusculo(document.getElementById('m_indicador').value),
    observacoes: document.getElementById('m_obs').value.trim(),
    ultimaEdicaoPor: USUARIO.nome,
    ultimaEdicaoData: new Date().toLocaleString('pt-BR')
  };

  try {
    let idDoc = docId;
    if (docId) {
      await updateDoc(doc(db, 'atendimentos', docId), dados);
    } else {
      dados.criadoPor = USUARIO.nome;
      const novo = await addDoc(collection(db, 'atendimentos'), dados);
      idDoc = novo.id;
    }

    const novosAnexos = await enviarAnexosSelecionados('m', 'atendimentos', idDoc);
    if (novosAnexos.length) {
      const existentes = docId ? (atendimentosCache.find(a => a._docId === docId)?.anexos || []) : [];
      await updateDoc(doc(db, 'atendimentos', idDoc), { anexos: [...existentes, ...novosAnexos] });
      await atualizarResumoAssinaturaTopo();
    }

    document.querySelector('.gcal-modal-bg, .modal-fundo')?.remove();
    window.RENDERIZADORES.atendimentos();
  } catch (e) {
    alert('Não foi possível salvar: ' + e.message);
    botao.disabled = false; botao.innerText = 'Salvar';
  }
}

let filtroTranspTexto = '';
let filtroTranspTextoOriginal = '';
function aplicarFiltroTransp() {
  const textoEl = document.getElementById('fTextoTransp');

  // Mantém o foco e a posição do cursor durante a pesquisa.
  // A tela de Transportes é redesenhada a cada alteração do filtro,
  // então precisamos devolver o foco ao novo input após o redesenho.
  const pesquisandoTexto = document.activeElement === textoEl;
  const posCursor = pesquisandoTexto && typeof textoEl.selectionStart === 'number'
    ? textoEl.selectionStart
    : null;

  filtroTranspTextoOriginal = textoEl ? textoEl.value : filtroTranspTextoOriginal;
  filtroTranspTexto = norm(filtroTranspTextoOriginal);
  desenharTransportes();

  if (pesquisandoTexto) {
    const novoCampo = document.getElementById('fTextoTransp');
    if (novoCampo) {
      novoCampo.focus();
      const p = posCursor === null ? novoCampo.value.length : Math.min(posCursor, novoCampo.value.length);
      try { novoCampo.setSelectionRange(p, p); } catch (_) {}
    }
  }
}

function eventosDoDiaISO(iso){
  const locais=agendaEventosCache.filter(e=>e.data===iso && e.excluido!==true);
  const idsGoogleLocais=new Set(locais.map(e=>e.googleEventId).filter(Boolean));
  const google=agendaGoogleCache.filter(e=>e.data===iso && !idsGoogleLocais.has(e.googleEventId));
  return [...locais,...google].sort((a,b)=>String(a.hora||'').localeCompare(String(b.hora||'')));
}

function esperarGIS(timeout=10000){
  if(window.google?.accounts?.oauth2) return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const inicio=Date.now();
    const t=setInterval(()=>{
      if(window.google?.accounts?.oauth2){clearInterval(t);resolve();}
      else if(Date.now()-inicio>timeout){clearInterval(t);reject(new Error('Google Identity Services não carregou.'));}
    },100);
  });
}

  });

function dataHoraGoogleParaCampos(ev){
  const start=ev.start||{};
  const end=ev.end||{};
  const data=start.date || (start.dateTime ? start.dateTime.slice(0,10) : '');
  let hora='', horaFim='';
  if(start.dateTime){
    const ds=new Date(start.dateTime);
    hora=String(ds.getHours()).padStart(2,'0')+':'+String(ds.getMinutes()).padStart(2,'0');
  }
  if(end.dateTime){
    const de=new Date(end.dateTime);
    horaFim=String(de.getHours()).padStart(2,'0')+':'+String(de.getMinutes()).padStart(2,'0');
  }
  const privado=ev.extendedProperties?.private||{};
  return {
    _docId:'',_origemGoogle:true,googleEventId:ev.id,googleHtmlLink:ev.htmlLink||'',
    titulo:ev.summary||'(Sem título)',data,hora,horaFim,
    tipo:privado.gabineteTipo||'COMPROMISSO',local:ev.location||'',
    status:privado.gabineteStatus||'CONFIRMADO',lembrete:true,observacoes:ev.description||''
  };
}

async function googleApi(path,options={}){
  if(!googleTokenValido()) throw new Error('Google Agenda desconectado.');
  const resp=await fetch('https://www.googleapis.com/calendar/v3'+path,{
    ...options,
    headers:{'Authorization':'Bearer '+googleAccessToken,'Content-Type':'application/json',...(options.headers||{})}
  });
  if(resp.status===401){
    googleAccessToken='';googleTokenExpiraEm=0;atualizarEstadoGoogleAgenda();
    const erro=new Error('A autorização do Google expirou.');erro.status=401;throw erro;
  }
  if(resp.status===204) return null;
  const body=await resp.json().catch(()=>({}));
  if(!resp.ok){
    const erro=new Error(body?.error?.message||('Erro Google Calendar '+resp.status));
    erro.status=resp.status;erro.body=body;throw erro;
  }
  return body;
}

  if(meta.calendarIdOficial && meta.calendarIdOficial!==idPrimario){
    throw new Error('Esta conta Google não é a agenda oficial do gabinete. Conecte a conta do Murillo.');

  }
  googleCalendarIdAtual=idPrimario;googleCompartilhadaAtiva=true;atualizarEstadoGoogleAgenda();

}

async function sincronizacaoCompletaGoogle(){
  let paginaToken=null,nextSyncToken='',totalRecebidos=0;
  do{
    const params=new URLSearchParams({singleEvents:'true',showDeleted:'true',maxResults:'2500',timeZone:'America/Sao_Paulo'});
    if(paginaToken) params.set('pageToken',paginaToken);
    const dados=await googleApi(`/calendars/${encodeURIComponent(googleCalendarIdAtual)}/events?${params.toString()}`);
    const itens=dados.items||[];totalRecebidos+=itens.length;
    await aplicarRespostaGoogleNoFirestore(itens);
    paginaToken=dados.nextPageToken||null;
    if(dados.nextSyncToken) nextSyncToken=dados.nextSyncToken;
  }while(paginaToken);
  if(nextSyncToken) await salvarMetaGoogleSync({nextSyncToken,ultimaSincronizacao:new Date().toISOString(),tipoUltimaSincronizacao:'COMPLETA',totalRecebidos});
}

async function processarFilaAgendaLocalNoGoogle(){
  const snap=await getDocs(collection(db,'agendaEventos'));
  const pendentes=snap.docs.map(d=>({_docId:d.id,...d.data()})).filter(e=>e.syncGooglePendente===true);
  for(const item of pendentes){
    try{
      if(item.excluido===true){
        if(item.googleEventId){
          try{await excluirEventoGoogle(item.googleEventId);}catch(e){if(e.status!==404&&e.status!==410) throw e;}
        }
        await deleteDoc(doc(db,'agendaEventos',item._docId));
        continue;
      }
      let googleEventId=item.googleEventId||'';
      if(googleEventId) await atualizarEventoGoogle(googleEventId,item);
      else{const criado=await criarEventoGoogle(item);googleEventId=criado?.id||'';}
      await updateDoc(doc(db,'agendaEventos',item._docId),{
        googleEventId,syncGooglePendente:false,sincronizadoGoogleEm:new Date().toISOString(),erroSyncGoogle:''
      });
    }catch(e){
      console.error('Falha ao sincronizar compromisso local com Google:',item._docId,e);
      await updateDoc(doc(db,'agendaEventos',item._docId),{
        syncGooglePendente:true,erroSyncGoogle:String(e.message||e),ultimaTentativaSyncGoogle:new Date().toISOString()
      }).catch(()=>{});
    }
  }
}

  if(!googleTokenValido()) return;
  if(googleCarregando && !forcar) return;
  googleCarregando=true;atualizarEstadoGoogleAgenda();
  try{
    await garantirCalendarioOficial();
    await processarFilaAgendaLocalNoGoogle();
    const meta=await carregarMetaGoogleSync();
    if(meta.nextSyncToken){
      try{await sincronizacaoIncrementalGoogle(meta.nextSyncToken);}
      catch(e){
        if(e.status===410){
          await salvarMetaGoogleSync({nextSyncToken:'',syncTokenExpiradoEm:new Date().toISOString()});
          await sincronizacaoCompletaGoogle();
        }else throw e;
      }
    }else await sincronizacaoCompletaGoogle();
    await recarregarCacheGoogleCompartilhado();
    const snapLocal=await getDocs(collection(db,'agendaEventos'));
    agendaEventosCache=snapLocal.docs.map(d=>({_docId:d.id,...d.data()}));
    desenharAgenda();
  }finally{googleCarregando=false;atualizarEstadoGoogleAgenda();}
}

async function tentarReconectarGoogleSilenciosamente(){
  if(googleTokenValido()||googleSilenciosoEmAndamento) return;

  try{
    await carregarMetaGoogleSync();
    if(!googleCompartilhadaAtiva) return;
    await esperarGIS(5000);
    await new Promise(resolve=>{
      const cliente=criarTokenClientGoogle(async resp=>{
        if(resp&&!resp.error&&resp.access_token){
          googleAccessToken=resp.access_token;
          googleTokenExpiraEm=Date.now()+((Number(resp.expires_in)||3600)*1000);
          try{await garantirCalendarioOficial();await carregarEventosGoogleMes(true);}
          catch(e){console.warn('Reconexão silenciosa recusada:',e.message||e);googleAccessToken='';googleTokenExpiraEm=0;}
        }
        atualizarEstadoGoogleAgenda();resolve();
      });
      try{cliente.requestAccessToken({prompt:''});}catch(_){resolve();}
    });
  }catch(_){}finally{googleSilenciosoEmAndamento=false;atualizarEstadoGoogleAgenda();}
}

function proximoDiaISO(iso){
  const [y,m,d]=iso.split('-').map(Number);
  const dt=new Date(y,m-1,d,12,0,0,0);
  dt.setDate(dt.getDate()+1);
  return dataISOlocal(dt);
}

function corpoEventoGoogle(dados){
  const base={
    summary:dados.titulo||'Compromisso',
    location:dados.local||'',
    description:dados.observacoes||'',
    extendedProperties:{
      private:{
        gabineteTipo:dados.tipo||'COMPROMISSO',
        gabineteStatus:dados.status||'PLANEJADO',
        origem:'gabinete-digital'
      }
    },
    reminders:dados.lembrete!==false
      ? {useDefault:false,overrides:[{method:'popup',minutes:45}]}
      : {useDefault:false,overrides:[]}
  };

  if(dados.hora){
    const fim=dados.horaFim || (() => {
      const [hh,mm]=dados.hora.split(':').map(Number);
      const dt=new Date(2000,0,1,hh,mm||0);
      dt.setHours(dt.getHours()+1);
      return String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
    })();

    base.start={dateTime:`${dados.data}T${dados.hora}:00`,timeZone:'America/Sao_Paulo'};
    base.end={dateTime:`${dados.data}T${fim}:00`,timeZone:'America/Sao_Paulo'};
  }else{
    base.start={date:dados.data};
    base.end={date:proximoDiaISO(dados.data)};
  }

  return base;
}

    <div class="gcal-day-popup-head">
      <div>
        <div class="gcal-day-popup-weekday">${semana}</div>
        <div class="gcal-day-popup-num">${d}</div>
      </div>
      <button class="gcal-day-popup-close" onclick="fecharPopupDiaAgenda()" title="Fechar">×</button>
    </div>

    <div class="gcal-day-popup-list">
      ${evs.map(ev=>{
        const hora=ev.hora?escapar(ev.hora):'';
        const titulo=escapar(ev.titulo||'Compromisso');
        return `<div class="gcal-event ${classeStatusAgenda(ev.status)} ${ev._origemGoogle?'gcal-google-event':''}"
                     onclick='event.stopPropagation();fecharPopupDiaAgenda();abrirModalAgenda(${escapeAttrJson(ev)})'>
                  ${hora?`<span class="gcal-event-time">${hora}</span>`:''}
                  <span class="gcal-event-title">${titulo}</span>
                </div>`;
      }).join('')}
    </div>`;

  document.body.appendChild(pop);

  const alvo=evt?.currentTarget || evt?.target;
  const r=alvo?.getBoundingClientRect?.();
  const pr=pop.getBoundingClientRect();

  let left=(r ? r.left + (r.width/2) - (pr.width/2) : (window.innerWidth-pr.width)/2);
  let top=(r ? r.top + 18 : (window.innerHeight-pr.height)/2);

  left=Math.max(12,Math.min(left,window.innerWidth-pr.width-12));
  top=Math.max(12,Math.min(top,window.innerHeight-pr.height-12));

  pop.style.left=`${left}px`;
  pop.style.top=`${top}px`;

  setTimeout(()=>{
    document.addEventListener('mousedown', fecharPopupDiaAgendaFora, true);
    window.addEventListener('resize', fecharPopupDiaAgenda, {once:true});
  },0);
}

function desenharAgenda(){
  fecharPopupDiaAgenda();
  const c=document.getElementById('conteudo');
  const hoje=new Date();
  hoje.setHours(12,0,0,0);
  const hojeISO=dataISOlocal(hoje);
  const selISO=dataISOlocal(agendaSelecionada);
  const nomeMes=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(agendaAno,agendaMes,1));
  const podeEditar=!somenteLeitura();

  const primeiroMes=new Date(agendaAno,agendaMes,1,12,0,0,0);
  const inicioGrade=new Date(primeiroMes);
  inicioGrade.setDate(1-primeiroMes.getDay());

  let celulas='';
  for(let i=0;i<42;i++){
    const d=new Date(inicioGrade);
    d.setDate(inicioGrade.getDate()+i);
    d.setHours(12,0,0,0);
    const iso=dataISOlocal(d);
    const fora=d.getMonth()!==agendaMes;
    const evs=eventosDoDiaISO(iso);
    const limite=limiteEventosPorDia();
    const visiveis=evs.slice(0,limite);

    const eventosHtml=visiveis.map(ev=>{
      const hora=ev.hora ? escapar(ev.hora) : '';
      const titulo=escapar(ev.titulo||'Compromisso');
      return `<div class="gcal-event ${classeStatusAgenda(ev.status)} ${ev._origemGoogle?'gcal-google-event':''}"
                   title="${hora?hora+' ':''}${titulo}"
                   onclick='event.stopPropagation();abrirModalAgenda(${escapeAttrJson(ev)})'>
                ${hora?`<span class="gcal-event-time">${hora}</span>`:''}
                <span class="gcal-event-title">${titulo}</span>
              </div>`;
    }).join('');

    celulas+=`
      <div class="gcal-day ${fora?'outside':''} ${iso===hojeISO?'today':''} ${iso===selISO?'selected':''}"
           onclick="selecionarDiaAgenda('${iso}',true)">
        <div class="gcal-daynum">${d.getDate()}</div>
        <div class="gcal-events">
          ${eventosHtml}
          ${evs.length>limite?`<div class="gcal-more" onclick="abrirMaisAgenda('${iso}',event)">Mais ${evs.length-limite}</div>`:''}
        </div>
      </div>`;
  }

  c.innerHTML=`
    <div class="gcal-shell">
      <div class="gcal-toolbar">
        <button class="gcal-hoje" onclick="irParaHojeAgenda()">Hoje</button>
        <button class="gcal-navbtn" title="Mês anterior" onclick="mudarMesAgenda(-1)">‹</button>
        <button class="gcal-navbtn" title="Próximo mês" onclick="mudarMesAgenda(1)">›</button>
        <div class="gcal-mes">${nomeMes.charAt(0).toUpperCase()+nomeMes.slice(1)}</div>
        <div class="gcal-spacer"></div>
        <button id="btnGoogleAgenda" class="gcal-google-btn ${googleTokenValido()?'conectado':''}" onclick="conectarGoogleAgenda()">
          <span class="gcal-google-dot"></span>${googleTokenValido()?'Google conectado':'Conectar Google'}
        </button>
        <button id="btnSyncGoogleAgenda" class="gcal-sync-btn" title="Atualizar Google Agenda" onclick="carregarEventosGoogleMes(true)" ${googleTokenValido()?'':'disabled'}>↻</button>
        ${podeEditar?'<button class="gcal-novo" onclick="abrirModalAgenda()">＋ Compromisso</button>':''}
        <button class="gcal-view">Mês ▾</button>
      </div>

      <div class="gcal-weekdays">
        <div>DOM.</div><div>SEG.</div><div>TER.</div><div>QUA.</div><div>QUI.</div><div>SEX.</div><div>SÁB.</div>
      </div>

      <div class="gcal-grid">${celulas}</div>
    </div>`;
}

function selecionarDiaAgenda(iso,abrirNovo=false){
  const [y,m,d]=iso.split('-').map(Number);
  agendaAno=y;
  agendaMes=m-1;
  agendaSelecionada=new Date(y,m-1,d,12,0,0,0);
  desenharAgenda();
  if(abrirNovo && !somenteLeitura()){
    abrirModalAgenda();
  }
}

async function mudarMesAgenda(delta){
  agendaMes+=delta;
  if(agendaMes<0){agendaMes=11;agendaAno--;}
  if(agendaMes>11){agendaMes=0;agendaAno++;}
  agendaSelecionada=new Date(agendaAno,agendaMes,1,12,0,0,0);
  desenharAgenda();
  if(googleTokenValido()) await carregarEventosGoogleMes(true);
}

async function irParaHojeAgenda(){
  const hoje=new Date();
  hoje.setHours(12,0,0,0);
  agendaMes=hoje.getMonth();
  agendaAno=hoje.getFullYear();
  agendaSelecionada=hoje;
  agendaInicializada=true;
  desenharAgenda();
  if(googleTokenValido()) await carregarEventosGoogleMes(true);
}

window.selecionarDiaAgenda=selecionarDiaAgenda;
window.mudarMesAgenda=mudarMesAgenda;
window.irParaHojeAgenda=irParaHojeAgenda;

function formatarHorarioMurillo(input){
  let digitos=input.value.replace(/\D/g,'').slice(0,4);
  if(digitos.length>=2){
    let hh=digitos.slice(0,2);
    if(Number(hh)>23) hh='23';
    let mm=digitos.slice(2,4);
    if(mm.length===2 && Number(mm)>59) mm='59';
    input.value=digitos.length>2?hh+':'+mm:hh;
  }else{
    input.value=digitos;
  }
}
window.formatarHorarioMurillo=formatarHorarioMurillo;

async function salvarAgenda(docId,googleEventId='',origemGoogle=false){
  const b=document.getElementById('btnSalvarAgenda');
  b.disabled=true;b.innerText='Salvando...';
  const dados={
    titulo:document.getElementById('ag_titulo').value.trim(),data:document.getElementById('ag_data').value,
    hora:document.getElementById('ag_hora').value,horaFim:document.getElementById('ag_horaFim').value,
    tipo:document.getElementById('ag_tipo').value,local:document.getElementById('ag_local').value.trim(),
    status:document.getElementById('ag_status').value,lembrete:document.getElementById('ag_lembrete').value==='1',
    observacoes:document.getElementById('ag_obs').value.trim(),ultimaEdicaoPor:USUARIO.nome,
    ultimaEdicaoData:new Date().toLocaleString('pt-BR')
  };
  if(!dados.titulo||!dados.data){alert('Informe pelo menos o título e a data.');b.disabled=false;b.innerText='Salvar';return;}
  try{
    let idGoogle=googleEventId||'',sincronizadoAgora=false;
    if(googleTokenValido()){
      try{
        await garantirCalendarioOficial();
        if(idGoogle) await atualizarEventoGoogle(idGoogle,dados);
        else{const criado=await criarEventoGoogle(dados);idGoogle=criado?.id||'';}
        sincronizadoAgora=true;
      }catch(e){console.warn('Google indisponível; compromisso ficará na fila:',e);}
    }
    if(origemGoogle&&sincronizadoAgora&&!docId){
      // já atualizado no Google; a cópia compartilhada será atualizada pela sync
    }else{
      const dadosFirestore={...dados,googleEventId:idGoogle||'',syncGooglePendente:!sincronizadoAgora,excluido:false};
      if(sincronizadoAgora){dadosFirestore.sincronizadoGoogleEm=new Date().toISOString();dadosFirestore.erroSyncGoogle='';}
      if(docId) await updateDoc(doc(db,'agendaEventos',docId),dadosFirestore);
      else{dadosFirestore.criadoPor=USUARIO.nome;await addDoc(collection(db,'agendaEventos'),dadosFirestore);}
    }
    document.querySelector('.gcal-modal-bg, .modal-fundo')?.remove();
    const [y,m,d]=dados.data.split('-').map(Number);agendaAno=y;agendaMes=m-1;agendaSelecionada=new Date(y,m-1,d,12,0,0,0);agendaInicializada=true;
    const snap=await getDocs(collection(db,'agendaEventos'));agendaEventosCache=snap.docs.map(x=>({_docId:x.id,...x.data()}));
    if(googleTokenValido()) await carregarEventosGoogleMes(true);else desenharAgenda();
    atualizarBadgeNotificacoes();
  }catch(e){console.error(e);alert('Não foi possível salvar: '+e.message);b.disabled=false;b.innerText='Salvar';}
}

async function excluirAgenda(id,googleEventId='',origemGoogle=false){
  if(!confirm('Excluir este compromisso?')) return;
  try{
    let excluidoGoogle=false;
    if(googleEventId&&googleTokenValido()){
      try{await garantirCalendarioOficial();await excluirEventoGoogle(googleEventId);excluidoGoogle=true;}
      catch(e){if(e.status===404||e.status===410) excluidoGoogle=true;else console.warn('Google indisponível; exclusão ficará na fila:',e);}
    }
    if(googleEventId&&!excluidoGoogle){
      if(id) await updateDoc(doc(db,'agendaEventos',id),{excluido:true,syncGooglePendente:true,googleEventId,ultimaEdicaoPor:USUARIO.nome,ultimaEdicaoData:new Date().toLocaleString('pt-BR')});
      else await addDoc(collection(db,'agendaEventos'),{googleEventId,excluido:true,syncGooglePendente:true,criadoPor:USUARIO.nome,ultimaEdicaoPor:USUARIO.nome,ultimaEdicaoData:new Date().toLocaleString('pt-BR')});
    }else{
      if(id) await deleteDoc(doc(db,'agendaEventos',id));
      if(googleEventId) await deleteDoc(doc(db,'agendaGoogleSync',googleEventId)).catch(()=>{});
    }
    document.querySelector('.gcal-modal-bg, .modal-fundo')?.remove();
    const snap=await getDocs(collection(db,'agendaEventos'));agendaEventosCache=snap.docs.map(x=>({_docId:x.id,...x.data()}));
    if(googleTokenValido()) await carregarEventosGoogleMes(true);else desenharAgenda();
    atualizarBadgeNotificacoes();
  }catch(e){console.error(e);alert('Não foi possível excluir: '+e.message);}
}
window.salvarAgenda=salvarAgenda;window.excluirAgenda=excluirAgenda;

  const esteMes = eventosMurilloCache.filter(ev=>{
    const p = String(ev.data||'').split('/');
    return p.length===3 && Number(p[1])-1===hoje.getMonth() && Number(p[2])===hoje.getFullYear();

  c.innerHTML = `

        ${kpiMiniMurillo('rgba(59,130,246,.18)','#60A5FA','✅',confirmados,'Confirmados')}
        ${kpiMiniMurillo('rgba(242,178,58,.18)','#F2B23A','🏁',realizados,'Realizados')}
        ${kpiMiniMurillo('rgba(168,85,247,.18)','#C084FC','📅',esteMes,'Este Mês')}
      </div>

      ${botaoNovo}
    </div>

    ${somenteLeitura() ? '<div class="aviso-perfil">Seu perfil (VEREADOR) tem acesso somente para visualização.</div>' : ''}

    <div class="tabela-box">
      <table style="min-width:800px;">
        <thead>
          <tr>
            <th>Data</th>
            <th>Título</th>
            <th>Local</th>
            <th>Status</th>
            ${podeEditar ? '<th>Ações</th>' : ''}
          </tr>
        </thead>
        <tbody>
          ${eventosMurilloCache.map(ev=>`
            <tr>
              <td>${escapar(ev.data||'')}</td>
              <td>${escapar(ev.titulo||'')}</td>
              <td>${escapar(ev.local||'')}</td>

  `;
}

async function carregarHistoricoPessoa(pessoa){
  if(!pessoa?._docId) return {itens:[],contagens:{atendimentos:0,transportes:0,equipamentos:0,agenda:0,eventos:0},anexos:0};
  const nomes=['atendimentos','transportes','equipamentos','agendaEventos','eventos'];
  const snaps=await Promise.all(nomes.map(n=>getDocs(collection(db,n)).catch(()=>null)));
  const nomeRef=norm(pessoa.nome||'');
  const casa=(r)=>{
    if(String(r.pessoaId||'')===String(pessoa._docId)) return true;
    if(!nomeRef) return false;
    return ['nome','pessoa','beneficiario','solicitante','cidadao','participante'].some(k=>norm(r[k]||'')===nomeRef);
  };
  const itens=[]; const contagens={atendimentos:0,transportes:0,equipamentos:0,agenda:0,eventos:0}; let anexos=0;
  snaps.forEach((snap,i)=>{
    if(!snap) return;
    const colecao=nomes[i];
    snap.docs.forEach(d=>{
      const r={_docId:d.id,...d.data()};
      if(!casa(r)) return;
      if(Array.isArray(r.anexos)) anexos+=r.anexos.length;
      let tipo='',data='',desc='',status='';
      if(colecao==='atendimentos'){contagens.atendimentos++;tipo='Atendimento';data=r.data||'';desc=r.tipoAtendimento||r.observacoes||'Atendimento';status=r.status||'';}
      if(colecao==='transportes'){contagens.transportes++;tipo='Transporte';data=r.data||'';desc=[r.hospital,r.cidade].filter(Boolean).join(' • ')||r.observacoes||'Transporte';status=r.confirmado==='SIM'?'CONFIRMADO':r.espera==='SIM'?'LISTA DE ESPERA':'PENDENTE';}
      if(colecao==='equipamentos'){contagens.equipamentos++;tipo='Equipamento';data=r.entrega||'';desc=r.equipamento||'Empréstimo';status=r.devolucao||'';}
      if(colecao==='agendaEventos'){contagens.agenda++;tipo='Agenda';data=r.data||'';desc=r.titulo||r.tipo||'Compromisso';status=r.status||'';}
      if(colecao==='eventos'){contagens.eventos++;tipo='Evento';data=r.data||'';desc=r.titulo||r.descricao||'Evento';status=r.status||'';}
      itens.push({colecao,tipo,data,desc,status,registro:r});
    });
  });
  const valorData=(v)=>{const iso=dataBRparaISO(v||'');return iso||'0000-00-00'};
  itens.sort((a,b)=>valorData(b.data).localeCompare(valorData(a.data)));
  return {itens,contagens,anexos};
}

            <div class="admin-item">
              <span>${escapar(nome)}</span>
              <span style="font-size:10px;color:#7892B6;font-weight:800;text-transform:uppercase;">Padrão</span>
            </div>
          `).join('')}
          ${tiposAtendimentoCache
            .filter(t => t && String(t.nome || '').trim() && !TIPOS_ATENDIMENTO.some(p => norm(p) === norm(t.nome)))
            .map(t => `
            <div class="admin-item">
              <span>${escapar(t.nome || '')}</span>
              <button class="btn-secundario" style="padding:5px 10px;font-size:11px;"
                onclick="excluirTipoAtendimentoAdmin('${t._docId}')">Excluir</button>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="admin-card">
        <h3>Tipos de Equipamento</h3>
        <p>Aparecem no formulário de novo empréstimo.</p>

        <div class="admin-add">
          <input id="novoTipoEquipamento" placeholder="Ex.: CADEIRA DE RODAS">
          <button class="btn-primario" onclick="adicionarTipoEquipamentoAdmin()">+ Adicionar</button>
        </div>

        <div class="admin-lista">
          ${tiposEquipamentoCache.map(t => `
            <div class="admin-item">
              <span style="flex:1">${escapar(t.nome || '')}</span>
              <label style="font-size:10px;color:var(--texto-fraco);display:flex;align-items:center;gap:6px;">Estoque
                <input type="number" min="0" step="1" value="${Number(t.estoque||0)}" style="width:72px;padding:6px 8px" onchange="salvarEstoqueTipoEquipamento('${t._docId}',this.value)">
              </label>
              <button class="btn-secundario" style="padding:5px 10px;font-size:11px;" onclick="excluirTipoEquipamentoAdmin('${t._docId}')">Excluir</button>
            </div>
          `).join('') || '<div style="color:var(--texto-fraco);font-size:12px;">Nenhum tipo cadastrado ainda.</div>'}
        </div>
      </div>

    </div>
  `;
}

async function adicionarTipoAtendimentoAdmin(){
  if(!USUARIO || norm(USUARIO.cargo) !== 'ADMIN') return;

  const campo = document.getElementById('novoTipoAtendimento');
  const nome = (campo?.value || '').trim().toUpperCase();
  if(!nome) return;

  if(tiposAtendimentoCache.some(t => norm(t.nome) === norm(nome))){
    alert('Esse tipo de atendimento já está cadastrado.');
    return;
  }

  try{
    await addDoc(collection(db,'tiposAtendimento'), {
      nome,
      criadoPor: USUARIO.nome || '',
      criadoEmTexto: new Date().toLocaleString('pt-BR')
    });
    campo.value = '';
    await carregarConfiguraveis();
    desenharConfiguracoesAdmin();
  }catch(e){
    alert('Não foi possível adicionar. Só ADMIN pode cadastrar tipos. (' + e.message + ')');
  }
}
window.adicionarTipoAtendimentoAdmin = adicionarTipoAtendimentoAdmin;

async function salvarEstoqueTipoEquipamento(id, valor){
  if(!USUARIO || norm(USUARIO.cargo) !== 'ADMIN') return;
  const estoque=Math.max(0,Math.floor(Number(valor)||0));
  try{
    await updateDoc(doc(db,'tiposEquipamento',id),{estoque});
    const item=tiposEquipamentoCache.find(t=>t._docId===id); if(item) item.estoque=estoque;
  }catch(e){ alert('Não foi possível salvar o estoque. ('+e.message+')'); }
}

let usuariosAdminCache = [];

window.RENDERIZADORES.usuarios = async function(){
  if(!USUARIO || norm(USUARIO.cargo) !== 'ADMIN'){
    document.getElementById('conteudo').innerHTML =
      '<div class="topo-pagina"><h2>Acesso restrito</h2></div><div class="admin-restrito">Esta área é exclusiva do administrador.</div>';
    return;
  }

  const c = document.getElementById('conteudo');
  c.innerHTML = '<div class="topo-pagina"><h2>Controle de <span style="color:var(--acento);">Usuários</span></h2></div><div class="carregando-tela">Carregando...</div>';

  try{
    const snap = await getDocs(collection(db,'usuarios'));
    usuariosAdminCache = snap.docs
      .map(d => ({ _docId:d.id, ...d.data() }))
      .sort((a,b) => String(a.nome || '').localeCompare(String(b.nome || '')));
    desenharUsuariosAdmin();
  }catch(e){
    c.innerHTML = '<div class="painel-box">Não foi possível carregar os usuários. ' + escapar(e.message || e) + '</div>';
  }
};

function desenharUsuariosAdmin(){
  const c = document.getElementById('conteudo');

  c.innerHTML = `
    <div class="topo-pagina">
      <div>
        <h2>Controle de <span style="color:var(--acento);">Usuários</span></h2>
        <div style="width:64px;height:3px;border-radius:4px;background:var(--acento);margin-top:7px;"></div>
      </div>
      <button class="btn-primario" onclick="abrirModalUsuarioAdmin()">+ Novo Perfil</button>
    </div>

    <div class="aviso-perfil">
      Para criar um LOGIN novo (e-mail e senha), use Firebase Console → Authentication → Adicionar usuário.
      Depois volte aqui, clique em “+ Novo Perfil” e cole o UID gerado pelo Firebase.
    </div>

    <div class="admin-table-box">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Cargo</th>
            <th>Status</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody>
          ${usuariosAdminCache.map(u => `
            <tr>
              <td>${escapar(u.nome || '')}</td>
              <td>${escapar(u.email || '')}</td>
              <td>${escapar(rotuloCargo(norm(u.cargo)))}</td>
              <td>${u.ativo === false
                ? '<span class="badge badge-vermelho">BLOQUEADO</span>'
                : '<span class="badge badge-verde">ATIVO</span>'}</td>
              <td>
                <div class="acoes-linha" style="justify-content:center;">
                  <button class="btn-secundario btn-tabela"
                    onclick="abrirModalUsuarioAdminPorId('${u._docId}')">Editar</button>
                  ${u._docId === UID ? '' : `<button class="btn-secundario btn-tabela" style="color:#F26D6D;border-color:#4A2430;" onclick="excluirUsuarioAdmin('${u._docId}')">Excluir</button>`}
                </div>
              </td>
            </tr>
          `).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--texto-fraco);padding:20px;">Nenhum perfil cadastrado.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

function abrirModalUsuarioAdminPorId(id){
  const registro = usuariosAdminCache.find(u => u._docId === id);
  abrirModalUsuarioAdmin(registro || {});
}
window.abrirModalUsuarioAdminPorId = abrirModalUsuarioAdminPorId;

function abrirModalUsuarioAdmin(registro = {}){
  if(!USUARIO || norm(USUARIO.cargo) !== 'ADMIN') return;

  const editando = !!registro._docId;
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  fundo.onclick = e => { if(e.target === fundo) fundo.remove(); };

  fundo.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <h2>${editando ? 'Editar' : 'Novo'} Perfil de Usuário</h2>

      ${!editando ? `
        <div class="aviso-perfil">
          Cole o UID do usuário criado no Firebase Authentication. Este formulário não cria senha.
        </div>
      ` : ''}

      ${!editando ? `
        <div class="campo-modal">
          <label>UID do Firebase Authentication</label>
          <input id="u_uid" placeholder="Cole o UID aqui">
        </div>
      ` : ''}

      <div class="grid-2">
        <div class="campo-modal">
          <label>Nome</label>
          <input id="u_nome" value="${escapar(registro.nome || '')}">
        </div>

        <div class="campo-modal">
          <label>E-mail</label>
          <input id="u_email" type="email" value="${escapar(registro.email || '')}" ${editando ? 'disabled' : ''}>
        </div>

        <div class="campo-modal">
          <label>Cargo</label>
          <select id="u_cargo">
            <option value="ADMIN" ${norm(registro.cargo) === 'ADMIN' ? 'selected' : ''}>Administrador</option>
            <option value="ASSESSOR" ${norm(registro.cargo) === 'ASSESSOR' ? 'selected' : ''}>Assessor</option>
            <option value="ASSESSORA" ${norm(registro.cargo) === 'ASSESSORA' ? 'selected' : ''}>Assessora</option>
            <option value="VEREADOR" ${norm(registro.cargo) === 'VEREADOR' ? 'selected' : ''}>Vereador (somente leitura)</option>
          </select>
        </div>

        <div class="campo-modal">
          <label>Status de acesso</label>
          <select id="u_ativo">
            <option value="true" ${registro.ativo !== false ? 'selected' : ''}>Ativo (libera entrada)</option>
            <option value="false" ${registro.ativo === false ? 'selected' : ''}>Bloqueado (derruba na hora)</option>
          </select>
        </div>
      </div>

      <div class="modal-acoes">
        <span></span>
        <div style="display:flex;gap:8px;">
          <button class="btn-secundario" onclick="this.closest('.modal-fundo').remove()">Cancelar</button>
          <button class="btn-primario" id="btnSalvarUsuarioAdmin"
            onclick="salvarUsuarioAdmin('${registro._docId || ''}')">Salvar</button>
        </div>
      </div>
    </div>
  `;

  document.body.appendChild(fundo);
}
window.abrirModalUsuarioAdmin = abrirModalUsuarioAdmin;

async function salvarUsuarioAdmin(id){
  if(!USUARIO || norm(USUARIO.cargo) !== 'ADMIN') return;

  const btn = document.getElementById('btnSalvarUsuarioAdmin');
  const nome = document.getElementById('u_nome').value.trim();
  const email = document.getElementById('u_email').value.trim();
  const cargo = document.getElementById('u_cargo').value;
  const ativo = document.getElementById('u_ativo').value === 'true';

  if(!nome){
    alert('Preencha o nome.');
    return;
  }

  let uidFinal = id;
  if(!uidFinal){
    uidFinal = document.getElementById('u_uid').value.trim();
    if(!uidFinal){
      alert('Cole o UID do Firebase Authentication antes de salvar.');
      return;
    }
    if(!email){
      alert('Preencha o e-mail.');
      return;
    }
  }

  if(uidFinal === UID && ativo === false){
    alert('Você não pode bloquear o seu próprio usuário enquanto está logado.');
    return;
  }

  btn.disabled = true;
  btn.innerText = 'Salvando...';

  try{
    const dados = { nome, cargo, ativo };
    if(!id) dados.email = email;

    await setDoc(doc(db,'usuarios',uidFinal), dados, { merge:true });

    document.querySelector('.modal-fundo')?.remove();
    await window.RENDERIZADORES.usuarios();
  }catch(e){
    alert('Não foi possível salvar. Só ADMIN pode editar perfis. (' + e.message + ')');
    btn.disabled = false;
    btn.innerText = 'Salvar';
  }
}
window.salvarUsuarioAdmin = salvarUsuarioAdmin;

async function excluirUsuarioAdmin(id){
  if(!USUARIO || norm(USUARIO.cargo) !== 'ADMIN') return;
  if(id === UID){ alert('Você não pode excluir o seu próprio usuário.'); return; }
  if(!confirm('Excluir este perfil? A pessoa perde acesso ao sistema na hora. (O login dela continua existindo no Firebase Authentication — se quiser remover de vez, apague também por lá.)')) return;
  try{
    await deleteDoc(doc(db,'usuarios',id));
    await window.RENDERIZADORES.usuarios();
  }catch(e){
    alert('Não foi possível excluir. (' + e.message + ')');
  }
}
window.excluirUsuarioAdmin = excluirUsuarioAdmin;

function verificarLembretesAgenda(){
  const hoje=new Date();
  const iso=dataISOlocal(hoje);
  const evs=agendaEventosCache.filter(e=>e.data===iso && e.lembrete!==false && norm(e.status)!=='CANCELADO');
  const badge=document.getElementById('notificacaoBadge');
  if(!badge) return;
  if(!evs.length){ badge.style.display='none'; return; }
  badge.textContent=String(evs.length);
  badge.style.display='flex';
}

let qtdPagamentosPendentesAviso = 0;
async function atualizarBadgeNotificacoes(){
  try{
    const snap = await getDocs(collection(db,'agendaEventos'));
    agendaEventosCache = snap.docs.map(d=>({_docId:d.id,...d.data()}));
    let qtdAgenda = 0;
    const hoje=new Date();
    const iso=dataISOlocal(hoje);
    qtdAgenda = agendaEventosCache.filter(e=>e.data===iso && e.lembrete!==false && norm(e.status)!=='CANCELADO').length;

    qtdPagamentosPendentesAviso = 0;
    if(USUARIO && USUARIO.cargo === 'ADMIN'){
      try{
        const pagSnap = await getDocs(collection(db,'pagamentosInformados'));
        qtdPagamentosPendentesAviso = pagSnap.docs.filter(d=>String(d.data().status||'').toUpperCase()==='PENDENTE').length;
      }catch(e){ console.error('Não foi possível consultar pagamentos pendentes:', e); }
    }

    const badge=document.getElementById('notificacaoBadge');
    if(!badge) return;
    const total = qtdAgenda + qtdPagamentosPendentesAviso;
    if(!total){ badge.style.display='none'; return; }
    badge.textContent=String(total);
    badge.style.display='flex';
  }catch(e){
    console.error('Não foi possível atualizar notificações:', e);
  }
}

const sinoNotificacoes = document.querySelector('.notificacao-topo');
if (sinoNotificacoes) {
  sinoNotificacoes.style.cursor = 'pointer';
  sinoNotificacoes.onclick = () => {
    if(USUARIO && USUARIO.cargo === 'ADMIN' && qtdPagamentosPendentesAviso > 0) irPara('assinatura');
    else irPara('agenda');
  };
}
</script>

<script>
// Abre o calendário ao pressionar QUALQUER ponto do campo de data.
// pointerdown é usado porque showPicker() exige a ação direta do usuário.
function abrirCalendarioDoCampo(campo) {
  if (!campo || campo.disabled || campo.readOnly) return;
  if (typeof campo.showPicker === 'function') {
    try { campo.showPicker(); return; } catch (e) {}
  }
  campo.focus();
}

document.addEventListener('pointerdown', function (event) {
  const campo = event.target.closest('input[type="date"]')
  if (!campo) return;
  abrirCalendarioDoCampo(campo);
}, true);

// Também abre ao receber foco por teclado.
document.addEventListener('focusin', function (event) {
  const campo = event.target.closest && event.target.closest('input[type="date"]');
  if (!campo) return;
  abrirCalendarioDoCampo(campo);
});

// Deixa visualmente claro que todo o campo é clicável.
document.addEventListener('mouseover', function (event) {
  const campo = event.target.closest && event.target.closest('input[type="date"]');
  if (campo) campo.style.cursor = 'pointer';
});
</script>
