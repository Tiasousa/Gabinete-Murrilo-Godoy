<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gabinete Digital — Vereador Murillo Godoy</title>
<link rel="apple-touch-icon" sizes="180x180" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gabinete Digital">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Gabinete Digital">
<meta name="theme-color" content="#0A1728">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --fundo:#070E19; --superficie:#0A1728; --superficie-sutil:#0D1D33;
    --borda:#1C2C41; --texto:#F5F8FC; --texto-suave:#B8C4D4; --texto-fraco:#7C8BA0;
    --acento:#E5272D; --verde:#22C55E; --azul:#2563EB; --amarelo:#F2B23A; --roxo:#A855F7;
    --raio-s:8px; --raio-m:12px; --raio-l:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',Arial,sans-serif;background:var(--fundo);color:var(--texto);-webkit-font-smoothing:antialiased;}
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ===== SPLASH (abertura) ===== */
  #telaSplash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#101F35,#070E19 60%);gap:18px;text-align:center;padding:20px;}
  .splash-caixa{width:170px;height:170px;border-radius:var(--raio-l);background:var(--superficie);border:1px solid var(--borda);display:flex;align-items:center;justify-content:center;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .splash-caixa img{width:100%;object-fit:contain;border-radius:8px;}
  .splash-titulo{font-size:22px;font-weight:900;letter-spacing:.3px;}
  .splash-titulo span{color:var(--acento);}
  .splash-sub{font-size:11.5px;color:var(--texto-fraco);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-top:-8px;}
  .splash-spin{width:30px;height:30px;border-radius:50%;border:3px solid #1C2C41;border-top-color:var(--acento);animation:girar 0.8s linear infinite;margin-top:6px;}
  @keyframes girar{to{transform:rotate(360deg);}}
  #pularSplash{color:#5C86D8;font-size:12.5px;text-decoration:underline;background:none;border:none;margin-top:4px;}

  /* ===== LOGIN ===== */
  #telaLogin{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:24px;background:radial-gradient(circle at 50% 38%,rgba(25,61,103,.34) 0,rgba(10,23,40,.16) 28%,transparent 54%),linear-gradient(145deg,#050B14 0%,#081321 48%,#050B14 100%);}
  #telaLogin::before,#telaLogin::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none;}
  #telaLogin::before{width:520px;height:520px;left:-260px;top:-260px;background:radial-gradient(circle,rgba(229,39,45,.10),transparent 68%);}
  #telaLogin::after{width:600px;height:600px;right:-330px;bottom:-330px;background:radial-gradient(circle,rgba(37,99,235,.11),transparent 68%);}
  .card-login{position:relative;z-index:1;background:linear-gradient(145deg,rgba(13,29,51,.97),rgba(7,20,37,.98));border:1px solid rgba(93,125,164,.28);border-radius:24px;padding:34px 34px 30px;width:100%;max-width:430px;box-shadow:0 35px 90px rgba(0,0,0,.58),0 12px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.05);animation:loginEntrada .55s cubic-bezier(.2,.8,.2,1) both;}
  .card-login::before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(145deg,rgba(255,255,255,.12),transparent 38%,rgba(229,39,45,.18));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
  .login-logo-wrap{width:100%;max-width:270px;height:172px;margin:0 auto 20px;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 50% 48%,rgba(37,99,235,.13),rgba(7,20,37,.28) 62%,transparent 74%);perspective:800px;}
  .login-logo-wrap::after{content:"";position:absolute;width:68%;height:18px;left:16%;bottom:13px;border-radius:50%;background:rgba(0,0,0,.40);filter:blur(12px);}
  .card-login img{position:relative;z-index:1;width:88%;max-width:245px;display:block;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.48));transform:translateY(-2px) rotateX(1deg);animation:logoFlutua 4s ease-in-out infinite;}
  .login-eyebrow{text-align:center;color:#7590B5;font-size:10px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;margin-bottom:7px;}
  .card-login h1{text-align:center;font-size:19px;letter-spacing:1.2px;color:#F5F8FC;margin:0 0 5px;text-transform:uppercase;font-weight:900;}
  .card-login h1 span{color:var(--acento);text-shadow:0 0 22px rgba(229,39,45,.22);}
  .login-subtitulo{text-align:center;color:#70849F;font-size:11px;font-weight:600;letter-spacing:.5px;margin:0 0 25px;}
  .campo-login{margin-bottom:13px;position:relative;}
  .campo-login::before{position:absolute;left:15px;top:50%;transform:translateY(-50%);z-index:2;color:#7186A3;font-size:15px;pointer-events:none;}
  .campo-login.email::before{content:"✉";}
  .campo-login.senha::before{content:"●";font-size:10px;}
  .campo-login input{width:100%;padding:14px 15px 14px 42px;border-radius:11px;border:1px solid rgba(77,105,140,.38);background:linear-gradient(180deg,rgba(13,29,51,.94),rgba(10,25,44,.94));color:var(--texto);font-size:14px;outline:none;box-shadow:inset 0 1px 4px rgba(0,0,0,.22);transition:border-color .2s,box-shadow .2s,transform .2s;}
  .campo-login input::placeholder{color:#6F8096;}
  .campo-login input:focus{border-color:#456FAD;box-shadow:0 0 0 3px rgba(37,99,235,.10),inset 0 1px 4px rgba(0,0,0,.18);transform:translateY(-1px);}
  #btnEntrar{width:100%;padding:15px;border:1px solid rgba(255,104,108,.18);border-radius:11px;background:linear-gradient(180deg,#F03238 0%,#D91F26 100%);color:#fff;font-weight:900;font-size:14.5px;margin-top:7px;box-shadow:0 12px 24px rgba(229,39,45,.22),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .15s,filter .15s,box-shadow .15s;}
  #btnEntrar:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 15px 30px rgba(229,39,45,.28),inset 0 1px 0 rgba(255,255,255,.18);}
  #btnEntrar:active{transform:translateY(1px);box-shadow:0 6px 14px rgba(229,39,45,.20);}
  #btnEntrar:disabled{opacity:.6;cursor:default;transform:none;}
  #erroLogin{color:#FF7479;font-size:12.5px;margin-top:12px;text-align:center;min-height:16px;}
  .login-rodape{text-align:center;margin-top:13px;color:#536A87;font-size:9.5px;letter-spacing:.45px;text-transform:uppercase;font-weight:700;}
  @keyframes loginEntrada{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes logoFlutua{0%,100%{transform:translateY(-2px)}50%{transform:translateY(-7px)}}
  @media(max-width:520px){#telaLogin{padding:16px}.card-login{max-width:390px;padding:28px 22px 24px;border-radius:21px}.login-logo-wrap{height:150px;max-width:245px;margin-bottom:17px}.card-login h1{font-size:17px}.login-subtitulo{margin-bottom:21px}}
  @media(prefers-reduced-motion:reduce){.card-login,.card-login img{animation:none}}

  /* ===== APP ===== */
  #app{min-height:100vh;display:flex;flex-direction:column;}
  .cabecalho-fixo{position:sticky;top:0;z-index:1000;background:#071425;box-shadow:0 8px 24px rgba(0,0,0,.18);}
  header.topo-app{background:#071425;border-bottom:1px solid var(--borda);padding:10px 30px;display:flex;align-items:center;gap:16px;min-height:68px;}
  .logo-topo{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .logo-topo img{height:46px;width:auto;max-width:92px;object-fit:contain;border-radius:6px;}
  .marca-topo{font-size:13px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;color:var(--texto-suave);white-space:nowrap;}
  .marca-topo span{color:var(--acento);}
  .saudacao-bloco{padding-left:4px;}
  .saudacao-bloco h2{margin:0;font-size:22px;font-weight:900;line-height:1.05;}
  .saudacao-bloco .sub{font-size:10.5px;color:#7590B5;text-transform:uppercase;letter-spacing:.7px;font-weight:700;margin-top:5px;}
  .topo-direita{display:flex;align-items:center;gap:14px;margin-left:auto;}
  .data-topo{min-width:142px;padding:8px 12px;border:1px solid var(--borda);border-radius:12px;text-align:right;background:#09182A;}
  .data-topo b{display:block;font-size:11px;color:#fff;}
  .data-topo span{font-size:9.5px;color:#7892B6;}
  .notificacao-topo{position:relative;width:38px;height:38px;border:none;background:transparent;color:#FFD166;font-size:18px;display:flex;align-items:center;justify-content:center;}
  .notificacao-badge{position:absolute;top:0;right:1px;min-width:16px;height:16px;border-radius:10px;background:var(--acento);color:#fff;font-size:9px;font-weight:900;display:none;align-items:center;justify-content:center;padding:0 4px;}
  .perfil-topo{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid var(--borda);}
  .avatar-topo{width:38px;height:38px;border-radius:50%;background:var(--superficie-sutil);border:1px solid var(--borda);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;overflow:hidden;}
  .avatar-topo img{width:100%;height:100%;object-fit:cover;}
  .perfil-texto b{display:block;font-size:12.5px;}
  .perfil-texto span{font-size:10px;color:#7892B6;text-transform:uppercase;}
  #btnSair{background:none;border:1px solid #5A2832;color:#FF6B70;border-radius:var(--raio-s);padding:8px 14px;font-weight:800;font-size:12.5px;}
  #btnSair:hover{background:#2A1218;}

  nav.menu-nav-topo{display:flex;gap:2px;padding:0 28px;background:#071425;border-bottom:1px solid var(--borda);overflow-x:auto;scrollbar-width:thin;}
  nav.menu-nav-topo button{background:none;border:none;color:#BFCBDD;padding:13px 14px;font-size:12.5px;font-weight:800;white-space:nowrap;border-bottom:3px solid transparent;}
  nav.menu-nav-topo button.ativo{color:#fff;border-bottom-color:var(--acento);background:rgba(229,39,45,.06);}
  nav.menu-nav-topo button:hover{color:#fff;}

  main{flex:1;padding:26px 28px 60px;width:100%;max-width:none;margin:0;}

  .topo-pagina{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:14px;}
  .topo-pagina h2{margin:0;font-size:21px;font-weight:900;white-space:nowrap;}
  .topo-pagina h2 .destaque{color:var(--acento);}
  .topo-pagina-atend{display:grid;grid-template-columns:auto minmax(520px,1fr) minmax(230px,305px);align-items:center;gap:12px;margin-bottom:12px;}
  .kpis-faixa{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--borda);border-radius:14px;overflow:hidden;background:var(--superficie);}
  .kpi-faixa-item{padding:8px 14px;min-width:0;border-right:1px solid var(--borda);}
  .kpi-faixa-item:last-child{border-right:none;}
  .kpi-faixa-item .num{font-size:25px;font-weight:900;line-height:1;color:#fff;}
  .kpi-faixa-item .rot{font-size:8.5px;color:#7F91AA;text-transform:uppercase;font-weight:900;letter-spacing:.5px;margin-top:4px;}
  .btn-primario{background:var(--acento);color:#fff;border:none;border-radius:var(--raio-s);padding:11px 18px;font-weight:800;font-size:13px;}
  .btn-primario:hover{filter:brightness(1.1);}
  .btn-secundario{background:var(--superficie-sutil);color:var(--texto);border:1px solid var(--borda);border-radius:var(--raio-s);padding:9px 14px;font-weight:700;font-size:12.5px;}
  .btn-secundario:hover{background:#132238;}

  .kpis-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px;}
  .kpi-card{background:var(--superficie);border:1px solid var(--borda);border-left:4px solid var(--acento);border-radius:var(--raio-s);padding:18px 20px;}
  .kpi-card .num{font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1;color:#fff;}
  .kpi-card .rot{font-size:10.5px;color:var(--acento);text-transform:uppercase;letter-spacing:.4px;font-weight:800;margin-top:6px;}

  .grafico-box,.painel-box{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-m);padding:20px;}
  .grafico-box h3{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--texto-suave);}

  .carregando-tela{text-align:center;padding:60px 20px;color:var(--texto-fraco);}

  /* ===== Tabela ===== */
  .tabela-box{background:var(--superficie);border:none;overflow:auto;max-height:calc(100vh - 315px);scrollbar-width:none;-ms-overflow-style:none;}
  .tabela-box::-webkit-scrollbar{display:none;width:0;height:0;}
  table{width:100%;border-collapse:collapse;font-size:11.5px;min-width:1650px;}
  thead th{position:sticky;top:0;z-index:3;text-align:center;padding:12px 8px;color:#F4F7FC;text-transform:uppercase;font-size:8.5px;letter-spacing:.15px;font-weight:900;border-bottom:1px solid #315171;background:#09192B;white-space:nowrap;}
  tbody td{padding:9px 8px;border-bottom:1px solid #1A3048;vertical-align:middle;line-height:1.25;}
  tbody tr:hover{background:#0D2239;}

  /* ===== ATENDIMENTOS — aproveitamento total da tela ===== */
  main.modo-atendimentos{height:calc(100vh - 114px);min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:18px 28px 12px;}
  main.modo-atendimentos .topo-pagina-atend{flex:0 0 auto;margin-bottom:10px;}
  main.modo-atendimentos .barra-acoes{flex:0 0 auto;margin-bottom:10px;}
  main.modo-atendimentos .tabela-box{flex:1 1 auto;min-height:0;max-height:none;width:100%;overflow:auto;background:transparent;border:0;border-radius:0;box-shadow:none;overscroll-behavior:contain;scrollbar-width:none;-ms-overflow-style:none;}
  main.modo-atendimentos .tabela-box::-webkit-scrollbar{display:none;width:0;height:0;}
  main.modo-atendimentos table{width:100%;min-width:0;table-layout:fixed;font-size:10.5px;background:var(--superficie);}
  main.modo-atendimentos thead th{position:sticky;top:0;z-index:8;padding:10px 5px;font-size:7.8px;line-height:1.1;background:#09192B;border-bottom:1px solid #24435F;white-space:normal;}
  main.modo-atendimentos tbody td{padding:8px 6px;line-height:1.22;border-bottom:1px solid rgba(49,81,113,.42);white-space:normal;overflow-wrap:anywhere;word-break:normal;}
  main.modo-atendimentos tbody tr:last-child td{border-bottom:none;}
  main.modo-atendimentos .td-wrap{min-width:0;white-space:normal;}
  main.modo-atendimentos .td-obs{min-width:0;max-width:none;white-space:normal;overflow:hidden;text-overflow:ellipsis;display:table-cell;}
  main.modo-atendimentos .acoes-linha{gap:4px;justify-content:center;flex-wrap:wrap;white-space:normal;}
  main.modo-atendimentos .btn-tabela{padding:5px 7px;font-size:9px;}
  main.modo-atendimentos .badge{padding:3px 6px;font-size:9px;gap:4px;white-space:nowrap;}
  main.modo-atendimentos .link-wa{white-space:normal;}

  /* Larguras proporcionais: todas as informações permanecem visíveis */
  main.modo-atendimentos th:nth-child(1),main.modo-atendimentos td:nth-child(1){width:5.5%;}
  main.modo-atendimentos th:nth-child(2),main.modo-atendimentos td:nth-child(2){width:10.5%;}
  main.modo-atendimentos th:nth-child(3),main.modo-atendimentos td:nth-child(3){width:8%;}
  main.modo-atendimentos th:nth-child(4),main.modo-atendimentos td:nth-child(4){width:10%;}
  main.modo-atendimentos th:nth-child(5),main.modo-atendimentos td:nth-child(5){width:7%;}
  main.modo-atendimentos th:nth-child(6),main.modo-atendimentos td:nth-child(6){width:8%;}
  main.modo-atendimentos th:nth-child(7),main.modo-atendimentos td:nth-child(7){width:7.5%;}
  main.modo-atendimentos th:nth-child(8),main.modo-atendimentos td:nth-child(8){width:6%;}
  main.modo-atendimentos th:nth-child(9),main.modo-atendimentos td:nth-child(9){width:7.5%;}
  main.modo-atendimentos th:nth-child(10),main.modo-atendimentos td:nth-child(10){width:7%;}
  main.modo-atendimentos th:nth-child(11),main.modo-atendimentos td:nth-child(11){width:5%;}
  main.modo-atendimentos th:nth-child(12),main.modo-atendimentos td:nth-child(12){width:4.5%;}
  main.modo-atendimentos th:nth-child(13),main.modo-atendimentos td:nth-child(13){width:8%;}
  main.modo-atendimentos th:nth-child(14),main.modo-atendimentos td:nth-child(14){width:5%;}
  .barra-acoes{display:grid;grid-template-columns:minmax(185px,1fr) 178px 138px 100px;gap:10px;margin-bottom:12px;}
  .barra-acoes input,.barra-acoes select{width:100%;padding:10px 12px;border-radius:var(--raio-s);border:1px solid #28415D;background:#0B1B2F;color:var(--texto);font-size:12px;outline:none;}
  .barra-acoes input:focus,.barra-acoes select:focus{border-color:#496785;}
  .barra-acoes .btn-secundario{height:100%;}
  .td-wrap{white-space:normal;min-width:120px;}
  .td-obs{white-space:normal;min-width:170px;max-width:230px;overflow:hidden;text-overflow:ellipsis;}
  .acoes-linha{display:flex;gap:5px;white-space:nowrap;}
  .btn-tabela{padding:6px 10px;font-size:10px;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  .badge-verde{background:rgba(34,197,94,.15);color:#4ADE80;}
  .badge-amarelo{background:rgba(242,178,58,.15);color:#F2B23A;}
  .badge-vermelho{background:rgba(229,39,45,.15);color:#F26D6D;}
  .badge-cinza{background:rgba(124,139,160,.15);color:#9CAAC0;}

  /* ===== Modal ===== */
  .modal-fundo{position:fixed;inset:0;background:rgba(3,7,14,.72);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;}
  .modal{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-l);padding:26px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;}
  .modal h2{margin:0 0 18px;font-size:18px;}
  .campo-modal{margin-bottom:14px;}
  .campo-modal label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--texto-fraco);font-weight:700;margin-bottom:6px;}
  .campo-modal input,.campo-modal select,.campo-modal textarea{width:100%;padding:10px 12px;border-radius:var(--raio-s);border:1px solid var(--borda);background:var(--superficie-sutil);color:var(--texto);font-size:13.5px;box-sizing:border-box;}
  .campo-modal textarea{resize:vertical;min-height:70px;font-family:inherit;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-acoes{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;}
  .resultados-busca-pessoa{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--fundo);border:1px solid var(--acento);border-radius:var(--raio-s);max-height:220px;overflow-y:auto;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.5);}
  .item-resultado-pessoa{padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--borda);display:flex;flex-direction:column;gap:2px;}
  .item-resultado-pessoa:last-child{border-bottom:none;}
  .item-resultado-pessoa:hover{background:var(--superficie-sutil);}
  .item-resultado-pessoa b{font-size:12.5px;color:#fff;}
  .item-resultado-pessoa span{font-size:11px;color:var(--texto-fraco);}
  .aviso-perfil{background:rgba(242,178,58,.12);border:1px solid rgba(242,178,58,.35);color:#F2B23A;padding:11px 15px;border-radius:var(--raio-s);font-size:12px;margin-bottom:16px;}
  .kpis-mini-row{display:flex;gap:10px;flex-wrap:wrap;}
  .kpi-mini{display:flex;align-items:center;gap:10px;background:var(--superficie);border:1px solid var(--borda);border-radius:12px;padding:9px 14px;min-width:130px;}
  .icone-kpi-mini{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .num-kpi-mini{font-size:16px;font-weight:800;color:#fff;line-height:1;}
  .rot-kpi-mini{font-size:9px;color:var(--texto-fraco);margin-top:2px;text-transform:uppercase;letter-spacing:.3px;}



  /* ===== DASHBOARD PREMIUM ===== */
  .dash-topo{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap;}
  .dash-topo h2{margin:0;font-size:24px;font-weight:900;}
  .dash-topo p{margin:5px 0 0;color:var(--texto-fraco);font-size:11.5px;}
  .dash-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px;}
  .dash-kpi{position:relative;overflow:hidden;background:linear-gradient(180deg,#0B1B2F,#091626);border:1px solid var(--borda);border-radius:14px;padding:16px 16px 14px;min-height:96px;}
  .dash-kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acento);}
  .dash-kpi .icone{position:absolute;right:13px;top:12px;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(229,39,45,.12);font-size:15px;}
  .dash-kpi .valor{font-size:29px;line-height:1;font-weight:900;color:#fff;}
  .dash-kpi .label{margin-top:8px;font-size:9px;text-transform:uppercase;letter-spacing:.6px;font-weight:900;color:#8EA3BF;max-width:150px;}
  .dash-grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;margin-bottom:14px;}
  .dash-grid-3{display:grid;grid-template-columns:1.1fr .9fr .8fr;gap:14px;margin-bottom:14px;}
  .dash-card{background:var(--superficie);border:1px solid var(--borda);border-radius:14px;padding:16px;min-width:0;}
  .dash-card h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#DDE6F2;}
  .dash-sub{font-size:10px;color:var(--texto-fraco);margin-top:4px;}
  .dash-status-wrap{display:flex;align-items:center;gap:24px;min-height:210px;}
  .dash-donut{width:150px;height:150px;border-radius:50%;position:relative;flex:0 0 150px;}
  .dash-donut::after{content:"";position:absolute;inset:30px;border-radius:50%;background:var(--superficie);border:1px solid var(--borda);}
  .dash-donut-centro{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
  .dash-donut-centro b{font-size:25px;color:#fff;}
  .dash-donut-centro span{font-size:8px;text-transform:uppercase;color:var(--texto-fraco);font-weight:900;letter-spacing:.5px;}
  .dash-legenda{display:flex;flex-direction:column;gap:9px;flex:1;}
  .dash-legenda-item{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:8px;font-size:11px;color:var(--texto-suave);}
  .dash-legenda-cor{width:8px;height:8px;border-radius:50%;}
  .dash-legenda-item b{color:#fff;}
  .dash-barras{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .dash-barra-linha{display:grid;grid-template-columns:minmax(100px,180px) 1fr 36px;align-items:center;gap:10px;}
  .dash-barra-rot{font-size:10px;color:var(--texto-suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dash-barra-trilho{height:8px;border-radius:20px;background:#12253B;overflow:hidden;}
  .dash-barra-preench{height:100%;border-radius:20px;background:linear-gradient(90deg,#D61F26,#F05258);}
  .dash-barra-num{text-align:right;font-size:10px;color:#fff;font-weight:800;}
  .dash-lista{margin-top:13px;display:flex;flex-direction:column;gap:7px;}
  .dash-lista-item{display:grid;grid-template-columns:1.15fr .8fr auto;gap:9px;align-items:center;padding:8px 9px;border:1px solid #17304C;border-radius:9px;background:#09182A;font-size:10.5px;}
  .dash-lista-item b{font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dash-lista-item span{color:#8EA3BF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dash-bairros{margin-top:13px;display:flex;flex-direction:column;gap:9px;}
  .dash-bairro-linha{display:grid;grid-template-columns:120px 1fr 32px;gap:8px;align-items:center;font-size:10px;}
  .dash-bairro-linha .nome{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--texto-suave);}
  .dash-bairro-linha .trilho{height:7px;border-radius:10px;background:#12253B;overflow:hidden;}
  .dash-bairro-linha .fill{height:100%;background:#426B9B;border-radius:10px;}
  .dash-bairro-linha b{text-align:right;color:#fff;}
  .acoes-rapidas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px;}
  .acao-rapida{border:1px solid var(--borda);background:#0A1A2E;color:#E9EFF8;padding:12px 9px;border-radius:10px;text-align:left;font-weight:800;font-size:10.5px;cursor:pointer;}
  .acao-rapida:hover{border-color:#476685;background:#0D2239;}
  .acao-rapida span{display:block;font-size:16px;margin-bottom:5px;}
  .dash-agenda-lista{margin-top:13px;display:flex;flex-direction:column;gap:8px;}
  .dash-agenda-item{display:grid;grid-template-columns:52px 1fr;gap:9px;padding:8px;border:1px solid #17304C;border-radius:9px;background:#09182A;}
  .dash-agenda-data{font-size:9px;color:#FF6B70;font-weight:900;text-align:center;text-transform:uppercase;}
  .dash-agenda-texto b{display:block;font-size:10.5px;color:#fff;}
  .dash-agenda-texto span{font-size:9.5px;color:#8198B7;}
  .dash-rodape{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .dash-indicador{background:#081625;border:1px solid var(--borda);border-radius:12px;padding:12px 14px;}
  .dash-indicador b{display:block;font-size:19px;color:#fff;}
  .dash-indicador span{font-size:8.5px;text-transform:uppercase;color:#7F91AA;font-weight:900;letter-spacing:.5px;}
  .dash-vazio{padding:28px 10px;text-align:center;color:var(--texto-fraco);font-size:11px;}

  @media(max-width:1150px){
    .dash-kpis{grid-template-columns:repeat(3,1fr);}
    .dash-grid-3{grid-template-columns:1fr 1fr;}
    .dash-grid-3 .dash-card:last-child{grid-column:1/-1;}
  }
  @media(max-width:820px){
    .dash-kpis{grid-template-columns:1fr 1fr;}
    .dash-grid-2,.dash-grid-3{grid-template-columns:1fr;}
    .dash-grid-3 .dash-card:last-child{grid-column:auto;}
    .dash-status-wrap{flex-direction:column;align-items:flex-start;}
    .dash-rodape{grid-template-columns:1fr;}
  }
  @media(max-width:520px){
    .dash-kpis{grid-template-columns:1fr;}
    .acoes-rapidas{grid-template-columns:1fr;}
    .dash-barra-linha{grid-template-columns:95px 1fr 28px;}
  }

  /* ===== AGENDA — layout do Tatiquinho adaptado ao Murillo ===== */
  main.modo-agenda{height:calc(100vh - 122px);overflow:hidden;display:flex;flex-direction:column;padding-bottom:20px;}
  main.modo-agenda .topo-pagina{flex:0 0 auto;}
  .agenda-layout{display:flex;gap:16px;flex:1;min-height:0;}
  .agenda-layout > .agenda-box{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
  .agenda-layout > .agenda-box.agenda-lateral{flex:0 0 320px;}
  .agenda-box{background:var(--superficie);border:1px solid var(--borda);border-radius:var(--raio-m);padding:16px 18px;}
  .agenda-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex:0 0 auto;}
  .mes-atual-agenda{font-size:15px;color:#fff;text-transform:capitalize;min-width:150px;text-align:center;}
  .btn-nav-mes{background:var(--superficie-sutil);border:1px solid var(--borda);color:var(--texto);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:17px;line-height:1;flex-shrink:0;}
  .btn-nav-mes:hover{border-color:var(--acento);color:#fff;background:rgba(229,39,45,.12);}
  .agenda-cabecalho-dias{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:clamp(8px,1.2vw,10px);color:#7892B6;font-weight:900;letter-spacing:.45px;margin-bottom:6px;flex:0 0 auto;}
  .agenda-grade{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,minmax(0,1fr));gap:4px;flex:1;min-height:0;}
  .dia-agenda{border:1px solid var(--borda);border-radius:8px;padding:5px 7px;cursor:pointer;transition:border-color .15s ease,background .15s ease;min-height:0;overflow:hidden;display:flex;flex-direction:column;background:#09182A;}
  .dia-agenda:hover{border-color:#476685;background:#0C1E33;}
  .dia-agenda.vazio{border-color:transparent;background:transparent;cursor:default;}
  .dia-agenda.vazio:hover{border-color:transparent;background:transparent;}
  .dia-agenda.hoje{border-color:var(--acento);}
  .dia-agenda.hoje .num-dia-agenda{color:#FF6469;}
  .dia-agenda.selecionado{background:#152034;border-color:var(--acento);box-shadow:inset 0 0 0 1px rgba(229,39,45,.25);}
  .num-dia-agenda{font-size:clamp(10px,1.2vw,12.5px);font-weight:800;color:var(--texto);}
  .pontos-dia-agenda{display:flex;gap:3px;margin-top:auto;flex-wrap:wrap;align-items:center;}
  .ponto-evento{width:5px;height:5px;border-radius:50%;background:var(--acento);display:inline-block;flex-shrink:0;}
  .mais-pontos{font-size:8px;color:var(--texto-fraco);font-weight:800;}
  .agenda-lateral h3{margin:0 0 12px;font-size:14px;color:#fff;font-weight:900;flex:0 0 auto;}
  .lista-eventos-dia{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto;}
  .item-evento-dia{display:flex;gap:9px;cursor:pointer;padding:8px;border-radius:8px;transition:background .15s ease;flex-shrink:0;border:1px solid transparent;}
  .item-evento-dia:hover{background:var(--superficie-sutil);border-color:var(--borda);}
  .faixa-evento{width:3px;border-radius:4px;background:var(--acento);flex-shrink:0;}
  .hora-evento-dia{font-size:10px;color:#FF696E;font-weight:900;text-transform:uppercase;letter-spacing:.3px;}
  .titulo-evento-dia{font-size:12.5px;color:#fff;font-weight:800;margin-top:2px;}
  .desc-evento-dia{font-size:11px;color:var(--texto-suave);margin-top:2px;line-height:1.35;}
  .meta-evento-dia{font-size:10px;color:#7892B6;margin-top:3px;}
  @media(max-width:900px){
    main.modo-agenda{height:auto;min-height:calc(100vh - 120px);overflow-y:auto;}
    .agenda-layout{flex-direction:column;min-height:850px;}
    .agenda-layout > .agenda-box.agenda-lateral{flex:0 0 260px;}
    .agenda-layout > .agenda-box:first-child{min-height:560px;}
  }
  @media(max-width:600px){
    .agenda-box{padding:12px;}
    .agenda-grade{gap:3px;min-height:500px;}
    .dia-agenda{padding:4px;}
  }

  @media(max-width:1180px){
    .topo-pagina-atend{grid-template-columns:1fr;}
    .topo-pagina-atend .btn-primario{justify-self:start;}
    .kpis-faixa{width:100%;}
    .data-topo{display:none;}
  }
  @media(max-width:820px){
    main.modo-atendimentos{height:auto;min-height:calc(100vh - 110px);overflow:visible;padding:14px 12px 24px;}
    main.modo-atendimentos .tabela-box{max-height:calc(100vh - 300px);overflow:auto;}
    main.modo-atendimentos table{min-width:1120px;table-layout:auto;}
    main.modo-atendimentos thead th{white-space:nowrap;}
    main.modo-atendimentos tbody td{white-space:nowrap;}
    header.topo-app{padding:10px 14px;gap:10px;flex-wrap:wrap;}
    .marca-topo{display:none;}
    .logo-topo img{height:40px;}
    .saudacao-bloco h2{font-size:17px;}
    .saudacao-bloco .sub{display:none;}
    .topo-direita{gap:8px;}
    .perfil-texto{display:none;}
    main{padding:16px 12px 40px;}
    nav.menu-nav-topo{padding:0 8px;}
    .barra-acoes{grid-template-columns:1fr 1fr;}
    .kpis-faixa{grid-template-columns:1fr 1fr;}
    .kpi-faixa-item:nth-child(2){border-right:none;}
    .kpi-faixa-item:nth-child(-n+2){border-bottom:1px solid var(--borda);}
  }
  @media(max-width:520px){
    .saudacao-bloco{flex:1;}
    .notificacao-topo{display:none;}
    .barra-acoes{grid-template-columns:1fr;}
    .topo-pagina-atend{gap:10px;}
    .topo-pagina h2,.topo-pagina-atend h2{font-size:18px;}
    .kpi-faixa-item .num{font-size:20px;}
    table{font-size:11px;}
  }
</style>
</head>
<body>

<div id="telaSplash">
  <div class="splash-caixa"><img src="./icon-512.png" alt="Gabinete Digital" onerror="this.style.display='none'"></div>
  <div class="splash-titulo">GABINETE <span>DIGITAL</span></div>
  <div class="splash-sub">Vereador Murillo Godoy</div>
  <div class="splash-spin"></div>
  <button id="pularSplash">Não abriu? Toque aqui</button>
</div>

<div id="telaLogin" class="hidden">
  <div class="card-login">
    <div class="login-logo-wrap"><img src="./icon-512.png" alt="Gabinete Digital" onerror="this.style.display='none'"></div>
    <div class="login-eyebrow">Painel de Gestão</div>
    <h1>GABINETE <span>DIGITAL</span></h1>
    <div class="login-subtitulo">Acesso institucional • Vereador Murillo Godoy</div>
    <div class="campo-login email"><input id="inputEmail" type="email" placeholder="E-mail" autocomplete="username"></div>
    <div class="campo-login senha"><input id="inputSenha" type="password" placeholder="Senha" autocomplete="current-password"></div>
    <button id="btnEntrar">Entrar</button>
    <div id="erroLogin"></div>
    <div class="login-rodape">Gabinete Digital • Acesso Seguro</div>
  </div>
</div>

<div id="app" class="hidden">
  <div class="cabecalho-fixo">
  <header class="topo-app">
    <div class="logo-topo">
      <img src="./icon-512.png" alt="Logo" onerror="this.style.display='none'">
      <div class="marca-topo">GABINETE <span>DIGITAL</span></div>
    </div>
    <div class="saudacao-bloco">
      <h2 id="saudacaoTopo">Olá!</h2>
      <div class="sub">Painel Geral de Gestão • Gabinete Digital</div>
    </div>
    <div class="topo-direita">
      <div class="data-topo"><b id="dataTopo">-</b><span id="diaSemanaTopo">-</span></div>
      <button class="notificacao-topo" type="button" title="Notificações">🔔<span class="notificacao-badge" id="notificacaoBadge">0</span></button>
      <div class="perfil-topo">
        <div class="avatar-topo" id="avatarTopo">-</div>
        <div class="perfil-texto"><b id="nomeTopo">-</b><span id="cargoTopo">-</span></div>
      </div>
      <button id="btnSair">↩ Sair</button>
    </div>
  </header>
  <nav class="menu-nav-topo" id="menuNav"></nav>
  </div>
  <main id="conteudo"><div class="carregando-tela">Carregando...</div></main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc,
  onSnapshot, collection, query, orderBy, limit
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ---- Config real do projeto Gabinete-Murillo Godoy ----
const firebaseConfig = {
  apiKey: "AIzaSyD23LG4NhHDRfiHeXCSumKyTiXRV_yk5bc",
  authDomain: "gabinete-murillo-godoy.firebaseapp.com",
  projectId: "gabinete-murillo-godoy",
  storageBucket: "gabinete-murillo-godoy.firebasestorage.app",
  messagingSenderId: "1039162247732",
  appId: "1:1039162247732:web:900c8f90cd7b210930d861"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Expõe pro resto do código (módulos futuros usam window.db, window.auth)
window.__db = db;
window.__auth = auth;

let USUARIO = null;
let UID = null;
let paginaAtual = 'dashboard';
let pararDeOuvirPerfil = null;

const telaSplash = document.getElementById('telaSplash');
const telaLogin = document.getElementById('telaLogin');
const appEl = document.getElementById('app');

function esconderSplash() {
  if (telaSplash.classList.contains('hidden')) return;
  telaSplash.classList.add('hidden');
  telaLogin.classList.remove('hidden');
}
document.getElementById('pularSplash').onclick = esconderSplash;
setTimeout(esconderSplash, 1200);
const inputEmail = document.getElementById('inputEmail');
const inputSenha = document.getElementById('inputSenha');
const btnEntrar = document.getElementById('btnEntrar');
const erroLogin = document.getElementById('erroLogin');
const btnSair = document.getElementById('btnSair');

function mapaErroFirebase(codigo) {
  const mapa = {
    'auth/invalid-email': 'E-mail inválido.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/wrong-password': 'E-mail ou senha incorretos.',
    'auth/user-not-found': 'E-mail ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas. Espera um pouco e tenta de novo.',
    'auth/network-request-failed': 'Falha de conexão. Verifica sua internet.'
  };
  return mapa[codigo] || 'Não foi possível entrar. Tente novamente.';
}

async function fazerLogin() {
  const email = inputEmail.value.trim();
  const senha = inputSenha.value;
  if (!email || !senha) { erroLogin.innerText = 'Preenche e-mail e senha.'; return; }
  btnEntrar.disabled = true; btnEntrar.innerText = 'Entrando...'; erroLogin.innerText = '';
  try {
    await signInWithEmailAndPassword(auth, email, senha);
    // onAuthStateChanged cuida do resto (carregar perfil e abrir o app)
  } catch (e) {
    erroLogin.innerText = mapaErroFirebase(e.code);
    btnEntrar.disabled = false; btnEntrar.innerText = 'Entrar';
  }
}

btnEntrar.onclick = fazerLogin;
inputSenha.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });
inputEmail.addEventListener('keydown', e => { if (e.key === 'Enter') fazerLogin(); });

btnSair.onclick = async () => {
  if (pararDeOuvirPerfil) pararDeOuvirPerfil();
  await signOut(auth);
};

function iniciaisNome(nome) {
  if (!nome) return '?';
  const p = nome.trim().split(' ');
  return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();
}

function rotuloCargo(cargo) {
  const mapa = { ADMIN: 'Administrador', ASSESSOR: 'Assessor', ASSESSORA: 'Assessora', VEREADOR: 'Vereador' };
  return mapa[cargo] || cargo || '-';
}

function somenteLeitura() {
  return USUARIO && USUARIO.cargo === 'VEREADOR';
}
window.somenteLeitura = somenteLeitura;
window.getUsuario = () => USUARIO;
window.getUid = () => UID;

const MODULOS = [
  { id: 'dashboard', label: '🏠 Dashboard', admin: false },
  { id: 'eventos', label: '🎉 Eventos', admin: false },
  { id: 'pessoas', label: '📇 Pessoas', admin: false },
  { id: 'atendimentos', label: '👥 Atendimentos', admin: false },
  { id: 'transportes', label: '🚐 Transportes', admin: false },
  { id: 'equipamentos', label: '🏆 Equipamentos', admin: false },
  { id: 'agenda', label: '📅 Agenda', admin: false },
  { id: 'relatorios', label: '📊 Relatórios', admin: false },
  { id: 'usuarios', label: '🔑 Usuários', admin: true },
  { id: 'configuracoes', label: '⚙️ Configurações', admin: true }
];

function montarMenu() {
  const nav = document.getElementById('menuNav');
  const ehAdmin = USUARIO && USUARIO.cargo === 'ADMIN';
  nav.innerHTML = MODULOS
    .filter(m => !m.admin || ehAdmin)
    .map(m => `<button data-mod="${m.id}" class="${paginaAtual === m.id ? 'ativo' : ''}">${m.label}</button>`)
    .join('');
  nav.querySelectorAll('button').forEach(b => {
    b.onclick = () => irPara(b.dataset.mod);
  });
}

function irPara(pagina) {
  paginaAtual = pagina;
  montarMenu();
  const conteudo = document.getElementById('conteudo');
  conteudo.classList.toggle('modo-agenda', pagina === 'agenda');
  conteudo.classList.toggle('modo-atendimentos', pagina === 'atendimentos');
  conteudo.innerHTML = '<div class="carregando-tela">Carregando...</div>';
  const renderFn = window.RENDERIZADORES && window.RENDERIZADORES[pagina];
  if (renderFn) {
    renderFn();
  } else {
    conteudo.innerHTML = `<div class="topo-pagina"><h2>${pagina}</h2></div><div class="painel-box">Módulo em construção.</div>`;
  }
}
window.irPara = irPara;

function saudacaoHora() {
  const h = new Date().getHours();
  if (h < 12) return 'Bom dia';
  if (h < 18) return 'Boa tarde';
  return 'Boa noite';
}

function atualizarDataTopo() {
  const agora = new Date();
  const dataEl = document.getElementById('dataTopo');
  const semanaEl = document.getElementById('diaSemanaTopo');
  if (dataEl) dataEl.innerText = agora.toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' });
  if (semanaEl) {
    const dia = agora.toLocaleDateString('pt-BR', { weekday:'long' });
    semanaEl.innerText = dia.charAt(0).toUpperCase() + dia.slice(1);
  }
}

function abrirApp() {
  telaSplash.classList.add('hidden');
  telaLogin.classList.add('hidden');
  appEl.classList.remove('hidden');
  document.getElementById('saudacaoTopo').innerText = `${saudacaoHora()}, ${USUARIO.nome.split(' ')[0]}! 👋`;
  document.getElementById('nomeTopo').innerText = USUARIO.nome;
  document.getElementById('cargoTopo').innerText = rotuloCargo(USUARIO.cargo);
  const avatarTopo = document.getElementById('avatarTopo');
  avatarTopo.innerHTML = USUARIO.foto
    ? `<img src="${USUARIO.foto}" alt="${USUARIO.nome}">`
    : iniciaisNome(USUARIO.nome);
  atualizarDataTopo();
  montarMenu();
  carregarConfiguraveis().then(() => irPara('dashboard'));
}

function fecharApp() {
  esconderSplash();
  appEl.classList.add('hidden');
  telaLogin.classList.remove('hidden');
  inputEmail.value = ''; inputSenha.value = ''; erroLogin.innerText = '';
  btnEntrar.disabled = false; btnEntrar.innerText = 'Entrar';
  USUARIO = null; UID = null;
}

// Observa login/logout
onAuthStateChanged(auth, async (user) => {
  if (pararDeOuvirPerfil) { pararDeOuvirPerfil(); pararDeOuvirPerfil = null; }

  if (!user) {
    fecharApp();
    return;
  }

  UID = user.uid;
  const refPerfil = doc(db, 'usuarios', user.uid);

  // Ouve o perfil em tempo real: se alguém desativar esse usuário
  // (ativo:false), ele é deslogado na hora, sem precisar recarregar.
  pararDeOuvirPerfil = onSnapshot(refPerfil, (snap) => {
    if (!snap.exists()) {
      erroLogin.innerText = 'Seu usuário não tem perfil cadastrado no sistema. Fala com o administrador.';
      signOut(auth);
      return;
    }
    const dados = snap.data();
    if (dados.ativo !== true) {
      if (!appEl.classList.contains('hidden')) {
        alert('Seu acesso foi desativado. Fala com o administrador.');
      }
      signOut(auth);
      return;
    }
    USUARIO = { ...dados, uid: user.uid };
    if (appEl.classList.contains('hidden')) {
      abrirApp();
    } else {
      // perfil mudou (ex: cargo) enquanto já estava logado — atualiza topo e menu
      document.getElementById('nomeTopo').innerText = USUARIO.nome;
      document.getElementById('cargoTopo').innerText = rotuloCargo(USUARIO.cargo);
      montarMenu();
    }
  }, (erro) => {
    console.error('Erro ao ouvir perfil:', erro);
    erroLogin.innerText = 'Erro ao carregar seu perfil. Tente novamente.';
  });
});

const norm = s => (s || '').toString().trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function badgeStatus(status) {
  const s = norm(status);
  let classe = 'badge-cinza';
  if (s === 'CONCLUIDO' || s === 'SIM' || s === 'ENTREGUE') classe = 'badge-verde';
  else if (s === 'EM ANALISE') classe = 'badge-amarelo';
  else if (s === 'CANCELADO' || s === 'NAO') classe = 'badge-vermelho';
  return `<span class="badge ${classe}">${status || '-'}</span>`;
}
window.badgeStatus = badgeStatus;

function linkWhatsapp(telefone) {
  if (!telefone) return '-';
  const numeros = String(telefone).replace(/\D/g, '');
  if (!numeros) return telefone;
  const comDDI = numeros.length <= 11 ? '55' + numeros : numeros;
  return '<a href="https://wa.me/' + comDDI + '" target="_blank" style="color:#4ADE80;text-decoration:none;font-weight:700;">💬 ' + telefone + '</a>';
}
function linkWhatsappComMensagem(telefone, mensagem) {
  const numeros = String(telefone || '').replace(/\D/g, '');
  if (!numeros) return null;
  const comDDI = numeros.length <= 11 ? '55' + numeros : numeros;
  return 'https://wa.me/' + comDDI + '?text=' + encodeURIComponent(mensagem);
}
function diaEMesNascimento(dataNascimento) {
  const partes = String(dataNascimento || '').split('/');
  if (partes.length < 2) return null;
  const dia = Number(partes[0]), mes = Number(partes[1]);
  if (!dia || !mes) return null;
  return { dia, mes };
}
function diasAteProximoAniversario(dataNascimento) {
  const dm = diaEMesNascimento(dataNascimento);
  if (!dm) return null;
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  let proximo = new Date(hoje.getFullYear(), dm.mes - 1, dm.dia);
  if (proximo < hoje) proximo = new Date(hoje.getFullYear() + 1, dm.mes - 1, dm.dia);
  return Math.round((proximo - hoje) / (1000 * 60 * 60 * 24));
}

let tiposAtendimentoCache = [];
let tiposEquipamentoCache = [];
let pessoasCache = [];
async function carregarConfiguraveis() {
  try {
    const [ta, te, pe] = await Promise.all([
      getDocs(collection(db, 'tiposAtendimento')),
      getDocs(collection(db, 'tiposEquipamento')),
      getDocs(collection(db, 'pessoas'))
    ]);
    tiposAtendimentoCache = ta.docs.map(d => ({ _docId: d.id, ...d.data() })).sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || '')));
    tiposEquipamentoCache = te.docs.map(d => ({ _docId: d.id, ...d.data() })).sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || '')));
    pessoasCache = pe.docs.map(d => ({ _docId: d.id, ...d.data() })).sort((a, b) => String(a.nome || '').localeCompare(String(b.nome || '')));

    tiposAtendimentoCache = []; tiposEquipamentoCache = []; pessoasCache = [];

}

function campoBuscaPessoa(prefixo) {
  return `
    <div class="campo-modal busca-pessoa-wrap" style="position:relative;grid-column:1/-1;">
      <label>Buscar pessoa já cadastrada (nome, CPF, RG, título ou telefone)</label>
      <input id="${prefixo}_buscaPessoa" placeholder="Comece a digitar..." autocomplete="off">
      <div id="${prefixo}_resultadosPessoa" class="resultados-busca-pessoa hidden"></div>
    </div>`;
}
function ligarBuscaPessoa(prefixo, mapaCampos) {
  const input = document.getElementById(prefixo + '_buscaPessoa');
  const resultados = document.getElementById(prefixo + '_resultadosPessoa');
  if (!input || !resultados) return;
  input.addEventListener('input', () => {
    const termo = norm(input.value);
    const termoNumeros = input.value.replace(/\D/g, '');
    if (termo.length < 2) { resultados.classList.add('hidden'); resultados.innerHTML = ''; return; }
    const encontrados = pessoasCache.filter(p =>
      norm(p.nome).includes(termo) ||
      (p.cpf && norm(p.cpf).includes(termo)) ||
      (p.rg && norm(p.rg).includes(termo)) ||
      (p.tituloEleitor && norm(p.tituloEleitor).includes(termo)) ||
      (termoNumeros.length >= 3 && String(p.telefone || '').replace(/\D/g, '').includes(termoNumeros))
    ).slice(0, 6);
    if (!encontrados.length) {
      resultados.innerHTML = '<div class="item-resultado-pessoa">Nenhuma pessoa encontrada. Preencha manualmente abaixo.</div>';
      resultados.classList.remove('hidden');
      return;
    }
    resultados.innerHTML = encontrados.map(p => `
      <div class="item-resultado-pessoa" data-id="${p._docId}">
        <b>${p.nome}</b>
        <span>${p.cpf ? 'CPF ' + p.cpf + ' · ' : ''}${p.telefone || 'sem telefone'}</span>
      </div>`).join('');
    resultados.classList.remove('hidden');
    resultados.querySelectorAll('.item-resultado-pessoa[data-id]').forEach(el => {
      el.onclick = () => {
        const pessoa = pessoasCache.find(p => p._docId === el.dataset.id);
        if (!pessoa) return;
        Object.keys(mapaCampos).forEach(campoPessoa => {
          const alvo = document.getElementById(mapaCampos[campoPessoa]);
          if (alvo && pessoa[campoPessoa]) alvo.value = pessoa[campoPessoa];
        });
        input.value = pessoa.nome;
        resultados.classList.add('hidden');
      };
    });
  });
  document.addEventListener('click', (ev) => {
    if (!ev.target.closest('.busca-pessoa-wrap')) resultados.classList.add('hidden');
  });
}

let filtroAtendTexto = '';
let filtroAtendTextoOriginal = '';
let filtroAtendTipo = '';
let filtroAtendStatus = '';

function valorSeguro(v) {
  return (v === undefined || v === null || String(v).trim() === '') ? '-' : v;
}

function parseDataBR(txt) {
  const m = String(txt || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  d.setHours(0,0,0,0);
  return isNaN(d.getTime()) ? null : d;
}

function cicloDiasAtendimento(a) {
  if (a.cicloDias !== undefined && a.cicloDias !== null && String(a.cicloDias) !== '') return a.cicloDias;
  if (a.ciclo !== undefined && a.ciclo !== null && String(a.ciclo) !== '') return a.ciclo;
  const inicio = parseDataBR(a.data);
  if (!inicio) return '-';
  const fim = parseDataBR(a.finalizado || a.dataFinalizacao || a.finalizadoEm) || new Date();
  fim.setHours(0,0,0,0);
  return Math.max(0, Math.floor((fim - inicio) / 86400000));
}

function opcoesAtendimento(campo) {
  return [...new Set(atendimentosCache.map(a => String(a[campo] || '').trim()).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b, 'pt-BR'));
}

function aplicarFiltroAtend() {
  const textoEl = document.getElementById('fTextoAtend');
  const tipoEl = document.getElementById('fTipoAtend');
  const statusEl = document.getElementById('fStatusAtend');
  filtroAtendTextoOriginal = textoEl ? textoEl.value : filtroAtendTextoOriginal;
  filtroAtendTexto = norm(filtroAtendTextoOriginal);
  filtroAtendTipo = tipoEl ? tipoEl.value : filtroAtendTipo;
  filtroAtendStatus = statusEl ? statusEl.value : filtroAtendStatus;
  desenharAtendimentos();
}
window.aplicarFiltroAtend = aplicarFiltroAtend;

function desenharAtendimentos() {
  const c = document.getElementById('conteudo');
  const lista = atendimentosCache.filter(a => {
    const bateTexto = !filtroAtendTexto ||
      norm(a.nome).includes(filtroAtendTexto) ||
      norm(a.bairro).includes(filtroAtendTexto) ||
      norm(a.telefone).includes(filtroAtendTexto) ||
      norm(a.endereco).includes(filtroAtendTexto) ||
      norm(a.responsavel).includes(filtroAtendTexto) ||
      norm(a.indicador).includes(filtroAtendTexto);

async function salvarAtendimento(docId) {
  const botao = document.getElementById('btnSalvarAtend');

  const dados = {

    observacoes: document.getElementById('m_obs').value.trim(),
    ultimaEdicaoPor: USUARIO.nome,
    ultimaEdicaoData: new Date().toLocaleString('pt-BR')
  };

  try {
    if (docId) {
      await updateDoc(doc(db, 'atendimentos', docId), dados);

      </div>
      <div class="grid-2"><div class="campo-modal"><label>Entrega</label><input id="e_entrega" placeholder="dd/mm/aaaa" value="${(registro.entrega||'').replace(/"/g,'&quot;')}"></div><div class="campo-modal"><label>Responsável</label><input id="e_responsavel" value="${(registro.responsavel||registro.criadoPor||USUARIO.nome||'').replace(/"/g,'&quot;')}"></div></div>
      <div class="grid-2"><div class="campo-modal"><label>Equipamento</label><select id="e_equipamento">${opcoes.map(t => `<option ${norm(t)===norm(registro.equipamento)?'selected':''}>${t}</option>`).join('')}</select></div><div class="campo-modal"><label>Status</label><select id="e_devolucao"><option ${registro.devolucao==='USANDO'?'selected':''}>USANDO</option><option ${registro.devolucao==='ENTREGUE'?'selected':''}>ENTREGUE</option></select></div></div>
      <div class="modal-acoes">
        <button class="btn-secundario" onclick="this.closest('.modal-fundo').remove()">Cancelar</button>
        <button class="btn-primario" id="btnSalvarEquip" onclick="salvarEquip('${registro._docId||''}')">Salvar</button>
      </div>
    </div>`;
  document.body.appendChild(fundo);
  ligarBuscaPessoa('e', { nome: 'e_nome', telefone: 'e_contato' });
}
window.abrirModalEquip = abrirModalEquip;
async function salvarEquip(docId) {
  const botao = document.getElementById('btnSalvarEquip');
  if (botao.disabled) return;
  botao.disabled = true; botao.innerText = 'Salvando...';
  const dados = {
    nome: document.getElementById('e_nome').value.trim(),
    contato: document.getElementById('e_contato').value.trim(),
    equipamento: document.getElementById('e_equipamento').value,
    entrega: document.getElementById('e_entrega').value.trim(),
    responsavel: document.getElementById('e_responsavel').value.trim(),
    devolucao: document.getElementById('e_devolucao').value,
    ultimaEdicaoPor: USUARIO.nome,
    ultimaEdicaoData: new Date().toLocaleString('pt-BR')
  };
  try {
    if (docId) { await updateDoc(doc(db, 'equipamentos', docId), dados); }
    else { dados.criadoPor = USUARIO.nome; await addDoc(collection(db, 'equipamentos'), dados); }
    document.querySelector('.modal-fundo').remove();
    window.RENDERIZADORES.equipamentos();
  } catch (e) {
    alert('Não foi possível salvar: ' + e.message);
    botao.disabled = false; botao.innerText = 'Salvar';
  }
}
window.salvarEquip = salvarEquip;
async function excluirEquip(docId) {
  if (!confirm('Excluir este empréstimo?')) return;
  try { await deleteDoc(doc(db, 'equipamentos', docId)); window.RENDERIZADORES.equipamentos(); }
  catch (e) { alert('Não foi possível excluir: ' + e.message); }
}
window.excluirEquip = excluirEquip;


// ---------------- AGENDA ----------------
// Estrutura visual copiada do padrão da Agenda do Tatiquinho.
// Dados continuam no Firebase do Murillo, coleção agendaEventos.
let agendaEventosCache = [];
let agendaMes = new Date().getMonth();
let agendaAno = new Date().getFullYear();
let agendaSelecionada = new Date();

function dataISOlocal(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dia=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dia}`;
}
function dataBRdeISO(iso){ if(!iso) return '-'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function escapar(v){ return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

window.RENDERIZADORES.agenda = async function(){
  const c=document.getElementById('conteudo');
  c.classList.add('modo-agenda');
  c.innerHTML='<div class="carregando-tela">Carregando agenda...</div>';
  try{
    const snap=await getDocs(collection(db,'agendaEventos'));
    agendaEventosCache=snap.docs.map(d=>({_docId:d.id,...d.data()}));
    const hoje=new Date();
    agendaMes=hoje.getMonth();
    agendaAno=hoje.getFullYear();
    agendaSelecionada=hoje;
    desenharAgenda();
    verificarLembretesAgenda();
  }catch(e){
    c.innerHTML='<div class="painel-box">Não foi possível carregar a agenda: '+escapar(e.message)+'</div>';
  }
};

function eventosDoDiaISO(iso){
  return agendaEventosCache.filter(e=>e.data===iso).sort((a,b)=>String(a.hora||'').localeCompare(String(b.hora||'')));
}

function desenharAgenda(){
  const c=document.getElementById('conteudo');
  const hoje=new Date();
  const primeiroDia=new Date(agendaAno,agendaMes,1).getDay();
  const totalDias=new Date(agendaAno,agendaMes+1,0).getDate();
  const hojeISO=dataISOlocal(hoje);
  const selISO=dataISOlocal(agendaSelecionada);
  const nomeMes=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date(agendaAno,agendaMes,1));

  let celulas='';
  for(let i=0;i<primeiroDia;i++) celulas+='<div class="dia-agenda vazio"></div>';

  for(let dia=1;dia<=totalDias;dia++){
    const iso=`${agendaAno}-${String(agendaMes+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const evs=eventosDoDiaISO(iso);
    celulas+=`
      <div class="dia-agenda ${iso===hojeISO?'hoje':''} ${iso===selISO?'selecionado':''}" onclick="selecionarDiaAgenda('${iso}')">
        <div class="num-dia-agenda">${dia}</div>
        ${evs.length?`<div class="pontos-dia-agenda">${evs.slice(0,3).map(()=>'<span class="ponto-evento"></span>').join('')}${evs.length>3?`<span class="mais-pontos">+${evs.length-3}</span>`:''}</div>`:''}
      </div>`;
  }

  const podeEditar=!somenteLeitura();

  c.innerHTML=`
    <div class="topo-pagina">
      <div>
        <h2>Agenda</h2>
        <div style="width:64px;height:3px;border-radius:4px;background:var(--acento);margin-top:7px;"></div>
      </div>
      ${podeEditar?'<button class="btn-primario" onclick="abrirModalAgenda()">+ Novo Compromisso</button>':''}
    </div>

    <div class="agenda-layout">
      <div class="agenda-box">
        <div class="agenda-nav">
          <button onclick="irParaHojeAgenda()" class="btn-secundario" style="padding:7px 12px;">Hoje</button>
          <div style="display:flex;align-items:center;gap:14px;">
            <button class="btn-nav-mes" onclick="mudarMesAgenda(-1)">‹</button>
            <b class="mes-atual-agenda">${nomeMes.charAt(0).toUpperCase()+nomeMes.slice(1)}</b>
            <button class="btn-nav-mes" onclick="mudarMesAgenda(1)">›</button>
          </div>
        </div>

        <div class="agenda-cabecalho-dias">
          <div>DOM</div><div>SEG</div><div>TER</div><div>QUA</div><div>QUI</div><div>SEX</div><div>SÁB</div>
        </div>
        <div class="agenda-grade">${celulas}</div>
      </div>

      <div class="agenda-box agenda-lateral">
        <h3 id="tituloDiaAgenda">Compromissos</h3>
        <div id="listaEventosDia" class="lista-eventos-dia"></div>
      </div>
    </div>`;

  atualizarPainelDiaAgenda();
}

function atualizarPainelDiaAgenda(){
  const titulo=document.getElementById('tituloDiaAgenda');
  const lista=document.getElementById('listaEventosDia');
  if(!titulo||!lista) return;

  const selISO=dataISOlocal(agendaSelecionada);
  const rotulo=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long'}).format(agendaSelecionada);
  titulo.innerText=rotulo.charAt(0).toUpperCase()+rotulo.slice(1);

  const evs=eventosDoDiaISO(selISO);
  if(!evs.length){
    lista.innerHTML='<p style="color:var(--texto-fraco);font-size:12.5px;">Nenhum compromisso neste dia.</p>';
    return;
  }

  lista.innerHTML=evs.map(ev=>`
    <div class="item-evento-dia" onclick='abrirModalAgenda(${JSON.stringify(ev).replace(/'/g,"&#39;")})'>
      <div class="faixa-evento"></div>
      <div>
        <div class="hora-evento-dia">${escapar(ev.hora||'Sem horário')}${ev.horaFim?' – '+escapar(ev.horaFim):''}</div>
        <div class="titulo-evento-dia">${escapar(ev.titulo||'Compromisso')}</div>
        ${(ev.tipo||ev.local)?`<div class="meta-evento-dia">${escapar(ev.tipo||'COMPROMISSO')}${ev.local?' · '+escapar(ev.local):''}</div>`:''}
        ${ev.observacoes?`<div class="desc-evento-dia">${escapar(ev.observacoes)}</div>`:''}
      </div>
    </div>`).join('');
}

function selecionarDiaAgenda(iso){
  const [y,m,d]=iso.split('-').map(Number);
  agendaSelecionada=new Date(y,m-1,d);
  desenharAgenda();
}

function mudarMesAgenda(delta){
  agendaMes+=delta;
  if(agendaMes<0){agendaMes=11;agendaAno--;}
  if(agendaMes>11){agendaMes=0;agendaAno++;}
  agendaSelecionada=new Date(agendaAno,agendaMes,1);
  desenharAgenda();
}

function irParaHojeAgenda(){
  const hoje=new Date();
  agendaMes=hoje.getMonth();
  agendaAno=hoje.getFullYear();
  agendaSelecionada=hoje;
  desenharAgenda();
}

window.selecionarDiaAgenda=selecionarDiaAgenda;
window.mudarMesAgenda=mudarMesAgenda;
window.irParaHojeAgenda=irParaHojeAgenda;

function abrirModalAgenda(registro={}){
  if(somenteLeitura() && registro._docId===undefined) return;
  const fundo=document.createElement('div');
  fundo.className='modal-fundo';
  fundo.onclick=e=>{if(e.target===fundo)fundo.remove()};
  const dataPadrao=registro.data||dataISOlocal(agendaSelecionada);

  fundo.innerHTML=`<div class="modal" onclick="event.stopPropagation()"><h2>${registro._docId?'Editar':'Novo'} Compromisso</h2>
    <div class="campo-modal"><label>Título</label><input id="ag_titulo" value="${escapar(registro.titulo)}" placeholder="Ex.: Sessão extraordinária"></div>
    <div class="grid-2"><div class="campo-modal"><label>Data</label><input id="ag_data" type="date" value="${dataPadrao}"></div><div class="campo-modal"><label>Tipo</label><select id="ag_tipo">${['SESSÃO','REUNIÃO','ATENDIMENTO','EVENTO','VIAGEM','COMPROMISSO'].map(x=>`<option ${norm(x)===norm(registro.tipo)?'selected':''}>${x}</option>`).join('')}</select></div></div>
    <div class="grid-2"><div class="campo-modal"><label>Início</label><input id="ag_hora" type="time" value="${escapar(registro.hora)}"></div><div class="campo-modal"><label>Fim</label><input id="ag_horaFim" type="time" value="${escapar(registro.horaFim)}"></div></div>
    <div class="campo-modal"><label>Local</label><input id="ag_local" value="${escapar(registro.local)}" placeholder="Ex.: Câmara Municipal"></div>
    <div class="grid-2"><div class="campo-modal"><label>Status</label><select id="ag_status">${['PLANEJADO','CONFIRMADO','REALIZADO','CANCELADO'].map(x=>`<option ${norm(x)===norm(registro.status)?'selected':''}>${x}</option>`).join('')}</select></div><div class="campo-modal"><label>Lembrete</label><select id="ag_lembrete"><option value="1" ${registro.lembrete!==false?'selected':''}>Avisar pela manhã</option><option value="0" ${registro.lembrete===false?'selected':''}>Sem lembrete</option></select></div></div>
    <div class="campo-modal"><label>Observações</label><textarea id="ag_obs">${escapar(registro.observacoes)}</textarea></div>
    <div class="modal-acoes">${registro._docId&&!somenteLeitura()?`<button class="btn-secundario" style="color:#F26D6D" onclick="excluirAgenda('${registro._docId}')">Excluir</button>`:'<span></span>'}<div style="display:flex;gap:8px"><button class="btn-secundario" onclick="this.closest('.modal-fundo').remove()">Cancelar</button>${!somenteLeitura()?`<button class="btn-primario" id="btnSalvarAgenda" onclick="salvarAgenda('${registro._docId||''}')">Salvar</button>`:''}</div></div>
  </div>`;
  document.body.appendChild(fundo);
}
window.abrirModalAgenda=abrirModalAgenda;

async function salvarAgenda(docId){
  const b=document.getElementById('btnSalvarAgenda');
  b.disabled=true;b.innerText='Salvando...';
  const dados={
    titulo:document.getElementById('ag_titulo').value.trim(),
    data:document.getElementById('ag_data').value,
    hora:document.getElementById('ag_hora').value,
    horaFim:document.getElementById('ag_horaFim').value,
    tipo:document.getElementById('ag_tipo').value,
    local:document.getElementById('ag_local').value.trim(),
    status:document.getElementById('ag_status').value,
    lembrete:document.getElementById('ag_lembrete').value==='1',
    observacoes:document.getElementById('ag_obs').value.trim(),
    ultimaEdicaoPor:USUARIO.nome,
    ultimaEdicaoData:new Date().toLocaleString('pt-BR')
  };
  if(!dados.titulo||!dados.data){alert('Informe pelo menos o título e a data.');b.disabled=false;b.innerText='Salvar';return}
  try{
    if(docId) await updateDoc(doc(db,'agendaEventos',docId),dados);
    else{dados.criadoPor=USUARIO.nome;await addDoc(collection(db,'agendaEventos'),dados)}
    document.querySelector('.modal-fundo').remove();
    const [y,m,d]=dados.data.split('-').map(Number);
    agendaAno=y;agendaMes=m-1;agendaSelecionada=new Date(y,m-1,d);
    const snap=await getDocs(collection(db,'agendaEventos'));
    agendaEventosCache=snap.docs.map(x=>({_docId:x.id,...x.data()}));
    desenharAgenda();
  }catch(e){alert('Não foi possível salvar: '+e.message);b.disabled=false;b.innerText='Salvar'}
}

async function excluirAgenda(id){
  if(!confirm('Excluir este compromisso?'))return;
  try{
    await deleteDoc(doc(db,'agendaEventos',id));
    document.querySelector('.modal-fundo').remove();
    const snap=await getDocs(collection(db,'agendaEventos'));
    agendaEventosCache=snap.docs.map(x=>({_docId:x.id,...x.data()}));
    desenharAgenda();
  }catch(e){alert('Não foi possível excluir: '+e.message)}
}
window.salvarAgenda=salvarAgenda;window.excluirAgenda=excluirAgenda;

function verificarLembretesAgenda(){
  const hoje=new Date();
  const iso=dataISOlocal(hoje);
  const evs=agendaEventosCache.filter(e=>e.data===iso && e.lembrete!==false && norm(e.status)!=='CANCELADO');
  if(!evs.length)return;
  const badge=document.getElementById('notificacaoBadge');
  if(badge){badge.textContent=String(evs.length);badge.style.display='flex';}
}

</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(err => console.error('Erro ao registrar Service Worker:', err));
  });
}
</script>
