const log = document.getElementById('log');
function escrever(msg) { log.textContent += '\n' + msg; log.scrollTop = log.scrollHeight; }

document.getElementById('btnLogin').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  try {
    await signInWithEmailAndPassword(auth, email, senha);
    log.textContent = 'Login OK. Pode clicar em "Importar tudo".';
    document.getElementById('btnImportar').disabled = false;
  } catch (e) {
    log.textContent = 'Erro no login: ' + e.message;
  }
};

document.getElementById('btnImportar').onclick = async () => {
  document.getElementById('btnImportar').disabled = true;
  log.textContent = 'Importando...';

  const colecoes = [
    ['atendimentos', DADOS.atendimentos],
    ['transportes', DADOS.transportes],
    ['equipamentos', DADOS.equipamentos],
    ['estoqueEquipamentos', DADOS.estoqueEquipamentos]
  ];

  let totalOk = 0, totalErro = 0;
  for (const [nomeColecao, itens] of colecoes) {
    escrever(`\n--- ${nomeColecao} (${itens.length} itens) ---`);
    for (const item of itens) {
      try {
        await setDoc(doc(db, nomeColecao, item.id), item);
        totalOk++;
      } catch (e) {
        totalErro++;
        escrever(`ERRO em ${nomeColecao}/${item.id}: ${e.message}`);
      }
    }
    escrever(`${nomeColecao}: concluído.`);
  }
  escrever(`\n=== FIM === ${totalOk} documentos importados, ${totalErro} erros.`);
};
